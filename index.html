// ─── 메일 추가/수정 모달 (자식 모달) ─────────────────────────
// thread: 부모 스레드, existingLog: 초기 선택 메일 (null이면 새 추가 모드)
// 모달은 2개 탭으로 구성:
//   1) 수동 입력 — 필드별 직접 입력 또는 기존 메일 선택
//   2) 파싱으로 등록 — 메일 텍스트 붙여넣어서 일괄 추가
// ─── 통화/미팅/메모 입력 폼 (메일 외 간단 항목) ──────────────────
// entryType: '통화' | '미팅' | '메모'
function openSimpleLogForm(thread, existingLog, options) {
  options = options || {};
  const entryType = options.entryType || (existingLog && existingLog.type) || '메모';
  const isEdit = !!existingLog;
  
  const reopenParent = () => openMailThreadDetail(thread);
  
  const titleMap = {
    '통화': { icon: '📞', label: '통화 메모', subjectPlaceholder: '예: 임소영 대리와 시그니처 메뉴 협의' },
    '미팅': { icon: '📅', label: '미팅 메모', subjectPlaceholder: '예: 던킨 매장 방문 — 패키지 협의' },
    '메모': { icon: '📝', label: '자유 메모', subjectPlaceholder: '예: 일정 변동 사항 / 내부 결정' }
  };
  const cfg = titleMap[entryType] || titleMap['메모'];
  
  const t = existingLog || {
    date: todayDs(),
    time: new Date().toTimeString().slice(0, 5),
    direction: '',
    from_id: '',
    to_ids: '',
    subject: '',
    summary: '',
    oneliner: ''
  };
  
  const f = {};
  f.date = makeDateInput({ value: fmtDate(t.date) || '' });
  f.time = makeTimeInput({ value: t.time || '' });
  
  // 발신/수신 (통화에만)
  f.direction = el('select', { class: 'mp-input' });
  [['', '(선택)'], ['발신', '발신 (내가 걸음)'], ['수신', '수신 (받음)']].forEach(([v, l]) => {
    const o = el('option', { value: v }, l);
    if (t.direction === v) o.selected = true;
    f.direction.appendChild(o);
  });
  
  // 참여자 (stakeholder 멀티 선택)
  f.from_id = el('input', { type: 'text', class: 'mp-input', value: t.from_id || '', placeholder: '예: S101 또는 비워두기' });
  f.to_ids = el('input', { type: 'text', class: 'mp-input', value: t.to_ids || '', placeholder: '예: S001, S002 (콤마 구분)' });
  
  const stkDatalist = el('datalist', { id: 'log-stk-datalist' });
  (STATE.data.stakeholders || []).forEach(s => {
    stkDatalist.appendChild(el('option', { 
      value: s.stakeholder_id, 
      label: (s.name_ko || s.name_en || '') + ' (' + (s.org || '') + ')' 
    }));
  });
  
  // 제목 / 한 줄 요약 / 본문
  f.subject = el('input', { type: 'text', class: 'mp-input', value: t.subject || '', placeholder: cfg.subjectPlaceholder });
  f.oneliner = el('input', { type: 'text', class: 'mp-input', value: t.oneliner || '', placeholder: '한 줄 요약 (선택)' });
  f.summary = el('textarea', { class: 'mp-input', rows: 6, placeholder: '상세 내용 / 결정 사항 / 다음 액션' });
  f.summary.value = t.summary || '';
  
  const fieldRow = (label, control, hint) => el('div', { style: { marginBottom: '12px' } }, [
    el('label', { style: { display: 'block', fontSize: '11.5px', fontWeight: '500', color: 'var(--text-muted)', marginBottom: '4px' } }, label),
    control,
    hint ? el('div', { style: { fontSize: '10.5px', color: 'var(--text-faint)', marginTop: '3px' } }, hint) : null
  ].filter(Boolean));
  
  // 좌측 사이드바: 메타 + 날짜/시간/방향/발신자/수신자
  const sidebar = el('div', { class: 'simple-log-sidebar' }, [
    el('div', { class: 'simple-log-meta' }, '스레드: ' + (thread.thread_id || '') + ' · ' + (thread.name || '')),
    buildTypeSwitcher(entryType, () => ({
      date: f.date.value, time: f.time.value,
      direction: entryType === '통화' ? f.direction.value : '',
      from_id: f.from_id.value, to_ids: f.to_ids.value,
      subject: f.subject.value, summary: f.summary.value, oneliner: f.oneliner.value
    }), thread, existingLog),
    el('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' } }, [
      fieldRow('날짜', f.date),
      fieldRow('시간', f.time)
    ]),
    entryType === '통화' ? fieldRow('통화 방향', f.direction) : null,
    fieldRow(entryType === '통화' ? '상대방 (stakeholder ID)' : '발신자 / 작성자', wrapStkField(f.from_id, { multi: false, title: entryType === '통화' ? '상대방 선택 (1명)' : '발신자 선택 (1명)' }), 'ID 직접 입력 또는 [👥 선택]'),
    entryType !== '메모' ? fieldRow('상대방 (수신자) — 콤마 구분', wrapStkField(f.to_ids, { multi: true, title: '수신자 선택 (다중)' })) : null
  ].filter(Boolean));
  
  // 우측 메인: 제목 / 한 줄 요약 / 본문
  const main = el('div', { class: 'simple-log-main' }, [
    fieldRow('제목', f.subject),
    fieldRow('한 줄 요약', f.oneliner, '핵심 흐름 영역에 보임'),
    fieldRow('본문 / 메모', f.summary)
  ]);
  
  const body = el('div', { class: 'simple-log-form-wrap' }, [
    sidebar,
    main,
    stkDatalist
  ]);
  
  const save = async (button) => {
    const data = {
      type: entryType,
      date: f.date.value,
      time: parseTime4(f.time.value) || '',
      direction: entryType === '통화' ? f.direction.value : '',
      from_id: f.from_id.value.trim(),
      to_ids: f.to_ids.value.trim(),
      cc_ids: '',
      subject: f.subject.value.trim(),
      summary: f.summary.value.trim(),
      oneliner: f.oneliner.value.trim(),
      attachments_link: '',
      thread_id: thread.thread_id
    };
    
    if (!data.subject && !data.summary) {
      toast('제목 또는 본문 중 하나는 입력해주세요', 'warn');
      return;
    }
    
    await withButtonLoading(button, async () => {
      if (isEdit) {
        await apiUpdate('logs', existingLog.log_id, data);
      } else {
        await apiCreate('logs', data);
      }    }, {
      loadingText: isEdit ? '저장 중...' : '추가 중...',
      successText: isEdit ? '✓ 저장됨' : '✓ ' + entryType + ' 메모 추가됨'
    });
    closeModal();
    reopenParent();
  };
  
  const remove = async (button) => {
    if (!isEdit) return;
    const ok = confirm('이 ' + entryType + ' 메모를 삭제할까요? (되돌릴 수 없음)');
    if (!ok) return;
    
    await withButtonLoading(button, async () => {
      await apiDelete('logs', existingLog.log_id);    }, { loadingText: '삭제 중...', successText: '✓ 삭제됨' });
    closeModal();
    reopenParent();
  };
  
  openModal({
    title: cfg.icon + ' ' + cfg.label + (isEdit ? ' 수정' : ' 추가'),
    body,
    onClose: reopenParent,
    footer: [
      isEdit ? el('button', { 
        class: 'btn btn-secondary',
        style: { color: 'var(--err, #dc2626)', borderColor: 'rgba(220, 38, 38, 0.3)' },
        onclick: function() { remove(this); }
      }, '🗑 삭제') : null,
      el('button', { class: 'btn btn-secondary', onclick: () => { closeModal(); reopenParent(); } }, '취소'),
      el('button', { 
        class: 'btn btn-primary', 
        onclick: function() { save(this); }
      }, isEdit ? '저장' : '추가')
    ].filter(Boolean)
  });
}

// ─── Stakeholder Picker (브랜드별 그룹화 + 검색 + 다중/단일 선택) ──────
// opts: { triggerEl, multi (true=체크박스, false=라디오), currentIds: [], 
//         onConfirm: (ids) => void, title?: string }
function openStakeholderPicker(opts) {
  // 기존 picker 닫기
  document.querySelectorAll('.stk-picker-popover').forEach(p => p.remove());
  
  const currentIds = (opts.currentIds || []).filter(Boolean);
  const selected = new Set(currentIds);
  const multi = opts.multi !== false;
  
  // 브랜드별 그룹화 (한 사람이 여러 브랜드에 속할 수도 있음)
  const stks = STATE.data.stakeholders || [];
  const brandMap = {};
  stks.forEach(s => {
    const bIds = new Set();
    if (s.related_brand_id) bIds.add(s.related_brand_id);
    String(s.related_brand_ids || '').split(',').map(x => x.trim()).filter(Boolean).forEach(x => bIds.add(x));
    if (s._brand) bIds.add(s._brand);
    if (bIds.size === 0) bIds.add('__unassigned__');
    bIds.forEach(bid => {
      if (!brandMap[bid]) brandMap[bid] = [];
      if (!brandMap[bid].includes(s)) brandMap[bid].push(s);
    });
  });
  
  // 브랜드 순서: B01~B13 → LACONZ/EATS/OLIVE → 미지정
  const sortBrandIds = (a, b) => {
    if (a === '__unassigned__') return 1;
    if (b === '__unassigned__') return -1;
    if (a.startsWith('B') && b.startsWith('B')) return a.localeCompare(b);
    if (a.startsWith('B')) return -1;
    if (b.startsWith('B')) return 1;
    return a.localeCompare(b);
  };
  const allBrandIds = Object.keys(brandMap).sort(sortBrandIds);
  
  // 브랜드 이름 매핑
  const getBrandName = (bid) => {
    if (bid === '__unassigned__') return '(브랜드 미지정)';
    const b = (STATE.data.brands || []).find(x => x.brand_id === bid);
    if (b) return bid + ' ' + (b.brand_name || '');
    // 가상 브랜드 (LACONZ, EATS, OLIVE)
    const aliasMap = { LACONZ: '라꼰즈', EATS: '쿠팡이츠', OLIVE: '올리브파트너스' };
    return bid + (aliasMap[bid] ? ' ' + aliasMap[bid] : '');
  };
  
  // popover 만들기
  const popover = el('div', { class: 'stk-picker-popover' });
  popover.addEventListener('click', e => e.stopPropagation());
  
  // 헤더
  popover.appendChild(el('div', { class: 'stk-picker-header' }, 
    opts.title || (multi ? '연락처 선택 (다중)' : '연락처 선택 (1명)')
  ));
  
  // 검색
  const searchInput = el('input', { 
    type: 'text', 
    placeholder: '이름 / 조직 / 이메일 검색...' 
  });
  popover.appendChild(el('div', { class: 'stk-picker-search' }, [searchInput]));
  
  // 리스트
  const listEl = el('div', { class: 'stk-picker-list' });
  popover.appendChild(listEl);
  
  // 카운트 + 액션
  const countEl = el('span', { class: 'stk-picker-count' });
  const updateCount = () => {
    countEl.textContent = selected.size + '명 선택됨' + (multi ? '' : ' (1명만)');
  };
  
  const renderList = () => {
    const q = searchInput.value.trim().toLowerCase();
    listEl.innerHTML = '';
    
    let totalShown = 0;
    allBrandIds.forEach(bid => {
      const groupStks = brandMap[bid].filter(s => {
        if (!q) return true;
        const blob = [s.name_ko, s.name_en, s.org, s.role, s.team, s.email]
          .filter(Boolean).join(' ').toLowerCase();
        return blob.includes(q);
      });
      if (groupStks.length === 0) return;
      totalShown += groupStks.length;
      
      const group = el('div', { class: 'stk-picker-group' });
      const itemsEl = el('div', { class: 'stk-picker-list-items' });
      
      // 그룹 내 선택 상태
      const totalInGroup = groupStks.length;
      const selectedInGroup = groupStks.filter(s => selected.has(s.stakeholder_id)).length;
      let selectAllLabel, selectAllClass;
      if (selectedInGroup === 0) { selectAllLabel = '전체 선택'; selectAllClass = ''; }
      else if (selectedInGroup === totalInGroup) { selectAllLabel = '전체 해제'; selectAllClass = 'all'; }
      else { selectAllLabel = selectedInGroup + '/' + totalInGroup + ' 선택'; selectAllClass = 'partial'; }
      
      const countLabel = selectedInGroup === 0 
        ? '(' + totalInGroup + ')'
        : '(' + selectedInGroup + '/' + totalInGroup + ')';
      const countClass = selectedInGroup > 0 && selectedInGroup < totalInGroup ? 'partial' : '';
      
      const headerChildren = [
        el('span', { class: 'stk-picker-group-toggle' }, '▼'),
        el('span', { style: { flex: '1' } }, getBrandName(bid)),
        el('span', { class: 'stk-picker-group-count ' + countClass }, countLabel)
      ];
      
      // 다중 모드일 때만 전체 선택 버튼 표시
      if (multi && totalInGroup > 1) {
        const selectAllBtn = el('button', {
          type: 'button',
          class: 'stk-picker-group-select-all ' + selectAllClass,
          onclick: (ev) => {
            ev.stopPropagation();
            if (selectedInGroup === totalInGroup) {
              // 모두 해제
              groupStks.forEach(s => selected.delete(s.stakeholder_id));
            } else {
              // 모두 선택
              groupStks.forEach(s => selected.add(s.stakeholder_id));
            }
            renderList();
            updateCount();
          }
        }, selectAllLabel);
        headerChildren.push(selectAllBtn);
      }
      
      const groupHeader = el('div', { class: 'stk-picker-group-header' }, headerChildren);
      groupHeader.onclick = (ev) => { 
        ev.stopPropagation();
        // 버튼 클릭이면 무시
        if (ev.target.classList.contains('stk-picker-group-select-all')) return;
        group.classList.toggle('collapsed'); 
      };
      group.appendChild(groupHeader);
      
      groupStks.forEach(s => {
        const inputType = multi ? 'checkbox' : 'radio';
        const input = el('input', { 
          type: inputType,
          name: 'stk-picker-' + inputType,
          'data-stk-id': s.stakeholder_id
        });
        input.checked = selected.has(s.stakeholder_id);
        
        const itemInfo = el('div', { class: 'stk-picker-item-info' }, [
          el('div', { class: 'stk-picker-item-name' }, s.name_ko || s.name_en || '?'),
          el('div', { class: 'stk-picker-item-meta' }, 
            [s.org, s.role].filter(Boolean).join(' · ') || '—'
          ),
          s.email ? el('div', { class: 'stk-picker-item-email' }, s.email) : null
        ].filter(Boolean));
        
        const item = el('div', { class: 'stk-picker-item' }, [input, itemInfo]);
        
        const toggle = () => {
          if (multi) {
            input.checked = !input.checked;
          } else {
            // 라디오: 다른 모든 라디오 해제
            popover.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
            input.checked = true;
            selected.clear();
          }
          if (input.checked) selected.add(s.stakeholder_id);
          else selected.delete(s.stakeholder_id);
          updateCount();
        };
        
        // 행 전체 클릭 = 토글
        item.onclick = (ev) => {
          ev.stopPropagation();
          if (ev.target === input) return;  // 체크박스 자체 클릭은 native
          toggle();
        };
        
        // 체크박스/라디오 native 클릭
        input.onclick = (ev) => {
          ev.stopPropagation();
          // 라디오는 native에서 다른 게 알아서 unchecked 되니까 selected만 갱신
          if (!multi) {
            selected.clear();
          }
          if (input.checked) selected.add(s.stakeholder_id);
          else selected.delete(s.stakeholder_id);
          updateCount();
        };
        
        itemsEl.appendChild(item);
      });
      
      group.appendChild(itemsEl);
      listEl.appendChild(group);
    });
    
    if (totalShown === 0) {
      listEl.appendChild(el('div', { 
        style: { padding: '24px', textAlign: 'center', color: 'var(--text-faint)', fontSize: '12px' }
      }, q ? '"' + q + '" 매칭 결과 없음' : '연락처 없음'));
    }
  };
  
  searchInput.addEventListener('input', renderList);
  searchInput.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') {
      ev.preventDefault();
      popover.remove();
    }
  });
  
  // 푸터
  popover.appendChild(el('div', { class: 'stk-picker-footer' }, [
    countEl,
    el('div', { class: 'stk-picker-actions' }, [
      el('button', { 
        type: 'button',
        class: 'btn btn-secondary', 
        style: { fontSize: '11.5px', padding: '5px 12px' },
        onclick: (ev) => { ev.stopPropagation(); popover.remove(); }
      }, '취소'),
      el('button', { 
        type: 'button',
        class: 'btn btn-primary', 
        style: { fontSize: '11.5px', padding: '5px 14px' },
        onclick: (ev) => { 
          ev.stopPropagation();
          if (opts.onConfirm) opts.onConfirm(Array.from(selected));
          popover.remove();
        }
      }, '추가')
    ])
  ]));
  
  // 위치 계산 (triggerEl 아래)
  document.body.appendChild(popover);
  renderList();
  updateCount();
  
  if (opts.triggerEl) {
    const rect = opts.triggerEl.getBoundingClientRect();
    const popH = popover.offsetHeight || 400;
    const popW = popover.offsetWidth || 380;
    const winH = window.innerHeight;
    const winW = window.innerWidth;
    
    let top = rect.bottom + window.scrollY + 4;
    if (rect.bottom + popH > winH - 20) {
      top = Math.max(20 + window.scrollY, rect.top + window.scrollY - popH - 4);
    }
    let left = rect.left + window.scrollX;
    if (left + popW > winW - 12) left = winW - popW - 12 + window.scrollX;
    if (left < 12) left = 12;
    
    popover.style.top = top + 'px';
    popover.style.left = left + 'px';
  } else {
    // triggerEl 없으면 화면 중앙
    popover.style.top = (window.scrollY + 80) + 'px';
    popover.style.left = ((window.innerWidth - 380) / 2) + 'px';
  }
  
  setTimeout(() => searchInput.focus(), 50);
  
  // 외부 클릭 시 닫기
  setTimeout(() => {
    const outClick = (e) => {
      if (!popover.contains(e.target) && e.target !== opts.triggerEl) {
        popover.remove();
        document.removeEventListener('click', outClick);
      }
    };
    document.addEventListener('click', outClick);
  }, 0);
  
  return popover;
}

// ─── 발신자/수신자 필드 옆 picker 버튼 wrap 만들기 헬퍼 ──────────
// input + 버튼을 stk-pick-wrap으로 감쌈
function wrapStkField(inputEl, opts) {
  // opts: { multi, title, label }
  const btn = el('button', {
    type: 'button',
    class: 'stk-pick-btn',
    title: opts.title || '연락처 선택'
  }, '👥 선택');
  
  btn.onclick = (ev) => {
    ev.stopPropagation();
    const currentIds = String(inputEl.value || '')
      .split(',').map(x => x.trim()).filter(Boolean);
    
    openStakeholderPicker({
      triggerEl: btn,
      multi: opts.multi !== false,
      currentIds: currentIds,
      title: opts.title,
      onConfirm: (ids) => {
        inputEl.value = ids.join(', ');
        // input 이벤트 트리거 (다른 핸들러 알림)
        inputEl.dispatchEvent(new Event('input', { bubbles: true }));
      }
    });
  };
  
  const wrap = el('div', { class: 'stk-pick-wrap' }, [inputEl, btn]);
  return wrap;
}

// ─── Type 전환 칩 헬퍼 (메일 ↔ 통화/미팅/메모) ─────────────────
// currentType: 현재 타입 ('메일'|'통화'|'미팅'|'메모')
// getValues: () => 현재 폼 값 객체 (전환 시 그대로 전달)
// thread, existingLog: 폼 컨텍스트
// 칩 클릭 시: 같은 type이면 무시 / 다른 type이면 → 사라지는 필드 경고 → 모달 전환
function buildTypeSwitcher(currentType, getValues, thread, existingLog) {
  const types = [
    { type: '메일', icon: '📧', label: '메일' },
    { type: '통화', icon: '📞', label: '통화' },
    { type: '미팅', icon: '📅', label: '미팅' },
    { type: '메모', icon: '📝', label: '메모' }
  ];
  
  const wrap = el('div', { class: 'type-switcher' });
  types.forEach(t => {
    const isActive = t.type === currentType;
    const chip = el('button', {
      type: 'button',
      class: 'type-switcher-chip t-' + t.type + (isActive ? ' active' : ''),
      title: t.label + '으로 전환'
    }, [
      el('span', { class: 'type-switcher-chip-icon' }, t.icon),
      el('span', {}, t.label)
    ]);
    
    chip.onclick = (ev) => {
      ev.stopPropagation();
      if (t.type === currentType) return;  // 같은 타입 무시
      
      const values = getValues();
      
      // 사라지는 필드 체크
      const willLose = [];
      if (currentType === '메일' && t.type !== '메일') {
        if (values.cc_ids) willLose.push('참조');
        if (values.attachments_link) willLose.push('첨부 파일명');
        if (values.mail_url) willLose.push('원본 메일 URL');
      }
      if (currentType === '통화' && t.type !== '통화') {
        if (values.direction) willLose.push('통화 방향');
      }
      if (t.type === '메모') {
        if (values.to_ids) willLose.push('수신자');
      }
      
      if (willLose.length > 0) {
        const ok = confirm(
          '【' + currentType + ' → ' + t.type + ' 전환】\n\n' +
          '다음 항목의 값이 비워집니다:\n· ' + willLose.join('\n· ') +
          '\n\n계속할까요?'
        );
        if (!ok) return;
      }
      
      // 새 폼 데이터 — 공통 필드 + 사라지지 않는 필드만 유지
      const transformedLog = Object.assign({}, existingLog || {}, {
        type: t.type,
        date: values.date,
        time: values.time,
        from_id: values.from_id,
        subject: values.subject,
        summary: values.summary,
        oneliner: values.oneliner
      });
      
      // type별 추가 필드 처리
      if (t.type !== '메모') {
        transformedLog.to_ids = values.to_ids || '';
      } else {
        transformedLog.to_ids = '';
      }
      if (t.type === '메일') {
        transformedLog.cc_ids = values.cc_ids || '';
        transformedLog.attachments_link = values.attachments_link || '';
        transformedLog.mail_url = values.mail_url || '';
        transformedLog.direction = '';
      } else {
        transformedLog.cc_ids = '';
        transformedLog.attachments_link = '';
        transformedLog.mail_url = '';
      }
      if (t.type === '통화') {
        transformedLog.direction = values.direction || '';
      }
      
      // 현재 모달 닫고 새 폼 열기
      closeModal();
      setTimeout(() => {
        if (t.type === '메일') {
          openMailEditForm(thread, transformedLog, { initialTab: 'manual' });
        } else {
          openSimpleLogForm(thread, transformedLog, { entryType: t.type });
        }
      }, 50);
    };
    
    wrap.appendChild(chip);
  });
  
  return wrap;
}

// ─── 할 일 (task) 추가/수정 폼 ──────────────────────────────────
// thread: 현재 스레드 (brand_id, thread_id 사용)
// existingTask: 수정 모드면 task 객체, 새로 추가면 null
// options: { insertBeforeDate, insertBeforeTime } — 카드 사이 + 버튼에서 호출 시
function openTaskForm(thread, existingTask, options) {
  options = options || {};
  const isEdit = !!existingTask;
  const t = existingTask || {};
  const brandId = thread.brand_id || '';
  const threadId = thread.thread_id || '';
  
  // 기본 날짜/시간: insertBefore 시 그 시점 직전, 없으면 오늘 + 현재 시간
  const now = new Date();
  const defaultDate = options.insertBeforeDate || fmtDate(t.due_date) || 
    (now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0'));
  const defaultTime = options.insertBeforeTime || (t.due_time || '').slice(0, 5) || 
    (String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0'));
  
  const f = {};
  f.date = makeDateInput({ value: defaultDate });
  f.time = makeTimeInput({ value: defaultTime });
  f.title = el('input', { type: 'text', class: 'mp-input', value: t.title || '', placeholder: '예: 메가커피 측 회신 확인하기' });
  f.priority = el('select', { class: 'mp-input' });
  ['', '낮음', '보통', '높음', '긴급'].forEach(p => {
    const o = el('option', { value: p }, p || '(우선순위 없음)');
    if ((t.priority || '') === p) o.selected = true;
    f.priority.appendChild(o);
  });
  f.description = el('textarea', { class: 'mp-input', rows: 3, placeholder: '상세 메모 (선택)' });
  f.description.value = t.description || '';
  
  const fieldRow = (label, control, hint) => el('div', { style: { marginBottom: '10px' } }, [
    el('label', { style: { display: 'block', fontSize: '11.5px', fontWeight: '500', color: 'var(--text-muted)', marginBottom: '4px' } }, label),
    control,
    hint ? el('div', { style: { fontSize: '10.5px', color: 'var(--text-faint)', marginTop: '3px' } }, hint) : null
  ].filter(Boolean));
  
  const body = el('div', { style: { padding: '8px 0' } }, [
    el('div', { 
      style: { fontSize: '11px', color: 'var(--text-faint)', marginBottom: '12px', 
               padding: '6px 10px', background: 'rgba(107, 114, 128, 0.06)', borderRadius: '5px' } 
    }, '✅ 할 일 · 스레드: ' + threadId + ' · 브랜드: ' + (brandId || '없음')),
    el('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' } }, [
      fieldRow('마감일', f.date),
      fieldRow('마감시간', f.time, '타임라인 정렬 기준')
    ]),
    fieldRow('할 일 내용', f.title),
    fieldRow('우선순위', f.priority),
    fieldRow('상세 메모 (선택)', f.description)
  ]);
  
  const saveBtn = el('button', { class: 'btn btn-primary' }, isEdit ? '저장' : '추가');
  const deleteBtn = isEdit ? el('button', { 
    class: 'btn btn-secondary', 
    style: { color: 'var(--err, #dc2626)' }
  }, '삭제') : null;
  
  const footer = el('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '8px' } }, [
    deleteBtn || el('div', {}),
    el('div', { style: { display: 'flex', gap: '6px' } }, [
      el('button', { class: 'btn btn-secondary', onclick: () => closeModal() }, '취소'),
      saveBtn
    ])
  ]);
  
  saveBtn.onclick = async () => {
    if (!f.title.value.trim()) { toast('할 일 내용을 입력하세요', 'err'); return; }
    
    const data = {
      due_date: f.date.value,
      due_time: parseTime4(f.time.value) || '',
      title: f.title.value.trim(),
      priority: f.priority.value,
      description: f.description.value.trim(),
      brand_id: brandId,
      thread_id: threadId,
      status: isEdit ? (t.status || '대기') : '대기',
      category: '할일'
    };
    
    try {
      await withButtonLoading(saveBtn, async () => {
        if (isEdit) {
          await apiUpdate('tasks', t.task_id, data);
        } else {
          await apiCreate('tasks', data);
        }      });
      toast(isEdit ? '저장됨' : '추가됨', 'ok');
      closeModal();
      // 메일 스레드 모달이 열려있으면 다시 열기 (타임라인 갱신)
      if (typeof openMailThreadDetail === 'function') {
        const updatedThread = (STATE.data.mail_threads || []).find(x => x.thread_id === threadId) || thread;
        setTimeout(() => openMailThreadDetail(updatedThread), 100);
      }
    } catch (err) {
      toast('실패: ' + err.message, 'err');
    }
  };
  
  if (deleteBtn) {
    deleteBtn.onclick = async () => {
      if (!confirm('이 할 일을 삭제할까요?')) return;
      try {
        await withButtonLoading(deleteBtn, async () => {
          await apiDelete('tasks', t.task_id);        });
        toast('삭제됨', 'ok');
        closeModal();
        if (typeof openMailThreadDetail === 'function') {
          const updatedThread = (STATE.data.mail_threads || []).find(x => x.thread_id === threadId) || thread;
          setTimeout(() => openMailThreadDetail(updatedThread), 100);
        }
      } catch (err) {
        toast('실패: ' + err.message, 'err');
      }
    };
  }
  
  openModal({
    title: isEdit ? '✅ 할 일 수정' : '✅ 할 일 추가',
    body: body,
    footer: footer,
    width: '520px'
  });
  
  setTimeout(() => f.title.focus(), 100);
}

// ─── 타임라인 task 카드 렌더 (한 줄 컴팩트 + 인라인 편집/삭제) ───
// onUpdated: 저장 후 호출되는 콜백 (보통 rerenderTimeline) — 시간 변경 시 위치 재정렬
function renderTimelineTask(task, thread, onUpdated) {
  const isDone = (task.status || '').trim() === '완료' || 
                 (task.status || '').toLowerCase() === 'done' ||
                 !!task.completed_at;
  
  const dateShort = (fmtDateShort(task.due_date) || '').split(' ')[0];
  const timeShort = (task.due_time || '').slice(0, 5);
  
  const cb = el('input', { 
    type: 'checkbox', 
    class: 'mt-tl-task-cb',
    'data-task-id': task.task_id
  });
  cb.checked = isDone;
  
  cb.onclick = async (ev) => {
    ev.stopPropagation();
    const newStatus = cb.checked ? '완료' : '대기';
    const data = { status: newStatus };
    if (cb.checked) {
      const now = new Date();
      data.completed_at = now.getFullYear() + '-' + 
        String(now.getMonth() + 1).padStart(2, '0') + '-' + 
        String(now.getDate()).padStart(2, '0');
    } else {
      data.completed_at = '';
    }
    try {
      await apiUpdate('tasks', task.task_id, data);
      // 로컬 STATE 직접 업데이트
      const taskInState = (STATE.data.tasks || []).find(x => x.task_id === task.task_id);
      if (taskInState) Object.assign(taskInState, data);
      card.classList.toggle('done', cb.checked);
      toast(cb.checked ? '✓ 완료' : '↩ 미완료', 'ok');
    } catch (err) {
      cb.checked = !cb.checked;  // 롤백
      toast('실패: ' + err.message, 'err');
    }
  };
  
  // 인라인 편집 모드 전환
  const enterEditMode = () => {
    if (card.classList.contains('editing')) return;
    card.classList.add('editing');
    
    const dateInput = el('input', { 
      type: 'date', class: 'mt-tl-task-inline-input', 
      value: fmtDate(task.due_date) || '',
      style: { maxWidth: '120px', fontSize: '11px' }
    });
    const timeInput = makeTimeInput({ 
      value: timeShort,
      style: { maxWidth: '80px', fontSize: '11px' }
    });
    const titleInput = el('input', { 
      type: 'text', class: 'mt-tl-task-inline-input',
      value: task.title || '',
      placeholder: '할 일 내용...'
    });
    
    const exitEdit = () => {
      card.classList.remove('editing');
      // 다시 일반 렌더
      const newCard = renderTimelineTask(task, thread, onUpdated);
      card.replaceWith(newCard);
    };
    
    const saveEdit = async () => {
      const title = titleInput.value.trim();
      if (!title) { toast('내용을 입력하세요', 'err'); return; }
      // 시간 정규화 — '0930' 입력 후 blur 없이 저장 시도해도 안전
      const parsedTime = parseTime4(timeInput.value) || '';
      const newDate = dateInput.value || '';
      // 시간/날짜 변경 여부 체크 → 변경됐으면 위치 재정렬 필요
      const oldKey = (fmtDate(task.due_date) || '') + ' ' + ((task.due_time || '').slice(0, 5));
      const newKey = newDate + ' ' + parsedTime;
      const timeChanged = oldKey !== newKey;
      
      const data = {
        due_date: newDate,
        due_time: parsedTime,
        title: title
      };
      try {
        await apiUpdate('tasks', task.task_id, data);
        Object.assign(task, data);
        const taskInState = (STATE.data.tasks || []).find(x => x.task_id === task.task_id);
        if (taskInState) Object.assign(taskInState, data);
        toast('✓ 저장됨', 'ok');
        if (timeChanged && typeof onUpdated === 'function') {
          // 시간 변경 — 타임라인 전체 재정렬
          onUpdated();
        } else {
          exitEdit();
        }
      } catch (err) {
        toast('실패: ' + err.message, 'err');
      }
    };
    
    titleInput.onkeydown = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); saveEdit(); }
      else if (e.key === 'Escape') { e.preventDefault(); exitEdit(); }
    };
    
    const saveBtn = el('button', { class: 'mt-tl-task-inline-btn primary' }, '저장');
    saveBtn.onclick = (e) => { e.stopPropagation(); saveEdit(); };
    
    const cancelBtn = el('button', { class: 'mt-tl-task-inline-btn' }, '취소');
    cancelBtn.onclick = (e) => { e.stopPropagation(); exitEdit(); };
    
    // 카드 내용을 편집 폼으로 교체
    card.innerHTML = '';
    card.appendChild(el('div', { class: 'mt-tl-task-time', style: { display: 'flex', flexDirection: 'column', gap: '3px' } }, [dateInput, timeInput]));
    card.appendChild(el('div', { style: { display: 'flex', alignItems: 'center', gap: '8px', minWidth: 0 } }, [
      el('input', { type: 'checkbox', class: 'mt-tl-task-cb', disabled: 'disabled', checked: isDone ? 'checked' : null }),
      titleInput
    ]));
    card.appendChild(el('div', { class: 'mt-tl-task-inline-actions' }, [cancelBtn, saveBtn]));
    
    setTimeout(() => { titleInput.focus(); titleInput.select(); }, 30);
  };
  
  const editBtn = el('button', { 
    class: 'mt-tl-task-btn',
    title: '수정',
    onclick: (ev) => {
      ev.stopPropagation();
      enterEditMode();
    }
  }, '✏');
  
  const deleteBtn = el('button', { 
    class: 'mt-tl-task-btn',
    title: '삭제',
    style: { color: 'var(--err, #dc2626)' },
    onclick: async (ev) => {
      ev.stopPropagation();
      try {
        await apiDelete('tasks', task.task_id);
        // 로컬 STATE에서 제거
        const idx = (STATE.data.tasks || []).findIndex(x => x.task_id === task.task_id);
        if (idx >= 0) STATE.data.tasks.splice(idx, 1);
        // 카드 즉시 fade out + 제거
        card.style.transition = 'opacity 0.18s, transform 0.18s';
        card.style.opacity = '0';
        card.style.transform = 'translateX(-8px)';
        setTimeout(() => {
          card.remove();
          // 위/아래 add-slot도 정리는 다음 rerenderTimeline에서
        }, 180);
        toast('삭제됨', 'ok');
      } catch (err) {
        toast('실패: ' + err.message, 'err');
      }
    }
  }, '🗑');
  
  const card = el('div', { 
    class: 'mt-tl-task' + (isDone ? ' done' : ''),
    'data-task-id': task.task_id 
  }, [
    el('div', { class: 'mt-tl-task-time' }, [
      el('span', { class: 'mt-tl-task-time-date' }, dateShort || '?'),
      timeShort ? el('span', { class: 'mt-tl-task-time-hm' }, timeShort) : null
    ].filter(Boolean)),
    el('div', { class: 'mt-tl-task-content' }, [
      cb,
      el('span', { class: 'mt-tl-task-title', title: task.title || '' }, task.title || '(제목 없음)')
    ]),
    el('div', { class: 'mt-tl-task-actions' }, [editBtn, deleteBtn])
  ]);
  
  return card;
}

// ⚠ 브랜드 미확인 새 메일 빠른 처리 패널
function openUnmatchedMailPanel() {
  const brands = (STATE.data.brands || []);
  const threads = (STATE.data.mail_threads || []);
  const stk = (STATE.data.stakeholders || []);
  const nameOf = (id) => {
    if (!id) return '';
    const s = stk.find(x => x.stakeholder_id === id);
    return s ? (s.name_ko || s.name_en || id) : id;
  };
  const splitIds2 = (str) => String(str || '').split(/[,;]/).map(x => x.trim()).filter(Boolean);

  const unmatched = getNewMails().unmatched.slice();
  const body = el('div', {});

  if (unmatched.length === 0) {
    body.appendChild(el('div', {
      style: { padding: '24px', textAlign: 'center', color: 'var(--text-muted)' }
    }, '미매칭 새 메일이 없습니다 👍'));
  }

  unmatched.forEach(l => {
    const row = el('div', { class: 'um-row' });
    row.appendChild(el('div', { class: 'um-row-subj' }, l.subject || '(제목 없음)'));
    const fromN = nameOf(l.from_id);
    const toN = splitIds2(l.to_ids).map(nameOf).join(', ');
    row.appendChild(el('div', { class: 'um-row-meta' },
      (l.date || '') + ' · ' + (fromN || '?') + (toN ? ' → ' + toN : '')));

    const bsel = el('select', {});
    bsel.appendChild(el('option', { value: '' }, '— 브랜드 선택 —'));
    brands.forEach(b => bsel.appendChild(
      el('option', { value: b.brand_id }, b.brand_id + ' · ' + (b.brand_name || ''))));

    const tsel = el('select', {});
    const fillThreads = (bid) => {
      tsel.innerHTML = '';
      tsel.appendChild(el('option', { value: '' }, '(스레드 자동/없음)'));
      threads.forEach(t => tsel.appendChild(
        el('option', { value: t.thread_id }, t.thread_id + ' · ' + (t.name || ''))));
      const cand = threads.filter(t => String(t.brand_id || '').trim() === bid);
      if (cand.length === 1) tsel.value = cand[0].thread_id;  // 브랜드 스레드 1개면 자동
    };
    fillThreads('');

    const saveBtn = el('button', { class: 'um-save-btn', disabled: true }, '저장');
    bsel.addEventListener('change', () => { fillThreads(bsel.value); saveBtn.disabled = !bsel.value; });

    const controls = el('div', { class: 'um-row-controls' }, [bsel, tsel, saveBtn]);

    saveBtn.addEventListener('click', async () => {
      const bid = bsel.value;
      if (!bid) return;
      const brand = brands.find(b => b.brand_id === bid);
      const patch = { brand_id: bid, category: (brand ? (brand.brand_name || '') : ''), thread_id: tsel.value || '' };
      saveBtn.disabled = true; saveBtn.textContent = '저장 중…';
      try {
        await apiUpdate('logs', l.log_id, patch);
        Object.assign(l, patch);  // STATE 반영 (같은 객체 참조)
        row.classList.add('done');
        controls.replaceWith(el('div', {
          style: { fontSize: '12px', fontWeight: '700', color: '#16a34a' }
        }, '✓ ' + bid + (patch.thread_id ? ' · ' + patch.thread_id : '') + ' 저장됨'));
        toast('✓ 저장됨');
      } catch (err) {
        saveBtn.disabled = false; saveBtn.textContent = '저장';
        toast(err.message || '저장 실패', 'err');
      }
    });

    row.appendChild(controls);
    body.appendChild(row);
  });

  openModal({
    title: '⚠ 브랜드 미확인 메일 ' + unmatched.length + '건',
    body: body,
    wide: true,
    footer: [
      el('button', {
        class: 'btn btn-secondary',
        onclick: () => { closeModal(); renderNav(); renderContent(); }
      }, '닫기')
    ]
  });
}

function openMailEditForm(thread, existingLog, options) {
  options = options || {};
  const threadLogs = (STATE.data.logs || [])
    .filter(x => x.thread_id === thread.thread_id)
    .sort((a, b) => {
      const ak = (a.date || '') + ' ' + (a.time || '');
      const bk = (b.date || '') + ' ' + (b.time || '');
      return bk.localeCompare(ak);
    });
  
  let currentLog = existingLog || null;
  let activeTab = options.initialTab || 'parse';  // 'manual' or 'parse' — 기본: 파싱
  const reopenParent = () => openMailThreadDetail(thread);
  
  const f = {};
  
  // ───────────────────────────────────────
  // 수동 입력 탭 필드들
  // ───────────────────────────────────────
  
  const modeSelect = el('select', { class: 'mp-input' });
  modeSelect.appendChild(el('option', { value: '__new' }, '＋ 새 메일 추가'));
  threadLogs.forEach(log => {
    const fromStk = log.from_id ? (STATE.data.stakeholders || []).find(s => s.stakeholder_id === log.from_id) : null;
    const fromName = fromStk ? (fromStk.name_ko || fromStk.name_en || '?') : '?';
    const subjShort = (log.subject || '(제목 없음)').slice(0, 30);
    const lbl = '✏ ' + (log.date || '?') + ' · ' + fromName + ' · ' + subjShort;
    const opt = el('option', { value: log.log_id }, lbl);
    if (currentLog && currentLog.log_id === log.log_id) opt.selected = true;
    modeSelect.appendChild(opt);
  });
  
  f.date = makeDateInput({ value: '' });
  f.time = makeTimeInput({ value: '' });
  
  const stkOptions = (STATE.data.stakeholders || []).map(s => ({
    id: s.stakeholder_id,
    label: (s.name_ko || s.name_en || '?') + (s.email ? ' <' + s.email + '>' : '')
  }));
  const stkDatalistId = 'stk-datalist-' + Date.now();
  const stkDatalist = el('datalist', { id: stkDatalistId });
  stkOptions.forEach(o => stkDatalist.appendChild(el('option', { value: o.id }, o.label)));
  
  f.from_id = el('input', { type: 'text', class: 'mp-input', placeholder: 'stakeholder ID (예: S0001)' });
  f.to_ids = el('input', { type: 'text', class: 'mp-input', placeholder: 'ID 콤마 구분 (예: S0001, S0002)' });
  f.cc_ids = el('input', { type: 'text', class: 'mp-input', placeholder: 'ID 콤마 구분 (선택)' });
  f.subject = el('input', { type: 'text', class: 'mp-input', placeholder: '메일 제목' });
  f.summary = el('textarea', { class: 'mp-input', rows: 6, placeholder: '본문 (메일 텍스트를 붙여넣으면 자동으로 발신/수신/참조 채워짐)' });
  
  // 본문에 메일 텍스트 붙여넣기 → 자동 파싱 + 빈 필드 채움
  f.summary.addEventListener('paste', (e) => {
    const pasted = (e.clipboardData || window.clipboardData).getData('text');
    if (!pasted || pasted.length < 30) return;  // 너무 짧으면 무시
    
    // 메일 헤더 형식 감지 — 보낸 사람 / 받는 사람 / From: / To: / 참조 중 하나라도 있으면
    const hasMailHeader = /(?:보낸\s*사람|받는\s*사람|참조|^\s*From\s*:|^\s*To\s*:|^\s*Cc\s*:)/im.test(pasted);
    if (!hasMailHeader) return;  // 일반 텍스트 → 그냥 paste
    
    // 파싱 시도
    let parsed;
    try {
      parsed = parseMailText(pasted);
    } catch { return; }
    if (!parsed) return;
    
    // 사용자에게 확인 — 자동 채우기 진행?
    // 빈 필드만 채움 (이미 채워진 거 안 건드림)
    setTimeout(() => {
      const filled = [];
      if (parsed.from_email && !f.from_id.value) {
        const stk = findStakeholderByEmail(parsed.from_email);
        if (stk) { f.from_id.value = stk.stakeholder_id; filled.push('발신자'); }
      }
      if (parsed.to_emails && parsed.to_emails.length && !f.to_ids.value) {
        const ids = parsed.to_emails.map(em => findStakeholderByEmail(em)).filter(Boolean).map(s => s.stakeholder_id);
        if (ids.length) { f.to_ids.value = ids.join(', '); filled.push('수신자'); }
      }
      if (parsed.cc_emails && parsed.cc_emails.length && !f.cc_ids.value) {
        const ids = parsed.cc_emails.map(em => findStakeholderByEmail(em)).filter(Boolean).map(s => s.stakeholder_id);
        if (ids.length) { f.cc_ids.value = ids.join(', '); filled.push('참조'); }
      }
      if (parsed.subject && !f.subject.value) {
        f.subject.value = parsed.subject; filled.push('제목');
      }
      if (parsed.date && !f.date.value) {
        f.date.value = parsed.date; filled.push('날짜');
      }
      if (parsed.time && !f.time.value) {
        f.time.value = parsed.time;
      }
      if (parsed.oneliner && !f.oneliner.value) {
        f.oneliner.value = parsed.oneliner; filled.push('한 줄 요약');
      }
      // 본문은 paste 후 자동으로 들어감 (browser default) — body 파싱 결과로 교체
      if (parsed.body) {
        f.summary.value = parsed.body;
      }
      if (filled.length) {
        toast('✓ 자동 채움: ' + filled.join(', '), 'ok');
      }
    }, 50);
  });
  f.attachments_link = el('textarea', { class: 'mp-input', rows: 2, placeholder: '첨부 파일명 (한 줄에 하나)' });
  f.oneliner = el('input', { type: 'text', class: 'mp-input', placeholder: '한 줄 요약 (선택)' });
  f.mail_url = el('input', { type: 'url', class: 'mp-input', placeholder: '예: https://mail.google.com/mail/u/0/#inbox/abc123' });
  
  const fillFormFromLog = (log) => {
    f.date.value = log ? (fmtDate(log.date) || '') : '';
    f.time.value = log ? (fmtTime(log.time) || '') : '';
    f.from_id.value = log ? (log.from_id || '') : '';
    f.to_ids.value = log ? (log.to_ids || '') : '';
    f.cc_ids.value = log ? (log.cc_ids || '') : '';
    f.subject.value = log ? (log.subject || '') : '';
    f.summary.value = log ? (log.summary || '') : '';
    f.attachments_link.value = log ? (log.attachments_link || '') : '';
    f.oneliner.value = log ? (log.oneliner || '') : '';
    f.mail_url.value = log ? (log.mail_url || '') : '';
  };
  fillFormFromLog(currentLog);
  
  modeSelect.addEventListener('change', () => {
    const v = modeSelect.value;

  const renderParseResults = () => {

        // 중복 감지 — 이 스레드에 이미 같은 메일이 있나?

  const saveManual = async (button) => {
    const data = {
      date: f.date.value,
      time: parseTime4(f.time.value) || '',
      type: '메일',
      from_id: f.from_id.value.trim(),
      to_ids: f.to_ids.value.trim(),
      cc_ids: f.cc_ids.value.trim(),
      subject: f.subject.value.trim(),
      summary: f.summary.value.trim(),
      attachments_link: f.attachments_link.value.trim(),
      oneliner: f.oneliner.value.trim(),
      mail_url: f.mail_url.value.trim(),
      thread_id: thread.thread_id,
      direction: (() => {
        const s = (STATE.data.stakeholders || []).find(x => x.stakeholder_id === f.from_id.value.trim());
        if (s && s.email && /@olivecompany\.co\.kr$/i.test(s.email)) return '발신';
        return '수신';
      })()
    };
    if (!data.date || !data.subject) { toast('날짜와 제목은 필수입니다', 'err'); return; }
    if (data.from_id.startsWith('(미등록:')) { toast('발신자 미등록 — 먼저 연락처에 등록', 'err'); return; }
    
    const isEditing = !!(currentLog && currentLog.log_id);
    await withButtonLoading(button, async () => {
      if (isEditing) {
        await apiUpdate('logs', currentLog.log_id, data);
      } else {
        await apiCreate('logs', data);
      }    }, {
      loadingText: isEditing ? '수정 중...' : '추가 중...',
      successText: isEditing ? '✓ 수정됨' : '✓ 메일 추가됨'
    });
    closeModal();
  };
  
  const saveBulkParsed = async (button) => {
    const toSave = parsedMails.filter((_, i) => parsedSelections[i]);
    if (toSave.length === 0) { toast('등록할 메일을 선택하세요', 'warn'); return; }
    
    const missingStk = toSave.filter(p => !p.fromStk && p.m.from_email);
    if (missingStk.length > 0) {
      const ok = confirm(missingStk.length + '건은 발신자가 등록되지 않은 메일입니다.\n발신자 없이 그대로 저장하시겠습니까?\n(나중에 시트에서 수동 입력 필요)');
      if (!ok) return;
    }
    
    // 수정 모드: 첫 1건 → 기존 메일 갱신, 나머지 → 새 추가
    const isUpdating = !!(currentLog && currentLog.log_id);
    const updateTargetId = isUpdating ? currentLog.log_id : null;
    
    if (isUpdating && toSave.length > 1) {
      const okMulti = confirm(toSave.length + '건 선택됨.\n첫 번째 메일이 현재 메일을 덮어쓰고, 나머지 ' + (toSave.length - 1) + '건은 새로 추가됩니다.\n계속하시겠습니까?');
      if (!okMulti) return;
    }
    
    const buildData = (p) => {
      const m = p.m;
      return {
        date: m.date || '',
        time: m.time || '',
        type: '메일',
        from_id: p.fromStk ? p.fromStk.stakeholder_id : '',
        to_ids: p.toStks.map(s => s.stakeholder_id).join(', '),
        cc_ids: p.ccStks.map(s => s.stakeholder_id).join(', '),
        subject: m.subject || '',
        summary: m.body || '',
        attachments_link: (p.attaches || []).join('\n'),
        oneliner: m.oneliner || '',
        thread_id: thread.thread_id,
        direction: (p.fromStk && p.fromStk.email && /@olivecompany\.co\.kr$/i.test(p.fromStk.email)) ? '발신' : '수신'
      };
    };
    
    await withButtonLoading(button, async () => {
      let saved = 0, failed = 0;
      for (let i = 0; i < toSave.length; i++) {
        const p = toSave[i];
        const data = buildData(p);
        try {
          if (i === 0 && isUpdating) {
            // 첫 건 → 기존 메일 덮어쓰기 (oneliner는 유지)
            data.oneliner = currentLog.oneliner || '';
            await apiUpdate('logs', updateTargetId, data);
          } else {
            await apiCreate('logs', data);
          }
          saved++;
        } catch (e) { failed++; }
      }      if (failed > 0) toast('✓ ' + saved + '건 처리 (실패 ' + failed + '건)', 'warn');
    }, {
      loadingText: (isUpdating ? '갱신' : '일괄 등록') + ' 중 (' + toSave.length + '건)...',
      successText: isUpdating
        ? (toSave.length === 1 ? '✓ 갱신됨' : '✓ 1건 갱신 + ' + (toSave.length - 1) + '건 추가')
        : '✓ ' + toSave.length + '건 등록됨'
    });
    closeModal();
  };
  
  const remove = async (button) => {
    if (!currentLog || !currentLog.log_id) return;
    if (!confirm('이 메일을 삭제할까요?\n(되돌릴 수 없음)')) return;
    await withButtonLoading(button, async () => {
      await apiDelete('logs', currentLog.log_id);    }, {
      loadingText: '삭제 중...',
      successText: '✓ 삭제됨'
    });
    closeModal();
  };
  
  let footerEl = null;
  const updateFooter = () => {
    if (!footerEl) return;
    footerEl.innerHTML = '';
    
    if (activeTab === 'parse') {
      // 파싱 탭: 일괄 등록 버튼만
      const submitBtn = el('button', { class: 'btn btn-primary' }, '선택 일괄 등록');
      submitBtn.onclick = () => saveBulkParsed(submitBtn);
      footerEl.appendChild(el('button', { class: 'btn btn-secondary', onclick: closeModal }, '취소'));
      footerEl.appendChild(submitBtn);
    } else {
      // 수동 입력 탭
      const isEditing = !!(currentLog && currentLog.log_id);
      if (isEditing) {
        const delBtn = el('button', { 
          class: 'btn btn-secondary', 
          style: { color: 'var(--err, #dc2626)', borderColor: 'rgba(220, 38, 38, 0.3)', marginRight: 'auto' }
        }, '🗑 삭제');
        delBtn.onclick = () => remove(delBtn);
        footerEl.appendChild(delBtn);
      }
      footerEl.appendChild(el('button', { class: 'btn btn-secondary', onclick: closeModal }, '취소'));
      const submitBtn = el('button', { class: 'btn btn-primary' }, isEditing ? '수정 저장' : '추가');
      submitBtn.onclick = () => saveManual(submitBtn);
      footerEl.appendChild(submitBtn);
    }
  };
  
  openModal({
    title: '메일 관리 — ' + (thread.thread_id || ''),
    body,
    wide: true,
    onClose: reopenParent,
    footer: [],
    onMount: () => {
      footerEl = document.querySelector('.modal-overlay .modal-footer');
      updateFooter();
    }
  });
}



function openMailThreadForm(existing) {

  });
  
  f.status = el('select', { class: 'mp-input' });

  });
  
  f.current_stage = el('select', { class: 'mp-input' });

  const fieldRow = (label, input) => el('div', { class: 'mp-row' }, [
    el('div', { class: 'mp-label' }, label), input
  ]);

    el('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' } }, [
      fieldRow('브랜드', f.brand_id),
      fieldRow('상태', f.status)
    ]),

    fieldRow('상대측 회사명', f.client_org),

    fieldRow('부제 (한 줄 요약)', f.subtitle),
    fieldRow('다음 액션', f.next_action),
    fieldRow('브랜드 메일함 URL', f.mailbox_url)
  ]);
  
  const body = el('div', { class: 'simple-log-form-wrap' }, [threadSidebar, threadMain]);
  
  openModal({
    title: isEdit ? '메일스레드 편집' : '새 메일스레드',
    body,
    wide: true,
    footer: [
      el('button', { class: 'btn btn-secondary', onclick: closeModal }, '취소'),
      (() => {
        const btn = el('button', { class: 'btn btn-primary' }, isEdit ? '💾 저장' : '＋ 추가');
        btn.onclick = async () => {
          if (!f.name.value.trim()) { toast('스레드 이름을 입력해주세요', 'err'); return; }
          const data = {
            name: f.name.value.trim(),
            subtitle: f.subtitle.value.trim(),
            client_org: f.client_org.value.trim(),
            brand_id: f.brand_id.value,
            status: f.status.value,
            current_stage: f.current_stage.value.trim(),
            next_action: f.next_action.value.trim(),
            kickoff_date: f.kickoff_date.value,
            mailbox_url: f.mailbox_url.value.trim()
          };
          await withButtonLoading(btn, async () => {
            if (isEdit) {
              await apiUpdate('mail_threads', t.thread_id, data);
            } else {
              await apiCreate('mail_threads', data);
            }          }, { loadingText: isEdit ? '저장 중...' : '추가 중...', successText: isEdit ? '✓ 수정됨' : '✓ 추가됨' });
          closeModal();
          renderContent();
        };
        return btn;
      })()
    ]
  });
}

function renderDashboard(root) {
  // 통계
  const today = new Date(); today.setHours(0,0,0,0);
  const in7days = new Date(today.getTime() + 7 * 86400000);
  
  const brands = STATE.data.brands;
  const pendingTasks = STATE.data.tasks.filter(t => t.status === '대기' || t.status === '진행중');
  const upcomingMs = STATE.data.milestones.filter(m => {
    if (!m.date) return false;
    const d = new Date(m.date); d.setHours(0,0,0,0);
    return d >= today && d <= in7days;
  });
  const riskBrands = brands.filter(b => b.risk_flag === true || b.risk_flag === 'TRUE');
  
  // 메일스레드 통계
  const allThreads = STATE.data.mail_threads || [];
  const activeThreads = allThreads.filter(t => (t.status || 'active') === 'active');
  const threadsWithNextAction = activeThreads.filter(t => t.next_action && t.next_action.trim());
  
  const stats = el('div', { class: 'stats' });
  stats.appendChild(statCard('진행 중인 브랜드', brands.filter(b => b.status === '진행중').length, `전체 ${brands.length}개 중`));
  stats.appendChild(statCard('미완료 할 일', pendingTasks.length, '대기 + 진행중', pendingTasks.length > 0 ? 'accent' : ''));
  stats.appendChild(statCard('활성 메일스레드', activeThreads.length, threadsWithNextAction.length + '건 다음 액션 있음', activeThreads.length > 0 ? 'accent' : ''));
  stats.appendChild(statCard('7일 내 일정', upcomingMs.length, '다가오는 마일스톤'));
  stats.appendChild(statCard('위험 플래그', riskBrands.length, '주의 필요 브랜드', riskBrands.length > 0 ? 'warn' : ''));
  root.appendChild(stats);
  
  // 곧 다가오는 마일스톤
  if (upcomingMs.length > 0) {
    const sec = el('section', { class: 'section' }, [
      el('div', { class: 'section-header' }, [
        el('div', { class: 'section-title' }, '7일 내 다가오는 일정'),
        el('div', { class: 'section-sub' }, `${upcomingMs.length}건`)
      ])
    ]);
    const list = el('div', { class: 'ms-timeline' });
    upcomingMs.sort((a,b) => new Date(a.date) - new Date(b.date)).forEach(m => {
      list.appendChild(milestoneItem(m));
    });
    sec.appendChild(list);
    root.appendChild(sec);
  }
  
  // ─── 메일스레드 섹션 (다음 액션 + 최근 업데이트) ───
  if (activeThreads.length > 0) {
    // 마지막 활동일 계산 + 정렬
    const enrichedThreads = activeThreads.map(t => {
      const logs = (STATE.data.logs || []).filter(l => l.thread_id === t.thread_id);
      const lastDate = logs.length > 0 
        ? logs.reduce((max, l) => ((l.date || '') > max ? (l.date || '') : max), '')
        : '';
      return { ...t, _mailCount: logs.length, _lastActivity: lastDate };
    });
    
    // 다음 액션 있는 것 우선, 그다음 최근 활동순
    const sortedThreads = enrichedThreads.slice().sort((a, b) => {
      const aHas = !!(a.next_action || '').trim();
      const bHas = !!(b.next_action || '').trim();
      if (aHas !== bHas) return aHas ? -1 : 1;
      return (b._lastActivity || '').localeCompare(a._lastActivity || '');
    });
    
    const topThreads = sortedThreads.slice(0, 3);
    
    const mtSec = el('section', { class: 'section' }, [
      el('div', { class: 'section-header' }, [
        el('div', { class: 'section-title' }, '활성 메일스레드 ' + activeThreads.length + '건'),
        el('div', { class: 'section-sub' }, '다음 액션 있는 것 우선 / 최근 활동순 · 클릭 → 메일스레드 페이지')
      ])
    ]);
    
    const mtGrid = el('div', { class: 'mt-grid' });
    topThreads.forEach(t => mtGrid.appendChild(mailThreadCard(t)));
    mtSec.appendChild(mtGrid);
    
    if (activeThreads.length > 3) {
      mtSec.appendChild(el('div', { 
        style: { textAlign: 'center', marginTop: '10px' }
      }, [
        el('button', { 
          class: 'btn btn-ghost', 
          onclick: () => navigate('mail_threads'),
          style: { fontSize: '12px' }
        }, '전체 ' + activeThreads.length + '건 보기 →')
      ]));
    }
    root.appendChild(mtSec);
  }
  
  // ─── 운영주체 섹션 (클라이언트 + 대행) ───
  const ORG_PARTNERS = [
    { id: 'EATS',  name: '쿠팡이츠',          role: '클라이언트', color: '#0fae5a' },
    { id: 'OLIVE', name: '올리브파트너스',    role: '운영 대행',  color: '#4f46e5' }
  ];
  const orgSec = el('section', { class: 'section' }, [
    el('div', { class: 'section-header' }, [
      el('div', { class: 'section-title' }, '운영주체'),
      el('div', { class: 'section-sub' }, '클라이언트 + 대행 — 클릭하면 연락처와 최근 활동 보기')
    ])
  ]);
  const orgGrid = el('div', { class: 'brand-grid' });
  ORG_PARTNERS.forEach(p => orgGrid.appendChild(orgPartnerCard(p)));
  orgSec.appendChild(orgGrid);
  root.appendChild(orgSec);
  
  // 라운드별 브랜드 그리드
  const sec2 = el('section', { class: 'section' }, [
    el('div', { class: 'section-header' }, [
      el('div', { class: 'section-title' }, '브랜드 ' + brands.length + '개 / 7개 라운드'),
      el('div', { class: 'section-sub' }, '카드를 클릭하면 상세 보기 / 로그 추가가 가능합니다')
    ])
  ]);
  
  // 라운드별로 그룹
  const byRound = {};
  brands.forEach(b => {
    const r = b.round || 0;
    if (!byRound[r]) byRound[r] = [];
    byRound[r].push(b);
  });
  
  Object.keys(byRound).sort((a,b) => a - b).forEach(r => {
    const group = el('div', { class: 'round-group' });
    const list = byRound[r];
    const launchDate = list[0] ? fmtDate(list[0].launch_date) : '';
    const week = list[0] ? list[0].launch_week : '';
    group.appendChild(el('div', { class: 'round-label' }, [
      el('span', { class: 'round-chip round-' + r }),
      `ROUND ${r}`,
      el('span', { style: { color: 'var(--text-faint)', fontWeight: '400', marginLeft: '6px' } }, 
        `· ${launchDate} (${week})`)
    ]));
    
    const grid = el('div', { class: 'brand-grid' });
    list.forEach(b => grid.appendChild(brandCard(b)));
    group.appendChild(grid);
    sec2.appendChild(group);
  });
  root.appendChild(sec2);
}

function orgPartnerCard(p) {
  // 관련 stakeholder / logs 카운트
  const contacts = (STATE.data.stakeholders || []).filter(s => s._brand === p.id);
  const logs = (STATE.data.logs || []).filter(l => l.brand_id === p.id);
  const recentLogs = logs.slice()
    .sort((a, b) => ((b.date || '') + (b.time || '')).localeCompare((a.date || '') + (a.time || '')))

  brand_name: '브랜드명', aliases: '별칭', round: '라운드', launch_date: '런칭일', launch_week: '런칭 주차',

  contract_model: '모델 계약', contract_brand: '브랜드 계약', menu_dev: '메뉴 개발',
  profile_shoot: '프로필 촬영', payment_status: '입금 상태', brand_color_kv: 'KV 컬러',
  risk_flag: '위험 플래그', memo: '메모'
};

function formatFieldValue(val, type, options) {
  if (val == null || val === '') return '';
  if (type === 'date') {
    const ds = fmtDate(val);
    return ds ? calFmtDisplay(ds) : String(val);
  }
  if (type === 'select' && options) {
    const cur = String(val);
    const found = options.find(o => String(o[0]) === cur);
    if (found) return found[1];
  }
  if (val === true || val === 'TRUE') return '⚠️ 주의 필요';
  if (val === false || val === 'FALSE') return '정상';
  return String(val);
}

function editableRow(brand, label, field, type, options, placeholder) {
  const row = el('div', { class: 'detail-row editable' });
  row.appendChild(el('span', { class: 'key' }, label));
  
  const val = brand[field];
  const displayVal = formatFieldValue(val, type, options);
  const isEmpty = !displayVal;
  
  const valSpan = el('span', {
    class: 'val' + (isEmpty ? ' empty' : ''),
    title: '클릭하여 편집',
  }, displayVal || '—');
  
  valSpan.addEventListener('click', () => startInlineEdit(row, valSpan, brand, field, type, options, placeholder));
  row.appendChild(valSpan);
  
  return row;
}

function startInlineEdit(row, valSpan, brand, field, type, options, placeholder) {
  if (row.classList.contains('editing')) return;
  row.classList.add('editing');
  
  const originalVal = brand[field];
  
  // 편집 input 생성
  let input;
  if (type === 'select') {
    input = el('select', {});
    options.forEach(([v, l]) => {
      const opt = el('option', { value: v }, l);
      let cur = originalVal == null ? '' : String(originalVal);
      // risk_flag: boolean ↔ 'TRUE'/'FALSE'
      if (field === 'risk_flag') cur = (originalVal === true || originalVal === 'TRUE') ? 'TRUE' : 'FALSE';
      if (String(v) === cur) opt.selected = true;
      input.appendChild(opt);
    });
  } else if (type === 'textarea') {
    input = el('textarea', { rows: 3, placeholder: placeholder || '' });
    input.value = originalVal || '';
  } else if (type === 'date') {
    input = el('input', { type: 'text', placeholder: '20260501 / 26-05-01 / 2026-05-01' });
    input.value = fmtDate(originalVal) || '';
  } else {
    input = el('input', { type: 'text', placeholder: placeholder || '' });
    input.value = originalVal == null ? '' : String(originalVal);
  }
  
  valSpan.innerHTML = '';
  valSpan.classList.remove('empty');
  valSpan.appendChild(input);
  
  // focus 후 텍스트 선택
  setTimeout(() => {
    input.focus();
    if (input.select && input.tagName !== 'SELECT') {
      try { input.select(); } catch (e) {}
    }
  }, 10);
  
  let saving = false;
  let cancelled = false;
  
  const restoreView = (val) => {
    row.classList.remove('editing');
    valSpan.classList.remove('saving');
    valSpan.innerHTML = '';
    const display = formatFieldValue(val, type, options);
    valSpan.textContent = display || '—';
    if (!display) valSpan.classList.add('empty');
    else valSpan.classList.remove('empty');
  };
  
  const cancel = () => {
    cancelled = true;
    restoreView(originalVal);
  };
  
  const save = async () => {
    if (saving || cancelled) return;
    saving = true;
    
    let rawVal = input.value;
    let toSend = rawVal;
    
    // 날짜 파싱
    if (type === 'date') {
      if (rawVal && rawVal.trim()) {
        const parsed = calParseInput(rawVal);
        if (!parsed) {
          toast('날짜 형식이 올바르지 않습니다 (예: 20260501)', 'err');
          saving = false;
          input.focus();
          return;
        }
        toSend = parsed;
      } else {
        toSend = '';
      }
    }
    
    // boolean
    if (field === 'risk_flag') {
      toSend = (rawVal === 'TRUE');
    }
    
    // 변경 없음 체크
    const origStr = (type === 'date' && originalVal) ? fmtDate(originalVal) : (originalVal == null ? '' : (originalVal === true ? 'TRUE' : (originalVal === false ? 'FALSE' : String(originalVal))));
    const newStr = toSend === true ? 'TRUE' : (toSend === false ? 'FALSE' : (toSend == null ? '' : String(toSend)));
    if (origStr === newStr) {
      restoreView(originalVal);
      return;
    }
    
    valSpan.classList.add('saving');
    try {
      await apiUpdate('brands', brand.brand_id, { [field]: toSend });
      await logBrandChange(brand, field, originalVal, toSend, type, options);
      brand[field] = toSend;      // 로컬 브랜드 객체도 새 데이터로 갱신
      const refreshed = STATE.data.brands.find(x => x.brand_id === brand.brand_id);
      if (refreshed) Object.assign(brand, refreshed);
      
      restoreView(brand[field]);
      
      // 변경 로그가 추가됐으니 모달 내 timeline 다시 그리기
      refreshDetailTimeline(brand.brand_id);
      
      toast('저장됨');
    } catch (err) {
      toast(err.message || '저장 실패', 'err');
      restoreView(originalVal);
    } finally {
      saving = false;
    }
  };
  
  // 이벤트 바인딩 (타입별)
  if (type === 'select') {
    input.addEventListener('change', save);
    input.addEventListener('blur', () => {
      setTimeout(() => {
        if (!saving && !cancelled && row.classList.contains('editing')) cancel();
      }, 100);
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { e.preventDefault(); cancel(); }
    });
  } else {
    input.addEventListener('blur', save);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && input.tagName !== 'TEXTAREA') {
        e.preventDefault();
        input.blur();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        input.removeEventListener('blur', save);
        cancel();
      }
    });
  }
}

async function logBrandChange(brand, field, oldVal, newVal, type, options) {
  const fieldLabel = BRAND_FIELD_LABELS[field] || field;
  
  const formatForLog = (v) => {
    if (v == null || v === '') return '(빈 값)';
    if (v === true || v === 'TRUE') return '주의 필요';
    if (v === false || v === 'FALSE') return '정상';
    if (type === 'date') {
      const ds = fmtDate(v);
      return ds || String(v);
    }
    if (type === 'select' && options) {
      const found = options.find(o => String(o[0]) === String(v));
      if (found) return found[1];
    }
    return String(v);
  };
  
  const oldStr = formatForLog(oldVal);
  const newStr = formatForLog(newVal);
  
  const now = new Date();
  const today = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const nowtime = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  
  try {
    await apiCreate('logs', {
      date: today,
      time: nowtime,
      type: '변경',
      direction: '내부메모',
      brand_id: brand.brand_id,
      category: '변경이력',
      subject: `${fieldLabel} 변경`,
      summary: `${oldStr} → ${newStr}`,
    });
  } catch (e) {
    console.error('변경 로그 기록 실패:', e);
  }
}

function milestoneItem(m) {
  const item = el('div', { class: 'ms-item' });
  const dd = dDay(m.date);
  if (dd) {
    const diff = m.date ? Math.round((new Date(m.date) - new Date()) / 86400000) : 0;
    let cls = '';
    if (diff < 0) cls = 'past';
    else if (diff <= 3) cls = 'urgent';
    item.appendChild(el('div', { class: 'ms-d-day ' + cls }, dd));
  }
  item.appendChild(el('div', { class: 'ms-date' }, fmtDate(m.date) + (m.round ? ` · Round ${m.round}` : '')));
  item.appendChild(el('div', { class: 'ms-title' }, m.title || '—'));
  if (m.description) item.appendChild(el('div', { class: 'ms-desc' }, m.description));
  return item;
}

function renderRounds(root) {
  const rounds = (STATE.data.rounds || []).slice().sort((a, b) => {
    const na = parseInt(String(a.round_id || 'R99').replace('R', ''), 10);
    const nb = parseInt(String(b.round_id || 'R99').replace('R', ''), 10);
    return na - nb;
  });
  
  // 모든 MC 모음 (stakeholders에서 role='mc' 또는 rounds.mc_ids로)
  const allMcs = new Set();
  rounds.forEach(r => {
    (String(r.mc_ids || '').split(','))
      .map(s => s.trim()).filter(Boolean)
      .forEach(id => allMcs.add(id));
  });
  // mc_names에만 있고 mc_ids 없는 경우도 처리
  const mcStakeholders = (STATE.data.stakeholders || [])
    .filter(s => String(s.role || '').toLowerCase() === 'mc');
  mcStakeholders.forEach(s => allMcs.add(s.stakeholder_id));
  
  const mcList = Array.from(allMcs).map(id => {
    const stk = (STATE.data.stakeholders || []).find(s => s.stakeholder_id === id);
    return { id, name: stk ? (stk.name_ko || stk.name_en || id) : id };
  }).sort((a, b) => a.name.localeCompare(b.name));
  
  // 선택 MC 필터
  STATE.filters.rounds_mc = STATE.filters.rounds_mc || '';
  const selectedMc = STATE.filters.rounds_mc;
  
  const wrap = el('div', { class: 'rounds-page' });
  
  // 헤더
  wrap.appendChild(el('div', { class: 'rounds-page-header' }, [
    el('h2', {}, '라운드 관리'),
    el('div', { class: 'rounds-page-sub' }, '라꼰즈 유튜브 출연 MC + 라운드별 브랜드')
  ]));
  
  // MC 필터 영역
  if (mcList.length > 0) {
    const mcFilter = el('div', { class: 'rounds-mc-filter' }, [
      el('span', { class: 'rounds-mc-label' }, '🎤 MC별 필터'),
      el('span', { 
        class: 'rounds-mc-chip' + (selectedMc === '' ? ' is-active' : ''),
        onclick: () => { STATE.filters.rounds_mc = ''; renderContent(); }
      }, '전체'),
      ...mcList.map(mc => el('span', { 
        class: 'rounds-mc-chip' + (selectedMc === mc.id ? ' is-active' : ''),
        onclick: () => { STATE.filters.rounds_mc = mc.id; renderContent(); }
      }, mc.name))
    ]);
    wrap.appendChild(mcFilter);
  }
  
  // 라운드 카드 그리드
  const grid = el('div', { class: 'rounds-grid' });
  
  rounds.forEach(r => {
    // MC 필터 적용
    if (selectedMc) {
      const mcIds = String(r.mc_ids || '').split(',').map(s => s.trim()).filter(Boolean);
      if (mcIds.indexOf(selectedMc) < 0) return;
    }
    
    // 라운드 번호
    const rNum = parseInt(String(r.round_id || 'R0').replace('R', ''), 10);
    const rCls = (rNum >= 1 && rNum <= 7) ? 'r' + rNum : 'gray';
    
    // 이 라운드의 브랜드들
    const roundBrands = (STATE.data.brands || []).filter(b => 
      String(b.round) === String(rNum)
    ).sort((a, b) => (a.brand_id || '').localeCompare(b.brand_id || ''));
    
    // MC 이름들
    const mcNames = r.mc_names || (
      String(r.mc_ids || '').split(',')
        .map(s => s.trim()).filter(Boolean)
        .map(id => {
          const stk = (STATE.data.stakeholders || []).find(s => s.stakeholder_id === id);
          return stk ? (stk.name_ko || stk.name_en || id) : id;
        }).join(', ')
    );
    
    const card = el('div', { class: 'round-card round-card-' + rCls });

      el('span', { class: 'round-card-date' }, r.launch_date ? fmtDateShort(r.launch_date) : '날짜 미정')
    ]));

      el('span', { class: 'round-card-mc-label' }, '🎤'),
      el('span', { class: 'round-card-mc-names' }, mcNames || '미정')

    // 브랜드 목록

function renderBrandsCompareView(root) {
  // 정렬 상태
  STATE.filters.compareSort = STATE.filters.compareSort || { key: null, dir: 'asc' };
  const { key: sortKey, dir: sortDir } = STATE.filters.compareSort;
  
  // 정렬된 브랜드 목록
  const brands = sortBrandsForCompare(STATE.data.brands || [], sortKey, sortDir);
  
  const section = el('div', { class: 'brands-compare-section' });
  
  // ─── 열 표시 필터 ───
  const allTypesAll = getProcessTypes();  // divider 포함
  const allProcessTypes = allTypesAll.filter(pt => !pt.isDivider);  // process만
  
  // 헤더 클릭 핸들러 (정렬 토글)
  const toggleSort = (key) => {
    if (STATE.filters.compareSort.key === key) {
      // 같은 키 → 방향 토글
      STATE.filters.compareSort.dir = STATE.filters.compareSort.dir === 'asc' ? 'desc' : 'asc';
    } else {
      // 새 키 → asc부터
      STATE.filters.compareSort = { key: key, dir: 'asc' };
    }
    renderContent();
  };
  
  // 화살표 아이콘 (현재 정렬 키만 표시)
  const sortArrow = (key) => {
    if (sortKey !== key) return '';
    return sortDir === 'asc' ? ' ▼' : ' ▲';
  };
  
  const filterChips = [
    el('span', { class: 'col-toggle-label' }, '🎯 열 표시'),
    // 모델(셰프) 칩
    (() => {
      const isHidden = isColHidden('__model__');
      return el('span', { 
        class: 'col-toggle-chip' + (isHidden ? ' is-hidden' : ''),
        onclick: () => {
          toggleHiddenCol('__model__');
          renderContent();
        }
      }, '모델');
    })(),
    ...allProcessTypes.map(pt => {
      const isHidden = isColHidden(pt.id);
      return el('span', { 
        class: 'col-toggle-chip' + (isHidden ? ' is-hidden' : ''),
        onclick: () => {
          toggleHiddenCol(pt.id);
          renderContent();
        }
      }, pt.label);
    }),
    el('span', { 
      class: 'col-toggle-reset',
      onclick: () => {
        setHiddenCols([]);
        renderContent();
      }
    }, '↺ 모두 보기')
  ];
  
  // "기본 정렬" 버튼 — 정렬 변경 시에만 표시
  if (sortKey) {
    filterChips.push(el('span', { 
      class: 'col-toggle-reset',
      style: { marginLeft: '4px' },
      onclick: () => {
        STATE.filters.compareSort = { key: null, dir: 'asc' };
        renderContent();
      }
    }, '↺ 기본 정렬'));
  }
  
  const filterArea = el('div', { class: 'col-toggle-filter' }, filterChips);
  section.appendChild(filterArea);
  
  // ─── 브랜드 표시 필터 ───
  // 칩은 항상 기본 순(round → brand_id), 표 행은 정렬에 따름
  const defaultSortedBrands = sortBrandsForCompare(STATE.data.brands || [], null, 'asc');
  const brandFilterArea = el('div', { class: 'col-toggle-filter brand-filter-area' }, [
    el('span', { class: 'col-toggle-label' }, '🏷️ 브랜드 표시'),
    ...defaultSortedBrands.map(b => {
      const isHidden = isBrandHidden(b.brand_id);
      return el('span', { 
        class: 'col-toggle-chip' + (isHidden ? ' is-hidden' : ''),
        onclick: () => {
          toggleHiddenBrand(b.brand_id);
          renderContent();
        }
      }, b.brand_name || b.brand_id);
    }),
    el('span', { 
      class: 'col-toggle-reset',
      onclick: () => {
        setHiddenBrands([]);
        renderContent();
      }
    }, '↺ 모두 보기')
  ]);
  section.appendChild(brandFilterArea);
  
  // ─── 드래그 바 (가로 스크롤) ───
  const dragKnob = el('span', { class: 'bp-drag-knob' });
  const dragBar = el('div', { 
    class: 'bp-drag-bar', 
    title: '좌우로 끌어서 표 가로 스크롤'
  }, [
    el('span', { class: 'bp-drag-bar-hint-l' }, '◀ 왼쪽'),
    dragKnob,
    el('span', { class: 'bp-drag-bar-hint-r' }, '오른쪽 ▶')
  ]);
  section.appendChild(dragBar);
  
  // ─── visible 컬럼 (divider는 그룹 내 visible이 있을 때만 표시) ───
  const visibleTypes = [];
  let pendingDivider = null;
  let hasVisibleAfterDivider = false;
  
  allTypesAll.forEach(pt => {
    if (pt.isDivider) {
      pendingDivider = pt;
      hasVisibleAfterDivider = false;
      return;
    }
    if (isColHidden(pt.id)) return;
    if (pendingDivider && !hasVisibleAfterDivider) {
      visibleTypes.push(pendingDivider);
      hasVisibleAfterDivider = true;
    }
    visibleTypes.push(pt);
  });
  
  // 가로 스크롤 wrapper
  const scrollWrap = el('div', { class: 'brand-process-scroll-wrap' });
  const table = el('table', { class: 'brand-process-table' });
  
  // ─── thead — 헤더 클릭 시 정렬 ───
  const thead = el('thead');
  const allTypes = visibleTypes;
  
  const headerRow = el('tr');
  
  // 브랜드 헤더 (클릭 가능)
  const brandTh = el('th', { 
    class: 'col-brand sticky-col sortable-col' + (sortKey === 'brand' ? ' is-sorted' : ''),
    onclick: () => toggleSort('brand')
  }, '브랜드' + sortArrow('brand'));
  headerRow.appendChild(brandTh);
  
  // R 헤더 (클릭 가능)
  const roundTh = el('th', { 
    class: 'col-round sortable-col' + (sortKey === 'round' ? ' is-sorted' : ''),
    onclick: () => toggleSort('round')
  }, 'R' + sortArrow('round'));
  headerRow.appendChild(roundTh);
  
  // 모델(셰프) 헤더 — 컬럼 숨기기 토글 대상
  const showModelCol = !isColHidden('__model__');
  if (showModelCol) {
    headerRow.appendChild(el('th', { 
      class: 'col-model sortable-col' + (sortKey === 'model' ? ' is-sorted' : ''),
      onclick: () => toggleSort('model')
    }, '모델' + sortArrow('model')));
  }
  
  // process 컬럼들 (클릭 가능, divider는 클릭 X)
  allTypes.forEach(pt => {
    if (pt.isDivider) {
      headerRow.appendChild(el('th', { class: 'col-divider' }, ''));
    } else {
      const sortK = 'pt:' + pt.id;
      const isSorted = sortKey === sortK;
      headerRow.appendChild(el('th', { 
        class: 'col-process sortable-col' + (isSorted ? ' is-sorted' : ''),
        onclick: () => toggleSort(sortK),
        title: '클릭하여 ' + pt.label + ' 상태순 정렬'
      }, pt.label + sortArrow(sortK)));
    }
  });
  thead.appendChild(headerRow);
  table.appendChild(thead);
  
  // ─── tbody ───
  const tbody = el('tbody');
  brands.forEach(b => {
    if (isBrandHidden(b.brand_id)) return;  // 숨김 브랜드는 행 안 그림
    const isRisk = b.risk_flag === 'TRUE' || b.risk_flag === true;
    const row = el('tr', { class: 'brand-row' });
    
    // 1열: 브랜드명 (sticky — 가로 스크롤 시 고정)
    const brandCell = el('td', { 
      class: 'col-brand sticky-col',
      onclick: (e) => {
        if (e.target.closest('.brand-cell-risk')) return;
        STATE.filters.selected_brand = b.brand_id;
        STATE.filters.brands_view = 'detail';
        STATE.page = 'brands_detail';
        saveLastView();
        renderNav();
        renderTopbar();
        renderContent();
      }
    }, [
      el('div', { class: 'brand-cell-name' }, [
        el('span', { class: 'brand-cell-id' }, b.brand_id || ''),
        el('span', { class: 'brand-cell-bname' }, b.brand_name || '?'),
        isRisk ? el('span', { class: 'brand-cell-risk', title: '위험 플래그' }, '⚠️') : null
      ].filter(Boolean))
    ]);
    row.appendChild(brandCell);
    
    // 2열: 라운드 칩
    const rNum = parseInt(b.round || '0', 10);
    const rCls = (rNum >= 1 && rNum <= 7) ? 'r' + rNum : 'gray';
    row.appendChild(el('td', { class: 'col-round' }, 
      b.round 
        ? el('span', { class: 'round-chip round-' + rCls }, 'R' + b.round)
        : el('span', { class: 'round-chip round-gray' }, '?')
    ));
    
    // 모델(셰프) 셀 — 활동명 + 본명
    if (showModelCol) {
      const chefAlias = b.chef_alias || '';
      const chefName = b.chef_real_name || '';
      row.appendChild(el('td', { class: 'col-model' }, [
        chefAlias ? el('div', { class: 'col-model-alias' }, chefAlias) : null,
        chefName && chefName !== chefAlias ? el('div', { class: 'col-model-name' }, chefName) : null,
        !chefAlias && !chefName ? el('span', { style: { color: 'var(--text-faint)' } }, '—') : null
      ].filter(Boolean)));
    }
    
    // 3~N열: 프로세스 셀들 + divider 빈 컬럼
    allTypes.forEach(pt => {
      if (pt.isDivider) {
        row.appendChild(el('td', { class: 'col-divider' }));
        return;
      }
      const proc = (STATE.data.brand_processes || []).find(
        p => p.brand_id === b.brand_id && p.process_type === pt.id
      );
      
      const cell = el('td', { class: 'col-process process-cell' });
      cell.dataset.brandId = b.brand_id;
      cell.dataset.processType = pt.id;
      
      if (proc && (proc.status || proc.text || proc.date)) {
        const status = proc.status || '대기';
        const stat = PROCESS_STATUSES.find(s => s.id === status) || PROCESS_STATUSES[0];
        const statusChip = el('span', { 
          class: 'process-status-chip',
          style: { color: stat.color, background: stat.bg }
        }, status);
        const text = proc.text || '';
        const date = proc.date ? fmtDateMonthDay(proc.date) : '';
        const time = proc.time || '';
        const meta = (date || time) ? (date + (time ? ' ' + time : '')) : '';
        
        cell.appendChild(statusChip);
        if (text) cell.appendChild(el('div', { class: 'process-cell-text' }, text));
        if (meta) cell.appendChild(el('div', { class: 'process-cell-meta' }, meta));
      } else {
        cell.appendChild(el('span', { class: 'process-cell-empty' }, '—'));
      }
      
      // 클릭 → 편집 popover/모달 (다음 단계에서 구현)
      cell.onclick = (e) => {
        e.stopPropagation();
        openBrandProcessEdit(b, pt, proc, cell);
      };
      
      row.appendChild(cell);
    });
    
    tbody.appendChild(row);
  });
  table.appendChild(tbody);
  scrollWrap.appendChild(table);
  section.appendChild(scrollWrap);
  
  // ─── 드래그 바 동작 연결 ───
  // (scrollWrap이 만들어진 후에 연결)
  const dragState = { startX: null, startScroll: 0 };
  
  const setKnobAt = (clientX) => {
    const rect = dragBar.getBoundingClientRect();
    const x = Math.max(0, Math.min(rect.width, clientX - rect.left));
    dragKnob.style.left = x + 'px';
  };
  
  dragBar.addEventListener('mousedown', (e) => {
    dragState.startX = e.clientX;
    dragState.startScroll = scrollWrap.scrollLeft;
    setKnobAt(e.clientX);
    dragBar.classList.add('dragging');
    document.body.style.cursor = 'grabbing';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  
  const onMouseMove = (e) => {
    if (dragState.startX === null) return;
    setKnobAt(e.clientX);
    const dx = e.clientX - dragState.startX;
    // 오른쪽 드래그 → scrollLeft 증가 → 오른쪽 컬럼 봄
    scrollWrap.scrollLeft = dragState.startScroll + dx;
  };
  
  const endDrag = () => {
    if (dragState.startX === null) return;
    dragState.startX = null;
    dragState.startScroll = 0;
    dragBar.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  };
  
  window.addEventListener('mousemove', onMouseMove);
  window.addEventListener('mouseup', endDrag);
  window.addEventListener('mouseleave', endDrag);
  
  root.appendChild(section);
}

// ─── 브랜드 프로세스 셀 클릭 → 편집 모달 ────────────────────────
