<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이츠 셰프 컬렉션 — 브랜드 일정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --line:#dadce0; --line-dark:#bdc1c6; --head-bg:#f8f9fa; --ink:#202124; --ink-2:#5f6368;
  --done:#e2e3e5; --done-ink:#7a7f85;
  --now:#ffef62; --upc:#fff4c8; --agreed:#d5e5f7;
  --manual:#c2410c; --warn:#d93025; --anchor:#1a73e8; --memo:#d93025;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Pretendard Variable",Pretendard,sans-serif;font-size:11px;color:var(--ink);background:#fff}
#topbar{display:flex;align-items:center;gap:10px;padding:4px 8px;border-bottom:1px solid var(--line-dark);background:#fff;position:sticky;top:0;z-index:30;flex-wrap:wrap}
#topbar h1{font-size:12.5px;font-weight:700;letter-spacing:-.2px}
#today{font-weight:600;color:var(--anchor)}
.lg{display:flex;align-items:center;gap:3px;color:var(--ink-2);font-size:10px}
.sw{width:10px;height:10px;border:1px solid var(--line-dark);display:inline-block}
.hint{color:#9aa0a6;font-size:10px}
#sheetTabs{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:stretch;height:25px;
  background:var(--head-bg);border-top:1px solid var(--line-dark);z-index:40;padding-left:6px}
#sheetTabs button{font:inherit;font-size:11px;border:none;border-right:1px solid var(--line);
  background:transparent;padding:0 16px;cursor:pointer;color:var(--ink-2);position:relative}
#sheetTabs button:hover{background:#eef1f4}
#sheetTabs button.on{background:#fff;color:var(--ink);font-weight:700}
#sheetTabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.5px;background:var(--anchor)}
#weekView{display:none;overflow:auto;scrollbar-width:none;padding:4px 10px 10px}
#weekView::-webkit-scrollbar{display:none}
#wvNav{display:flex;align-items:center;justify-content:center;gap:8px;margin:4px 0 8px;position:sticky;top:0;background:#fff;padding:4px 0;z-index:5}
#wvNav button{font:inherit;border:1px solid var(--line-dark);background:#fff;border-radius:4px;cursor:pointer;padding:2px 9px}
#wvNav button:hover{background:var(--head-bg)}
#wvWeekBtn{font-weight:700;min-width:170px;font-size:12px}
#wvWeekBtn.now{color:var(--anchor)}
.wvDay{font-weight:700;font-size:11.5px;margin:9px 0 3px;padding-bottom:2px;border-bottom:1px solid var(--line-dark);color:var(--ink)}
.wvDay.today{color:var(--anchor)}
.wvDay .cw{font-weight:400;color:#9aa0a6;font-size:10px;margin-left:6px}
.wvItem{display:flex;align-items:center;gap:6px;padding:3px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:11px}
.wvItem:hover{background:var(--head-bg)}
.wvItem .bid{color:var(--anchor);font-weight:700;min-width:30px}
.wvItem .bn{font-weight:600;min-width:96px}
.wvItem .task{flex:1}
.wvItem .dt2{color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.wvItem.tdone{color:var(--done-ink)}
.wvItem.tdone .task, .wvItem.tdone .bn{text-decoration:line-through}
.wvItem .mm{color:var(--memo);font-size:9px}
.wvEmpty{color:#9aa0a6;padding:14px 4px;text-align:center}
#wrap{overflow:auto;scrollbar-width:none}
#wrap::-webkit-scrollbar{display:none}
html,body{overflow:hidden}
.dragbar{--dragbar-accent:26,115,232;position:relative;height:20px;margin:3px 8px;box-sizing:border-box;
  background:rgba(var(--dragbar-accent),.04);border:1px solid rgba(var(--dragbar-accent),.2);border-radius:10px;
  cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;color:#9898a8;
  font-size:10px;font-weight:600;overflow:hidden;transition:background .12s,border-color .12s}
.dragbar:hover{background:rgba(var(--dragbar-accent),.07);border-color:rgba(var(--dragbar-accent),.35)}
.dragbar.is-dragging{cursor:grabbing}
.dragbar__hint{position:absolute;top:50%;transform:translateY(-50%);opacity:.6;letter-spacing:.3px;pointer-events:none}
.dragbar__hint--l{left:10px}
.dragbar__hint--r{right:10px}
.dragbar__hint--c{left:50%;transform:translate(-50%,-50%);opacity:.45}
.dragbar__knob{position:absolute;top:50%;left:0;width:12px;height:12px;margin-top:-6px;margin-left:-6px;
  background:rgb(var(--dragbar-accent));border-radius:50%;opacity:0;pointer-events:none;
  box-shadow:0 2px 8px rgba(var(--dragbar-accent),.45);transition:opacity .2s ease}
.dragbar.is-dragging .dragbar__knob{opacity:1;transition:opacity .08s ease}
table{border-collapse:separate;border-spacing:0;table-layout:fixed}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:20px;vertical-align:middle;background:#fff}
thead th{background:var(--head-bg);font-weight:600;color:var(--ink-2);text-align:center}
tr.grp th{font-size:10px;height:17px;border-bottom:1px solid var(--line-dark)}
tr.colh th{font-size:10px;line-height:1.15}
tr.rule th{font-size:9px;font-weight:400;color:#9aa0a6;height:14px}
thead{position:sticky;top:0;z-index:20}
tr.srcrow th{position:sticky;top:0;height:19px;border-bottom:1px solid var(--line)}
tr.grp th{position:sticky;top:0}
tr.colh th{position:sticky;top:17px}
tr.rule th{position:sticky;top:53px}
tr.srcrow th.sL, tr.grp th.sL, tr.colh th.sL{border-bottom-color:transparent}
tr.colh th.sL{font-size:10.5px;color:var(--ink)}
th.sL,td.sL{position:sticky;z-index:10;border-right:1px solid var(--line)}
thead th.sL{z-index:25}
.c0{left:0;width:22px;min-width:22px;text-align:center}
.cid{left:22px;width:36px;min-width:36px;text-align:center;color:var(--anchor);cursor:pointer;font-weight:600}
.cid:hover{text-decoration:underline}
.c1{left:58px;width:88px;min-width:88px}
.c2{left:146px;width:76px;min-width:76px;border-right:2px solid var(--line-dark)!important;color:var(--ink-2)}
td.c1,td.c2{cursor:pointer}
.notemark{position:relative}
.notemark::after{content:"";position:absolute;top:0;right:0;border-top:6px solid var(--memo);border-left:6px solid transparent}
#taskPop{min-width:230px;max-width:300px}
#taskPop .ti{display:flex;justify-content:space-between;gap:8px;padding:3px 2px;border-bottom:1px solid var(--line);font-size:10.5px}
#taskPop .ti:last-child{border-bottom:none}
#taskPop .ti .dt2{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink-2)}
#taskPop .ti.tdone{color:var(--done-ink);text-decoration:line-through}
#taskPop .empty{color:#9aa0a6;padding:4px 2px}
#tpNav{display:flex;align-items:center;justify-content:center;gap:6px;margin:2px 0 5px}
#tpNav button{font:inherit;border:1px solid var(--line-dark);background:#fff;border-radius:4px;cursor:pointer;padding:1px 7px}
#tpNav button:hover{background:var(--head-bg)}
#tpWeekBtn{font-weight:700;min-width:132px}
#tpWeekBtn.now{color:var(--anchor)}
.src{font-size:8.5px;padding:1.5px 4px;border-radius:3px;margin-right:4px;font-weight:700;white-space:nowrap}
#filterBar .src, #filterBar .gchip, #filterBar #fReset{cursor:pointer;user-select:none}
#filterBar .src{opacity:.55;border:1px solid transparent}
#filterBar .src.fon{opacity:1;outline:1.5px solid currentColor}
.gchip{font-size:9px;padding:1.5px 5px;border-radius:8px;border:1px solid var(--line-dark);color:var(--ink-2);margin-right:3px;background:#fff}
.gchip.fon{background:var(--ink);color:#fff;border-color:var(--ink)}
#fReset{font-size:9px;padding:1.5px 7px;border-radius:8px;border:1px solid var(--line-dark);color:var(--warn);background:#fff;margin-left:4px}
#fReset:hover{background:var(--head-bg)}
.src-lac{background:#f3e8fd;color:#7627bb}
.src-kv{background:#fef7e0;color:#b06000}
.src-cp{background:#e8f0fe;color:#1a73e8}
td.c1{font-weight:600}
td.c0{background:var(--head-bg);font-weight:700;color:var(--ink-2)}
tr:not(.rEnd) td.c0{border-bottom-color:transparent}
td .v{text-decoration:inherit}
td.cfY .v{text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1.5px}
td.cfN .v{opacity:.6}
td.cfN .q{color:var(--warn);font-weight:700;margin-left:1px}
.chip{display:inline-block;font-size:8.5px;line-height:1;padding:2px 3px;border-radius:3px;margin-left:3px;vertical-align:1px;font-weight:700}
.chip-pe{background:#e8f0fe;color:#1a73e8;border:1px solid #aecbfa}
.chip-done{background:#e8eaed;color:#5f6368;border:1px solid #bdc1c6}
.chip-chk{background:#fce8e6;color:#d93025;border:1px solid #f5b5b0}
.pop .chips{display:flex;gap:4px;margin-bottom:6px}
.pop .chips button.on{background:var(--anchor);border-color:var(--anchor);color:#fff}
tr.rEnd td{border-bottom:1px solid var(--line-dark)}
td.dt{text-align:center;font-variant-numeric:tabular-nums}
td.tx{font-size:10px;color:var(--ink)}
td.anchorC{font-weight:700}
th.anchorH{color:var(--anchor)}
td.st-done{background:var(--done);color:var(--done-ink)}
td.st-now{background:var(--now)}
td.st-upcoming{background:var(--upc)}
td.st-agreed{background:var(--agreed)}
td.manual, td.manual.st-done{color:var(--ink);font-weight:700}
td.dt:not(.manual){font-style:italic;color:var(--ink-2)}
td.dt.st-done:not(.manual){color:var(--done-ink)}
td.warnD{color:var(--warn);font-weight:700}
td.editable{cursor:cell}
td.hasMemo{position:relative}
td.hasMemo::after{content:"";position:absolute;top:0;right:0;border-top:6px solid var(--memo);border-left:6px solid transparent}
td.editable:hover{box-shadow:inset 0 0 0 1.5px #8ab4f8}
.hlMain{box-shadow:inset 2.5px 0 0 #e8710a, inset -2.5px 0 0 #e8710a!important}
.hlMain.hlTop{box-shadow:inset 2.5px 0 0 #e8710a, inset -2.5px 0 0 #e8710a, inset 0 2.5px 0 #e8710a!important}
.hlMain.hlBot{box-shadow:inset 2.5px 0 0 #e8710a, inset -2.5px 0 0 #e8710a, inset 0 -2.5px 0 #e8710a!important}
.hlChain{box-shadow:inset 1px 0 0 #e8710a, inset -1px 0 0 #e8710a!important}
.hlChain.hlTop{box-shadow:inset 1px 0 0 #e8710a, inset -1px 0 0 #e8710a, inset 0 1px 0 #e8710a!important}
.hlChain.hlBot{box-shadow:inset 1px 0 0 #e8710a, inset -1px 0 0 #e8710a, inset 0 -1px 0 #e8710a!important}
tr.rule th{cursor:help}
td.sel{box-shadow:inset 0 0 0 2px var(--anchor)!important}
td.cutSrc{opacity:.5}
.pop .mi{display:block;width:100%;text-align:left;border:none;background:none;padding:5px 9px;border-radius:4px;cursor:pointer;font:inherit}
.pop .mi:hover{background:var(--head-bg)}
.pop .mi[disabled]{opacity:.35;cursor:default}
.pop .mi[disabled]:hover{background:none}
.pop .mi .kbd{float:right;color:#9aa0a6;font-size:9px;margin-left:12px}
.pop hr{border:none;border-top:1px solid var(--line);margin:3px 0}

/* ===== 팝업 공통 ===== */
.pop{position:absolute;z-index:100;background:#fff;border:1px solid var(--line-dark);border-radius:6px;
  box-shadow:0 4px 14px rgba(0,0,0,.18);padding:8px;font-size:11px;display:none;min-width:196px}
.pop .ttl{font-weight:700;margin-bottom:6px;color:var(--ink-2);font-size:10px}
.pop .row{display:flex;gap:4px;align-items:center;margin-bottom:6px}
.pop button{font:inherit;border:1px solid var(--line-dark);background:#fff;border-radius:4px;padding:2px 8px;cursor:pointer}
.pop button:hover{background:var(--head-bg)}
.pop button.pri{background:var(--anchor);border-color:var(--anchor);color:#fff;font-weight:600}
.pop button.danger{color:var(--warn);border-color:var(--warn)}
.pop .tabs{display:flex;gap:0;margin-bottom:6px;border:1px solid var(--line-dark);border-radius:4px;overflow:hidden}
.pop .tabs button{flex:1;border:none;border-radius:0;padding:3px 0;color:var(--ink-2)}
.pop .tabs button.on{background:var(--anchor);color:#fff;font-weight:600}
.pop input[type=date],.pop input[type=text],.pop textarea{font:inherit;border:1px solid var(--line-dark);border-radius:4px;padding:3px 5px;width:100%}
.pop textarea{resize:vertical;min-height:52px}
.pop .auto{font-size:10px;color:#9aa0a6;margin-bottom:6px}
.pop .wkprev{font-size:10px;color:var(--anchor);font-weight:600;margin-left:4px;white-space:nowrap}
#memoHover{position:absolute;z-index:99;display:none;background:#fffbe6;border:1px solid #e6c200;border-radius:4px;
  padding:3px 7px;font-size:10px;max-width:220px;box-shadow:0 2px 8px rgba(0,0,0,.15);pointer-events:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div id="topbar">
  <h1>이츠 셰프 컬렉션 · 브랜드 일정</h1>
  <span>기준일 <span id="today"></span></span>
  <span class="lg"><span class="sw" style="background:var(--done)"></span>지남/완료</span>
  <span class="lg"><span class="sw" style="background:var(--now)"></span>이번 주</span>
  <span class="lg"><span class="sw" style="background:var(--upc)"></span>차주</span>
  <span class="lg"><span class="sw" style="background:var(--agreed)"></span>먼저 논의 건</span>
  <span class="lg"><b>굵게</b>=수동 · <i style="color:var(--ink-2)">기울임</i>=자동계산</span>
  <span class="lg"><span style="text-decoration:underline;text-underline-offset:2px">밑줄</span>=확정 · <span style="opacity:.6">7/13</span><span style="color:var(--warn);font-weight:700">?</span>=미정</span>
  <span class="lg"><span class="sw" style="border:none;width:0;height:0;border-top:9px solid var(--memo);border-left:9px solid transparent"></span>메모 있음</span>
  <span class="lg"><span class="chip chip-pe">예정</span><span class="chip chip-done">완료</span><span class="chip chip-chk">확인</span>&nbsp;칩(더블클릭 편집창에서)</span>
  <span class="hint">클릭=선택 · 선택 후 클릭=수정 · 더블클릭=메모 · 우클릭/길게=복사·붙여넣기 · Ctrl+C/X/V · 새로고침 시 초기화</span>
  <span class="lg" id="filterBar" style="flex-basis:100%;border-top:1px solid var(--line);margin-top:2px;padding:5px 2px 2px;background:var(--head-bg);border-radius:4px"></span>
</div>
<div class="dragbar" id="colDrag" title="좌우로 끌어서 컬럼 이동">
  <span class="dragbar__hint dragbar__hint--l">◀ 이전 단계</span>
  <span class="dragbar__hint dragbar__hint--c" id="dragPos"></span>
  <span class="dragbar__knob" data-dragbar-knob></span>
  <span class="dragbar__hint dragbar__hint--r">다음 단계 ▶</span>
</div>
<div id="wrap"><table id="grid"></table></div>
<div id="weekView">
  <div id="wvNav"><button id="wvPrev">‹</button><button id="wvWeekBtn" title="클릭하면 금주로"></button><button id="wvNext">›</button></div>
  <div id="wvList"></div>
</div>
<div class="dragbar" id="colDrag2" title="좌우로 끌어서 컬럼 이동">
  <span class="dragbar__hint dragbar__hint--l">◀ 이전 단계</span>
  <span class="dragbar__hint dragbar__hint--c" id="dragPos2"></span>
  <span class="dragbar__knob" data-dragbar-knob></span>
  <span class="dragbar__hint dragbar__hint--r">다음 단계 ▶</span>
</div>

<div id="sheetTabs">
  <button data-view="grid" class="on">브랜드 일정</button>
  <button data-view="week">주간 할 일</button>
</div>

<div class="pop" id="editPop">
  <div class="ttl" id="epTitle"></div>
  <div class="tabs">
    <button data-tab="date">날짜</button><button data-tab="week">주차</button>
  </div>
  <div class="row" id="epDateRow"><input type="text" id="epDate" placeholder="260707 또는 0707" inputmode="numeric" autocomplete="off"><span class="wkprev" id="epDatePrev"></span></div>
  <div class="row" id="epWeekRow"><input type="text" id="epWeek" placeholder="0713 (그 주 월요일)" inputmode="numeric" autocomplete="off"><span class="wkprev" id="epWkPrev"></span></div>
  <div class="chips" id="epChips">
    <button data-chip="pe">전달 예정</button><button data-chip="done">전달 완료</button><button data-chip="chk">확인 필요</button>
  </div>
  <div class="chips" id="epCf">
    <button data-cf="y">확정 (브랜드 합의됨)</button><button data-cf="n">미정</button>
  </div>
  <div class="auto" id="epAuto"></div>
  <div class="row" style="justify-content:flex-end;margin-bottom:0">
    <button id="epRevert">자동으로 되돌리기</button>
    <button id="epCancel">취소</button>
    <button class="pri" id="epSave">저장</button>
  </div>
</div>

<div class="pop" id="memoPop">
  <div class="ttl" id="mpTitle"></div>
  <textarea id="mpText" placeholder="메모 입력"></textarea>
  <div class="row" style="justify-content:flex-end;margin:6px 0 0">
    <button class="danger" id="mpDel">삭제</button>
    <button id="mpCancel">취소</button>
    <button class="pri" id="mpSave">저장</button>
  </div>
</div>

<div class="pop" id="ctxPop" style="min-width:150px;padding:4px">
  <button class="mi" data-act="edit">수정</button>
  <button class="mi" data-act="memo">메모</button>
  <hr>
  <button class="mi" data-act="copyVal">값 복사<span class="kbd">Ctrl+C</span></button>
  <button class="mi" data-act="copyMemo">메모 복사</button>
  <button class="mi" data-act="cfY">확정으로 표시</button>
  <button class="mi" data-act="cfN">미정으로 표시</button>
  <hr>
  <button class="mi" data-act="cut">잘라내기<span class="kbd">Ctrl+X</span></button>
  <button class="mi" data-act="paste">붙여넣기<span class="kbd">Ctrl+V</span></button>
</div>
<div class="pop" id="taskPop">
  <div class="ttl" id="tpTitle"></div>
  <div id="tpNav"><button id="tpPrev">‹</button><button id="tpWeekBtn" title="클릭하면 이번 주로"></button><button id="tpNext">›</button></div>
  <div id="tpList"></div>
</div>
<div id="memoHover"></div>

/* ===== 날짜 유틸 ===== */
const DAY = 86400000;
const P = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const ISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addD = (iso, n) => ISO(new Date(P(iso).getTime() + n*DAY));
const isDate = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v);
const monday = iso => { const d = P(iso); const wd = (d.getDay()+6)%7; return ISO(new Date(d.getTime()-wd*DAY)); };
const WD = ['일','월','화','수','목','금','토'];
const fmt = iso => { const d = P(iso); return `${d.getMonth()+1}/${d.getDate()}`; };
const fmtWD = iso => `${fmt(iso)}(${WD[P(iso).getDay()]})`;
const weekLabel = iso => { const m = P(monday(iso)); return `${String(m.getMonth()+1).padStart(2,'0')}${String(m.getDate()).padStart(2,'0')}주차`; };
// 커스텀 주차: 월~일 단위, 주차 번호는 날짜의 실제 달 기준. 1일이 일요일이면 0주차.
function customWeek(iso){
  const d = P(iso);
  const first = new Date(d.getFullYear(), d.getMonth(), 1);
  const w1 = first.getDay() === 0 ? new Date(first.getTime()+DAY) : P(monday(ISO(first)));
  const n = Math.floor((P(monday(iso)) - w1) / (7*DAY)) + 1;
  return `${d.getMonth()+1}월 ${Math.max(n,0)}주차`;
}

/* 타이핑 날짜 파서: 260707(YYMMDD) / 0707(MMDD, 올해) / 20260707 / 2026-07-07 */
function parseTyped(raw){
  if (!raw) return null;
  const s = String(raw).trim().replace(/[.\-\/\s]/g, '');
  if (!/^\d+$/.test(s)) return null;
  let y, m, d;
  if (s.length === 8){ y = +s.slice(0,4); m = +s.slice(4,6); d = +s.slice(6,8); }
  else if (s.length === 6){ y = 2000 + +s.slice(0,2); m = +s.slice(2,4); d = +s.slice(4,6); }
  else if (s.length === 4){ y = new Date().getFullYear(); m = +s.slice(0,2); d = +s.slice(2,4); }
  else return null;
  if (m < 1 || m > 12 || d < 1 || d > 31) return null;
  const dt = new Date(y, m-1, d);
  if (dt.getMonth() !== m-1 || dt.getDate() !== d) return null;
  return ISO(dt);
}
const toTyped = iso => iso ? iso.slice(2,4)+iso.slice(5,7)+iso.slice(8,10) : '';

/* ===== 계산 엔진 ===== */
function anchorsOf(b){
  const rd = STATE.rounds[b.round] || {};
  const a = {coupang: rd.coupang, laconds: rd.laconds, shoot: rd.shoot};
  for (const [col, key] of Object.entries({AS:'coupang', AT:'laconds', AL:'shoot'}).map(([k,v])=>[k,v])){
    const m = b.cells[col] && b.cells[col].m;
    if (isDate(m)) a[key] = m;
  }
  return a;
}
function computeBrand(b){
  const a = anchorsOf(b);
  const eff = {}, auto = {};
  for (const k of CALC_ORDER){
    const r = RULES[k];
    let base = r.a ? a[r.a] : eff[r.ref];
    let av = isDate(base) ? addD(base, r.off) : null;
    auto[k] = av;
    const cell = b.cells[k] || {};
    eff[k] = isDate(cell.m) ? cell.m : av;
  }
  return {a, eff, auto};
}
// 셀 표시값 결정: 수동날짜 > 수동주차 > 텍스트 > 자동
function cellView(b, comp, k){
  const cell = b.cells[k] || {};
  const rule = RULES[k];
  if (isDate(cell.m)) return {kind:'date', v:cell.m, manual:true};
  if (cell.wkm) return {kind:'week', v:cell.wkm, manual:true};
  if (cell.t) return {kind:'text', v:cell.t, manual:!!rule};
  const av = comp.auto[k];
  if (!av) return {kind:'empty'};
  if (rule && rule.week) return {kind:'week', v:monday(av), manual:false};
  return {kind:'date', v:av, manual:false};
}

/* ===== 상태 판정 ===== */
const TODAY = ISO(new Date());
const thisMon = monday(TODAY);
const weekEnd = addD(thisMon, 6), nextEnd = addD(thisMon, 13);
const DONE_RE = /(FIN|완료|전달완|업뎃완|처리완|회신 확인|필요 없음)/i;
function autoStatus(dateISO, text){
  if (text && DONE_RE.test(text)) return 'done';
  if (isDate(dateISO)){
    if (dateISO < TODAY) return 'done';
    if (dateISO <= weekEnd) return 'now';
    if (dateISO <= nextEnd) return 'upcoming';
  }
  return null;
}

/* ===== 컬럼 필터 ===== */
const FS = new Set();   // 말머리 필터 (라꼰즈/키비/쿠팡)
const FG = new Set();   // 단계(그룹) 필터
function colVisible(k){
  if (!FS.size && !FG.size) return true;
  return FS.has(COL_SRC[k][0]) || FG.has(COL_BY_K[k].g);
}
let CURVC = COLS.slice();

/* ===== 렌더 ===== */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function render(){
  document.getElementById('today').textContent = fmtWD(TODAY) + ' · ' + weekLabel(TODAY) + '(' + customWeek(TODAY) + ')';
  const T = document.getElementById('grid');
  CURVC = COLS.filter(c => colVisible(c.k));
  const VC = CURVC;
  let h0 = '<tr class="srcrow"><th class="sL c0"></th><th class="sL cid"></th><th class="sL c1"></th><th class="sL c2"></th>';
  let si = 0;
  while (si < VC.length){
    const s = COL_SRC[VC[si].k];
    let sj = si;
    while (sj < VC.length && COL_SRC[VC[sj].k][0] === s[0]) sj++;
    h0 += `<th colspan="${sj-si}"><span class="src src-${s[1]}">${s[0]}</span></th>`;
    si = sj;
  }
  let h1 = '<tr class="grp"><th class="sL c0"></th><th class="sL cid"></th><th class="sL c1"></th><th class="sL c2"></th>';
  let h2 = '<tr class="colh"><th class="sL c0">R</th><th class="sL cid">ID</th><th class="sL c1">브랜드</th><th class="sL c2">셰프</th>';
  let h3 = '<tr class="rule"><th class="sL c0"></th><th class="sL cid"></th><th class="sL c1"></th><th class="sL c2"></th>';
  let gi = 0;
  while (gi < VC.length){
    let gj = gi;
    while (gj < VC.length && VC[gj].g === VC[gi].g) gj++;
    h1 += `<th colspan="${gj-gi}">${VC[gi].g}</th>`;
    gi = gj;
  }
  for (const c of VC){
    h2 += `<th style="width:${c.w}px" class="${c.anchor?'anchorH':''}" data-k="${c.k}">${c.l}</th>`;
    h3 += `<th style="width:${c.w}px" data-k="${c.k}">${c.rule||'&nbsp;'}</th>`;
  }
  let html = '<thead>' + h0 + '</tr>' + h1 + '</tr>' + h2 + '</tr>' + h3 + '</tr></thead><tbody>';

  const brands = STATE.brands;
  for (let i = 0; i < brands.length; i++){
    const b = brands[i];
    const comp = computeBrand(b);
    const firstOfR = i === 0 || brands[i-1].round !== b.round;
    const lastOfR = i === brands.length-1 || brands[i+1].round !== b.round;
    html += `<tr class="${lastOfR?'rEnd':''}">`;
    html += `<td class="sL c0">${firstOfR ? b.round : ''}</td>`;
    html += `<td class="sL cid" data-task="${i}" title="이번 주 할 일 보기">${b.id}</td>`;
    html += `<td class="sL c1 ${b.noteBrand?'notemark':''}" data-note="brand" data-b="${i}" title="클릭: 브랜드 특이사항">${b.name}</td>`;
    html += `<td class="sL c2 ${b.noteChef?'notemark':''}" data-note="chef" data-b="${i}" title="클릭: 셰프 특이사항">${b.chef||''}</td>`;

    for (const c of VC){
      const cell = b.cells[c.k] || {};
      const vw = cellView(b, comp, c.k);
      let disp = '', title = [], cls = ['editable'], dateForStatus = null;

      if (vw.kind === 'date'){
        cls.push('dt'); disp = fmtWD(vw.v); dateForStatus = vw.v;
        title.push((vw.manual?'수동: ':'자동: ') + fmtWD(vw.v) + ' · ' + customWeek(vw.v));
        if (vw.manual && comp.auto[c.k]) title.push('자동계산값: ' + fmtWD(comp.auto[c.k]));
      } else if (vw.kind === 'week'){
        cls.push('dt'); disp = weekLabel(vw.v); dateForStatus = monday(vw.v);
        title.push((vw.manual?'수동: ':'자동: ') + disp + ' (' + customWeek(vw.v) + ')');
      } else if (vw.kind === 'text'){
        cls.push('tx'); disp = vw.v; title.push(vw.v);
      }
      if (vw.manual) cls.push('manual');
      if (c.tx) { const idx = cls.indexOf('dt'); if (idx>-1) cls.splice(idx,1); }
      if (c.anchor && vw.kind === 'date') cls.push('anchorC');
      if (c.k === 'W' && dateForStatus && isDate(comp.a.coupang) && dateForStatus > addD(comp.a.coupang,-14)){
        cls.push('warnD'); title.push('⚠ 마지노선(' + fmt(addD(comp.a.coupang,-14)) + ') 초과');
      }
      let st = cell.st || autoStatus(dateForStatus, vw.kind==='text'?vw.v:null);
      if (cell.chip === 'done') st = 'done';                     // [전달 완료] → 완료 처리
      else if (cell.chip === 'chk') st = 'now';                  // [확인 필요] → 날짜 지나도 강조 유지
      if (st) cls.push('st-' + st);
      if (cell.memo) cls.push('hasMemo');
      const CHIP_L = {pe:'예정', done:'완료', chk:'확인'};
      const chipHtml = cell.chip ? `<span class="chip chip-${cell.chip}">${CHIP_L[cell.chip]}</span>` : '';
      if (cell.chip) title.push('칩: ' + {pe:'전달 예정', done:'전달 완료', chk:'확인 필요'}[cell.chip]);
      if (cell.cf === 'y'){ cls.push('cfY'); title.push('확정(브랜드 합의)'); }
      else if (cell.cf === 'n'){ cls.push('cfN'); title.push('미정'); }
      else if (st === 'done' && disp){ cls.push('cfY'); title.push('확정(완료 건)'); }
      const qHtml = (cell.cf === 'n' && disp) ? '<span class="q">?</span>' : '';
      html += `<td class="${cls.join(' ')}" data-b="${i}" data-k="${c.k}" title="${esc(title.join(' · '))}"><span class="v">${esc(disp)}</span>${qHtml}${chipHtml}</td>`;
    }
    html += '</tr>';
  }
  html += '</tbody>';
  T.innerHTML = html;
}

/* ===== 규칙 체인 하이라이트 (규칙 헤더 호버) ===== */
const ANCHOR_COL = {shoot:'AL', coupang:'AS', laconds:'AT'};
function chainOf(k){
  const out = [];
  let cur = RULES[k];
  const seen = new Set([k]);
  while (cur){
    let next = null;
    if (cur.ref) next = cur.ref;
    else if (cur.a) next = ANCHOR_COL[cur.a];
    if (!next || seen.has(next)) break;
    out.push(next); seen.add(next);
    cur = RULES[next];
    if (next === 'AL' || next === 'AS' || next === 'AT') break;   // 앵커 도달
  }
  return out;
}
function hlCols(main){
  document.querySelectorAll('#grid .hlMain, #grid .hlChain').forEach(x => x.classList.remove('hlMain','hlChain','hlTop','hlBot'));
  if (!main) return;
  const mark = (k, cls) => {
    const els = document.querySelectorAll(`#grid [data-k="${k}"]`);
    els.forEach(x => x.classList.add(cls));
    if (els.length){ els[0].classList.add('hlTop'); els[els.length-1].classList.add('hlBot'); }
  };
  mark(main, 'hlMain');
  for (const c of chainOf(main)) mark(c, 'hlChain');
}

const getTd = key => { const [bi,k] = key.split('|'); return grid.querySelector(`td[data-b="${bi}"][data-k="${k}"]`); };
function selectCell(td){
  if (selKey){ const p = getTd(selKey); if (p) p.classList.remove('sel'); }
  selKey = td.dataset.b + '|' + td.dataset.k;
  td.classList.add('sel');
}
function restoreMarks(){
  if (selKey){ const td = getTd(selKey); if (td) td.classList.add('sel'); }
  if (CLIP && CLIP.mode === 'cut'){ const td = getTd(CLIP.from); if (td) td.classList.add('cutSrc'); }
}
function cellOf(key){ const [bi,k] = key.split('|'); return {b: STATE.brands[bi], k, bi:+bi}; }
function dispOf(key){
  const {b, k} = cellOf(key);
  const vw = cellView(b, computeBrand(b), k);
  if (vw.kind === 'date') return fmtWD(vw.v);
  if (vw.kind === 'week') return weekLabel(vw.v);
  if (vw.kind === 'text') return vw.v;
  return '';
}
function doCopyVal(key){
  const {b, k} = cellOf(key);
  const c = b.cells[k] || {};
  const payload = {};
  for (const f of ['m','wkm','t','chip','cf']) if (c[f]) payload[f] = c[f];
  // 자동값 셀 복사 시엔 표시값을 날짜로 고정해서 담음
  if (!payload.m && !payload.wkm && !payload.t){
    const vw = cellView(b, computeBrand(b), k);
    if (vw.kind === 'date') payload.m = vw.v;
    else if (vw.kind === 'week') payload.wkm = vw.v;
  }
  CLIP = {mode:'copy', payload, from:key};
  if (navigator.clipboard) navigator.clipboard.writeText(dispOf(key)).catch(()=>{});
}
function doCopyMemo(key){
  const {b, k} = cellOf(key);
  const memo = (b.cells[k] && b.cells[k].memo) || '';
  if (!memo) return;
  CLIP = {mode:'copy', payload:{memo}, from:key};
  if (navigator.clipboard) navigator.clipboard.writeText(memo).catch(()=>{});
}
function doCut(key){
  const {b, k} = cellOf(key);
  const c = b.cells[k] || {};
  const payload = {};
  for (const f of ['m','wkm','t','chip','memo','cf']) if (c[f]) payload[f] = c[f];
  if (!Object.keys(payload).length) return;
  CLIP = {mode:'cut', payload, from:key};
  if (navigator.clipboard) navigator.clipboard.writeText(dispOf(key)).catch(()=>{});
  rerender();
}
function doPaste(key){
  if (!CLIP) return;
  const {b, k} = cellOf(key);
  const cell = b.cells[k] = b.cells[k] || {};
  const p = CLIP.payload;
  const hasVal = p.m || p.wkm || p.t;
  if (hasVal){ delete cell.m; delete cell.wkm; delete cell.t; delete cell.chip; delete cell.cf; }
  for (const f of ['m','wkm','t','chip','memo','cf']) if (p[f]) cell[f] = p[f];
  if (CLIP.mode === 'cut' && CLIP.from !== key){
    const src = cellOf(CLIP.from);
    const sc = src.b.cells[src.k];
    if (sc){ for (const f of Object.keys(CLIP.payload)) delete sc[f]; if (!Object.keys(sc).length) delete src.b.cells[src.k]; }
    CLIP = null;
  } else if (CLIP.mode === 'cut'){ CLIP = null; }
  rerender();
}
function rerender(){ closeAll(); render(); fixStickyTops(); restoreMarks(); }

/* ===== 이벤트 ===== */
grid.addEventListener('mouseover', e => {
  const th = e.target.closest('tr.rule th[data-k]');
  if (th) hlCols(th.dataset.k);
});
grid.addEventListener('mouseleave', () => hlCols(null));
grid.addEventListener('mouseout', e => {
  if (e.target.closest('tr.rule') && !(e.relatedTarget && e.relatedTarget.closest('tr.rule'))) hlCols(null);
});

let clickTimer = null;
grid.addEventListener('click', e => {
  const idTd = e.target.closest('td.cid[data-task]');
  if (idTd){ openTasks(idTd); return; }
  const noteTd = e.target.closest('td[data-note]');
  if (noteTd){ openNote(noteTd); return; }
  const td = e.target.closest('td.editable');
  if (!td){ return; }
  const key = td.dataset.b + '|' + td.dataset.k;
  if (selKey === key){
    // 선택된 셀 재클릭 → 편집 (더블클릭 판정 대기 후)
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => { const t = getTd(key); if (t) openEdit(t); }, 280);
  } else {
    closeAll(); selectCell(td);
  }
});
grid.addEventListener('dblclick', e => {
  const td = e.target.closest('td.editable');
  if (!td) return;
  clearTimeout(clickTimer);
  closeAll(); selectCell(td); openMemo(td);
});
grid.addEventListener('contextmenu', e => {
  const td = e.target.closest('td.editable');
  if (!td) return;
  e.preventDefault();
  closeAll(); selectCell(td);
  openCtx(td);
});
function openCtx(td){
  const key = td.dataset.b + '|' + td.dataset.k;
  const {b, k} = cellOf(key);
  const c = b.cells[k] || {};
  const hasVal = !!(c.m || c.wkm || c.t || dispOf(key));
  ctxPop.querySelector('[data-act=copyVal]').disabled = !hasVal;
  ctxPop.querySelector('[data-act=copyMemo]').disabled = !c.memo;
  ctxPop.querySelector('[data-act=cut]').disabled = !(c.m || c.wkm || c.t || c.chip || c.memo || c.cf);
  ctxPop.querySelector('[data-act=paste]').disabled = !CLIP;
  positionPop(ctxPop, td);
}
ctxPop.addEventListener('click', e => {
  const mi = e.target.closest('.mi');
  if (!mi || mi.disabled || !selKey) return;
  const act = mi.dataset.act;
  const td = getTd(selKey);
  ctxPop.style.display = 'none';
  if (act === 'edit' && td) openEdit(td);
  else if (act === 'memo' && td) openMemo(td);
  else if (act === 'cfY' || act === 'cfN'){
    const {b, k} = cellOf(selKey);
    const cell = b.cells[k] = b.cells[k] || {};
    const v = act === 'cfY' ? 'y' : 'n';
    if (cell.cf === v) delete cell.cf; else cell.cf = v;   // 재클릭 시 해제
    if (!Object.keys(cell).length) delete b.cells[k];
    rerender();
  }
  else if (act === 'copyVal') doCopyVal(selKey);
  else if (act === 'copyMemo') doCopyMemo(selKey);
  else if (act === 'cut') doCut(selKey);
  else if (act === 'paste') doPaste(selKey);
});
// 단축키: 선택 셀 대상 (편집창/메모창 열려있으면 무시)
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ closeAll(); return; }
  if (!selKey) return;
  if (editPop.style.display === 'block' || memoPop.style.display === 'block') return;
  const mod = e.ctrlKey || e.metaKey;
  if (!mod) return;
  const k = e.key.toLowerCase();
  if (k === 'c'){ e.preventDefault(); doCopyVal(selKey); }
  else if (k === 'x'){ e.preventDefault(); doCut(selKey); }
  else if (k === 'v'){ e.preventDefault(); doPaste(selKey); }
});
// 모바일 길게 누르기 → 컨텍스트 메뉴
let pressTimer = null;
grid.addEventListener('touchstart', e => {
  const td = e.target.closest('td.editable');
  if (!td) return;
  pressTimer = setTimeout(() => { closeAll(); selectCell(td); openCtx(td); pressTimer = null; }, 600);
}, {passive:true});
grid.addEventListener('touchend', () => { if (pressTimer) clearTimeout(pressTimer); });
grid.addEventListener('touchmove', () => { if (pressTimer) clearTimeout(pressTimer); });
// 메모 호버 미리보기
grid.addEventListener('mouseover', e => {
  const noteTd = e.target.closest('td.notemark[data-note]');
  const td = noteTd || e.target.closest('td.hasMemo');

// 팝업 버튼
editPop.querySelectorAll('.tabs button').forEach(x => x.addEventListener('click', () => { if (!x.disabled) setTab(x.dataset.tab); }));
editPop.querySelectorAll('.chips button').forEach(x => x.addEventListener('click', () => setChip(chipSel === x.dataset.chip ? null : x.dataset.chip)));
$('epWeek').addEventListener('input', updateWkPrev);
$('epDate').addEventListener('input', updateDatePrev);

$('epCancel').addEventListener('click', closeAll);
$('epRevert').addEventListener('click', revertEdit);

$('mpCancel').addEventListener('click', closeAll);

document.addEventListener('mousedown', e => {
  if (!e.target.closest('.pop') && !e.target.closest('td.editable') && !e.target.closest('td.cid') && !e.target.closest('td[data-note]')) closeAll();
});

/* ── 드래그바 (가이드 원본 그대로) ── */
function createDragBar(el, options){
  const opts = Object.assign({ pxPerDay:60, invert:false, onDayChange:function(){} }, options||{});
  if(!el) return null;
  const knob = el.querySelector('[data-dragbar-knob]');
  let startX=null, shifted=0, pid=null;
  function setKnobAt(cx){ if(!knob) return; const r=el.getBoundingClientRect();
    knob.style.left = Math.max(0, Math.min(r.width, cx-r.left)) + 'px'; }
  function down(e){ if(startX!==null) return; startX=e.clientX; shifted=0; pid=e.pointerId;
    setKnobAt(e.clientX); el.classList.add('is-dragging');
    if(el.setPointerCapture) el.setPointerCapture(e.pointerId); e.preventDefault(); }
  function move(e){ if(startX===null||e.pointerId!==pid) return; setKnobAt(e.clientX);
    const t=Math.round((e.clientX-startX)/opts.pxPerDay);
    if(t!==shifted){ const s=t-shifted; shifted=t; opts.onDayChange(opts.invert?s:-s); } }
  function up(e){ if(startX===null) return; if(e.pointerId!=null&&e.pointerId!==pid) return;
    startX=null; shifted=0; pid=null; el.classList.remove('is-dragging'); }
  el.addEventListener('pointerdown',down); el.addEventListener('pointermove',move);
  el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
  return { destroy:function(){ el.removeEventListener('pointerdown',down);
    el.removeEventListener('pointermove',move); el.removeEventListener('pointerup',up);
    el.removeEventListener('pointercancel',up); } };
}

/* ── 컬럼 단위 가로 이동 연결 ── */
const wrapEl = document.getElementById('wrap');
let colOffsets = [];
let colIdx = 0;
function rebuildOffsets(){
  let x = 0;
  colOffsets = CURVC.map(c => { const v = x; x += c.w + 1; return v; });
  colIdx = Math.min(colIdx, Math.max(0, CURVC.length - 1));
}
function updateDragPos(){
  const c = CURVC[colIdx];
  const t = c ? `${c.g} · ${c.l}` : '';
  document.getElementById('dragPos').textContent = t;
  document.getElementById('dragPos2').textContent = t;
}
function scrollToCol(i, smooth){
  colIdx = Math.max(0, Math.min(CURVC.length - 1, i));
  wrapEl.scrollTo({left: colOffsets[colIdx] || 0, behavior: smooth ? 'smooth' : 'auto'});
  updateDragPos();
}
let rafPan = false, panDelta = 0;
const panHandler = {
  pxPerDay: 34,
  onDayChange: function(delta){
    panDelta += delta;
    if (rafPan) return;
    rafPan = true;
    requestAnimationFrame(function(){ scrollToCol(colIdx + panDelta); panDelta = 0; rafPan = false; });
  }
};
createDragBar(document.getElementById('colDrag'), panHandler);
createDragBar(document.getElementById('colDrag2'), panHandler);
// 스크롤바/터치로 움직였을 때 현재 컬럼 동기화
let scrollT = null;
wrapEl.addEventListener('scroll', function(){
  clearTimeout(scrollT);
  scrollT = setTimeout(function(){
    const x = wrapEl.scrollLeft;
    let best = 0;
    for (let i = 0; i < colOffsets.length; i++) if (Math.abs(colOffsets[i]-x) < Math.abs(colOffsets[best]-x)) best = i;
    colIdx = best; updateDragPos();
  }, 80);
});

function sizeWrap(){
  const w = document.getElementById('wrap');
  const bottomBar = document.getElementById('colDrag2');
  const tabH = document.getElementById('sheetTabs').offsetHeight;
  const bh = (bottomBar && bottomBar.style.display !== 'none') ? bottomBar.offsetHeight + 6 : 0;
  w.style.maxHeight = Math.max(120, window.innerHeight - w.getBoundingClientRect().top - bh - tabH - 2) + 'px';
  const wv = document.getElementById('weekView');
  wv.style.maxHeight = Math.max(120, window.innerHeight - wv.getBoundingClientRect().top - tabH - 2) + 'px';
}
function fixStickyTops(){
  let top = 0;
  document.querySelectorAll('#grid thead tr').forEach(tr => {
    tr.querySelectorAll('th').forEach(th => th.style.top = top + 'px');
    top += tr.getBoundingClientRect().height;
  });
}
/* ===== 통합 주간 할 일 뷰 ===== */
let curView = 'grid';
let wvMon = thisMon;
function showView(v){
  curView = v;
  document.querySelectorAll('#sheetTabs button').forEach(x => x.classList.toggle('on', x.dataset.view === v));
  const isGrid = v === 'grid';
  document.getElementById('wrap').style.display = isGrid ? '' : 'none';
  document.getElementById('colDrag').style.display = isGrid ? '' : 'none';
  document.getElementById('colDrag2').style.display = isGrid ? '' : 'none';
  document.getElementById('weekView').style.display = isGrid ? 'none' : 'block';
  closeAll();
  if (!isGrid) renderWeekView();
  sizeWrap();
}
function allWeekItems(mon){
  const wEnd = addD(mon, 6);
  const items = [];
  for (let i = 0; i < STATE.brands.length; i++){
    const b = STATE.brands[i];
    const comp = computeBrand(b);
    for (const c of COLS){
      if (!colVisible(c.k)) continue;
      const vw = cellView(b, comp, c.k);
      if (vw.kind === 'date' && vw.v >= mon && vw.v <= wEnd)
        items.push({bi: i, b, col: c, d: vw.v, week: false, cell: b.cells[c.k] || {}});
      else if (vw.kind === 'week' && monday(vw.v) === mon)
        items.push({bi: i, b, col: c, d: vw.v, week: true, cell: b.cells[c.k] || {}});
    }
  }
  items.sort((a, z) => (a.d < z.d ? -1 : a.d > z.d ? 1 : a.bi - z.bi));
  return items;
}
function wvItemHtml(it){
  const doneish = it.cell.chip === 'done' || it.cell.st === 'done' || (!it.week && it.d < TODAY);
  const src = COL_SRC[it.col.k];
  const chip = it.cell.chip ? ` <span class="chip chip-${it.cell.chip}">${{pe:'예정',done:'완료',chk:'확인'}[it.cell.chip]}</span>` : '';
  const cf = it.cell.cf === 'n' ? ' <span class="q" style="color:var(--warn);font-weight:700">?</span>' : '';
  const mm = it.cell.memo ? ' <span class="mm">📝</span>' : '';
  return `<div class="wvItem ${doneish?'tdone':''}" data-b="${it.bi}" data-k="${it.col.k}" title="클릭하면 그리드에서 해당 셀로 이동">
    <span class="src src-${src[1]}">${src[0]}</span>
    <span class="bid">${it.b.id}</span><span class="bn">${esc(it.b.name)}</span>
    <span class="task">${esc(it.col.g)} · ${esc(it.col.l)}${chip}${cf}${mm}</span>
    <span class="dt2">${it.week ? weekLabel(it.d) : fmtWD(it.d)}</span></div>`;
}
function renderWeekView(){
  const wb = document.getElementById('wvWeekBtn');
  const rel = wvMon === thisMon ? ' · 금주' : wvMon === addD(thisMon,7) ? ' · 차주' : wvMon === addD(thisMon,-7) ? ' · 전주' : '';
  wb.textContent = `${weekLabel(wvMon)} (${customWeek(wvMon)})` + rel;
  wb.classList.toggle('now', wvMon === thisMon);
  const items = allWeekItems(wvMon);
  const list = document.getElementById('wvList');
  if (!items.length){ list.innerHTML = '<div class="wvEmpty">이 주차 일정 없음</div>'; return; }
  let out = '';
  const weekItems = items.filter(x => x.week);
  if (weekItems.length){
    out += `<div class="wvDay">주중 진행 <span class="cw">${weekLabel(wvMon)}</span></div>` + weekItems.map(wvItemHtml).join('');
  }
  let curD = null;
  for (const it of items.filter(x => !x.week)){
    if (it.d !== curD){
      curD = it.d;
      out += `<div class="wvDay ${it.d === TODAY ? 'today' : ''}">${fmtWD(it.d)}${it.d === TODAY ? ' · 오늘' : ''}<span class="cw">${customWeek(it.d)}</span></div>`;
    }
    out += wvItemHtml(it);
  }
  list.innerHTML = out;
}
document.getElementById('wvPrev').addEventListener('click', () => { wvMon = addD(wvMon, -7); renderWeekView(); });
document.getElementById('wvNext').addEventListener('click', () => { wvMon = addD(wvMon, 7); renderWeekView(); });
document.getElementById('wvWeekBtn').addEventListener('click', () => { wvMon = thisMon; renderWeekView(); });
document.getElementById('sheetTabs').addEventListener('click', e => {
  const btn = e.target.closest('button[data-view]');
  if (btn) showView(btn.dataset.view);
});
document.getElementById('wvList').addEventListener('click', e => {
  const item = e.target.closest('.wvItem');
  if (!item) return;
  showView('grid');
  const key = item.dataset.b + '|' + item.dataset.k;
  const td = getTd(key);
  if (td){ selectCell(td); td.scrollIntoView({block:'center', inline:'center'}); }
});

// 필터바 생성: 말머리별로 단계 칩 묶음
(function(){
  const bar = document.getElementById('filterBar');
  const groups = [...new Set(COLS.map(c => c.g))];
  const gsrc = {};                                        // 그룹 → 말머리 (그룹 첫 컬럼 기준)
  for (const g of groups) gsrc[g] = COL_SRC[COLS.find(c => c.g === g).k][0];
  const order = [['라꼰즈','lac'],['키비','kv'],['쿠팡','cp']];
  bar.innerHTML = order.map(([s, cls]) =>
    `<span class="src src-${cls}" data-fs="${s}" title="${s} 열 전체 (다중 선택 가능)">${s}</span>` +
    groups.filter(g => gsrc[g] === s).map(g => `<span class="gchip" data-fg="${g}">${g}</span>`).join('')
  ).join('<span style="color:var(--line-dark);margin:0 5px">|</span>')
  + '<button id="fReset" title="필터 초기화">초기화</button>';
})();
function applyFilter(){
  document.querySelectorAll('#filterBar .src').forEach(x => x.classList.toggle('fon', FS.has(x.dataset.fs)));
  document.querySelectorAll('#filterBar .gchip').forEach(x => x.classList.toggle('fon', FG.has(x.dataset.fg)));
  rerender();
  rebuildOffsets();
  scrollToCol(0);
  sizeWrap();
  if (curView === 'week') renderWeekView();
}
document.getElementById('filterBar').addEventListener('click', e => {
  const s = e.target.closest('[data-fs]');
  const g = e.target.closest('[data-fg]');
  if (s){ FS.has(s.dataset.fs) ? FS.delete(s.dataset.fs) : FS.add(s.dataset.fs); applyFilter(); }
  else if (g){ FG.has(g.dataset.fg) ? FG.delete(g.dataset.fg) : FG.add(g.dataset.fg); applyFilter(); }
  else if (e.target.id === 'fReset'){ FS.clear(); FG.clear(); applyFilter(); }
});

render();
fixStickyTops();
rebuildOffsets();
sizeWrap();
updateDragPos();
window.addEventListener('resize', () => { fixStickyTops(); sizeWrap(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fixStickyTops(); sizeWrap(); });
</script>
