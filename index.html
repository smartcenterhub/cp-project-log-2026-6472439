const CAL_MONTH_EN = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];

function renderCalendar(root) {
  // 현재 보고 있는 월 (없으면 오늘)
  if (!STATE.filters.cal_year) {
    const now = new Date();
    STATE.filters.cal_year = now.getFullYear();
    STATE.filters.cal_month = now.getMonth();  // 0~11
  }
  const year = STATE.filters.cal_year;
  const month = STATE.filters.cal_month;
  
  const wrap = el('div', { class: 'cal-page' });
  
  // 헤더 — 영문 월 + 부제 + 네비
  const header = el('div', { class: 'cal-page-header' });
  
  // 좌측: 년월 + 영문 월
  header.appendChild(el('div', { class: 'cal-page-titlebox' }, [
    el('div', { class: 'cal-page-yearmonth' }, year + '.' + String(month + 1).padStart(2, '0')),
    el('div', { class: 'cal-page-monthen' }, CAL_MONTH_EN[month])
  ]));
  
  // 우측: 부제 + 네비
  header.appendChild(el('div', { class: 'cal-page-titleright' }, [
    el('div', { class: 'cal-page-subtitle' }, '쿠팡이츠 셰프 컬렉션 · 캠페인 일정표'),
    el('div', { class: 'cal-page-nav' }, [
      el('button', { 
        class: 'cal-nav-btn',
        onclick: () => {
          let m = month - 1, y = year;
          if (m < 0) { m = 11; y -= 1; }
          STATE.filters.cal_year = y;
          STATE.filters.cal_month = m;
          renderContent();
        }
      }, '◀ 이전'),
      el('button', { 
        class: 'cal-nav-btn',
        onclick: () => {
          const now = new Date();
          STATE.filters.cal_year = now.getFullYear();
          STATE.filters.cal_month = now.getMonth();
          renderContent();
        }
      }, '오늘'),
      el('button', { 
        class: 'cal-nav-btn',
        onclick: () => {
          let m = month + 1, y = year;
          if (m > 11) { m = 0; y += 1; }
          STATE.filters.cal_year = y;
          STATE.filters.cal_month = m;
          renderContent();
        }
      }, '다음 ▶')
    ])
  ]));
  
  wrap.appendChild(header);
  
  // 캘린더 그리드 — 7컬럼
  const cal = el('div', { class: 'cal-grid-box' });
  
  // 요일 행
  const weekdaysRow = el('div', { class: 'cal-weekdays' });
  ['SUN','MON','TUE','WED','THU','FRI','SAT'].forEach((d, i) => {
    const cls = i === 0 ? 'cal-weekday sun' : (i === 6 ? 'cal-weekday sat' : 'cal-weekday');
    weekdaysRow.appendChild(el('div', { class: cls }, d));
  });
  cal.appendChild(weekdaysRow);
  
  // 첫 날 + 마지막 날
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startDow = firstDay.getDay();  // 0=일
  
  // 6주(42칸) 채움 — 시작은 일요일부터
  const totalDays = lastDay.getDate();
  const totalCells = Math.ceil((startDow + totalDays) / 7) * 7;
  
  // 이벤트 — timeline_tasks에서 이 월에 걸리는 것
  const monthStart = new Date(year, month, 1);
  monthStart.setHours(0,0,0,0);
  const monthEnd = new Date(year, month + 1, 0);
  monthEnd.setHours(23,59,59,999);
  
  const allTasks = STATE.data.timeline_tasks || STATE.data.tasks || [];
  const events = allTasks.filter(t => {
    const dStr = String(t.date || t.start_date || t.due_date || '').slice(0,10);
    const eStr = String(t.end_date || dStr || '').slice(0,10);
    if (!dStr) return false;
    const startDate = new Date(dStr + 'T00:00:00');
    const endDate = new Date(eStr + 'T23:59:59');
    return startDate <= monthEnd && endDate >= monthStart;
  });
  
  // 날짜 셀들 — flat 배열로 만든 후 6주 분할
  const days = el('div', { class: 'cal-days' });
  const today = new Date();
  today.setHours(0,0,0,0);
  
  for (let i = 0; i < totalCells; i++) {
    const dayNum = i - startDow + 1;
    const cellDate = new Date(year, month, dayNum);
    cellDate.setHours(0,0,0,0);
    const isOther = dayNum < 1 || dayNum > totalDays;
    const dow = cellDate.getDay();
    const isToday = cellDate.getTime() === today.getTime();
    
    const cls = [
      'cal-day',
      isOther ? 'other' : '',
      dow === 0 ? 'sun' : (dow === 6 ? 'sat' : ''),
      isToday ? 'today' : ''
    ].filter(Boolean).join(' ');
    
    const dayCell = el('div', { class: cls });
    dayCell.appendChild(el('div', { class: 'cal-day-num' }, String(cellDate.getDate())));
    
    // 이 날에 해당하는 이벤트 표시
    if (!isOther) {
      const dayEvents = events.filter(t => {
        const dStr = String(t.date || t.start_date || t.due_date || '').slice(0,10);
        const eStr = String(t.end_date || dStr || '').slice(0,10);
        const startDate = new Date(dStr + 'T00:00:00');
        const endDate = new Date(eStr + 'T23:59:59');
        return cellDate >= startDate && cellDate <= endDate;
      });
      
      dayEvents.slice(0, 4).forEach(t => {
        const dStr = String(t.date || t.start_date || '').slice(0,10);
        const eStr = String(t.end_date || dStr || '').slice(0,10);
        const isFirst = cellDate.getTime() === new Date(dStr + 'T00:00:00').getTime();
        const isLast = cellDate.getTime() === new Date(eStr + 'T00:00:00').getTime();
        const info = TIMELINE_CAT_INFO[t.category] || { color: '#888' };
        
        const eventBar = el('div', { 
          class: 'cal-event-bar' + (isFirst ? ' is-start' : '') + (isLast ? ' is-end' : ''),
          style: { 
            background: info.color + '22',
            borderLeft: isFirst ? ('3px solid ' + info.color) : 'none',
            color: info.color
          },
          title: (t.title || t.name || '') + (eStr && eStr !== dStr ? ' (' + dStr + ' ~ ' + eStr + ')' : ''),
          onclick: (e) => {
            e.stopPropagation();
            openTimelineTaskPopover(t, eventBar);
          }
        }, isFirst ? (t.title || t.name || '(제목 없음)') : '');
        dayCell.appendChild(eventBar);
      });
      
      if (dayEvents.length > 4) {
        dayCell.appendChild(el('div', { class: 'cal-event-more' }, '+' + (dayEvents.length - 4) + '건'));
      }
    }
    
    days.appendChild(dayCell);
  }
  
  cal.appendChild(days);
  wrap.appendChild(cal);
  
  // 카테고리 범례
  const legend = el('div', { class: 'cal-legend' });
  Object.keys(TIMELINE_CAT_INFO).forEach(cat => {
    const info = TIMELINE_CAT_INFO[cat];
    legend.appendChild(el('span', { class: 'cal-legend-item' }, [
      el('span', { class: 'cal-legend-dot', style: { background: info.color } }),
      info.name
    ]));
  });
  wrap.appendChild(legend);
  
  root.appendChild(wrap);
}

function renderTimeline(root) {
  const all = (STATE.data.timeline_tasks || []).slice();
  
  // 그룹 정렬: parent_id 없는 것이 그룹, 그 아래에 같은 parent를 가진 하위들
  // 시드 ID 순서를 유지하기 위해 timeline_task_id로 정렬
  all.sort((a, b) => {
    const ai = a.timeline_task_id || '';
    const bi = b.timeline_task_id || '';
    return ai.localeCompare(bi);
  });
  
  const groups = all.filter(t => !t.parent_id);
  const childrenByGroup = {};
  all.filter(t => t.parent_id).forEach(t => {
    if (!childrenByGroup[t.parent_id]) childrenByGroup[t.parent_id] = [];
    childrenByGroup[t.parent_id].push(t);
  });
  
  // 카테고리 필터
  let cats = ['all', 'contract', 'visual', 'menu', 'youtube', 'promo', 'campaign', 'report', 'mail'];
  
  // ─── 툴바 (카테고리 필터 + 오늘로 + 추가 버튼) ───
  const toolbar = el('div', { class: 'tl-toolbar' });
  cats.forEach(c => {
    const info = TIMELINE_CAT_INFO[c];
    const chip = el('button', { 
      class: 'tl-chip' + (TL_FILTER.cat === c ? ' active' : ''),
      'data-cat': c,
      onclick: () => { TL_FILTER.cat = c; renderContent(); }
    }, [
      el('span', { class: 'tl-chip-dot' }),
      c === 'all' ? '전체' : (info ? info.name : c)
    ]);
    toolbar.appendChild(chip);
  });
  toolbar.appendChild(el('div', { class: 'tl-toolbar-sep' }));
  toolbar.appendChild(el('button', { 
    class: 'tl-today-btn',
    onclick: () => {
      const wrap = document.querySelector('.tl-wrap');
      if (!wrap) return;
      const currWk = tlGetCurrentWeek();
      const idx = currWk - tlStart();
      const scrollX = idx * 46 - 200;
      wrap.scrollTo({ left: Math.max(0, scrollX), behavior: 'smooth' });
    }
  }, '📍 오늘로'));
  toolbar.appendChild(el('button', {
    class: 'btn btn-primary',
    style: { marginLeft: '8px', fontSize: '11.5px', padding: '5px 12px' },
    onclick: () => openTimelineTaskModal(null)
  }, '＋ 태스크 추가'));
  
  root.appendChild(toolbar);
  
  // ─── 그리드 ───
  const wrap = el('div', { class: 'tl-wrap' });
  const grid = el('div', { class: 'tl-grid' });
  
  // 1) 좌측 상단 코너
  grid.appendChild(el('div', { class: 'tl-axis-corner' }, 'Task / W' + tlStart() + '~W' + tlEnd()));
  
  // 2) 상단 축 (월 + 주차)
  const axisBar = el('div', { class: 'tl-axis-bar' });
  const monthsRow = el('div', { class: 'tl-axis-months' });
  
  // 월별 그룹화
  const monthGroups = [];
  let curr = null;
  for (let w = tlStart(); w <= tlEnd(); w++) {
    const mon = tlWeekToMonday(tlYear(), w);
    const m = mon.getMonth();
    if (curr && curr.month === m) curr.count++;
    else { curr = { month: m, count: 1 }; monthGroups.push(curr); }
  }
  monthGroups.forEach(g => {
    const cell = el('div', { class: 'tl-axis-month', style: { width: 'calc(var(--tl-week-w) * ' + g.count + ')' } }, [
      TL_MONTH_KR[g.month],
      el('span', { class: 'month-num' }, g.count + 'w')
    ]);
    monthsRow.appendChild(cell);
  });
  axisBar.appendChild(monthsRow);
  
  const weeksRow = el('div', { class: 'tl-axis-weeks' });
  const currWk = tlGetCurrentWeek();
  for (let w = tlStart(); w <= tlEnd(); w++) {
    const mon = tlWeekToMonday(tlYear(), w);
    weeksRow.appendChild(el('div', { class: 'tl-axis-week' + (w === currWk ? ' curr' : '') }, [
      el('div', { class: 'wk-label' }, 'W' + w),
      el('div', { class: 'wk-date' }, tlFmtMD(mon))
    ]));
  }
  axisBar.appendChild(weeksRow);
  grid.appendChild(axisBar);
  
  // 3) 행 렌더 (그룹 + 하위)
  const today = new Date();
  const todayWk = tlGetCurrentWeek();
  
  groups.forEach(g => {
    if (TL_FILTER.cat !== 'all' && g.category !== TL_FILTER.cat) return;
    
    const info = TIMELINE_CAT_INFO[g.category] || { color: '#888', icon: '?' };
    const isCollapsed = !!TL_FILTER.collapsed[g.timeline_task_id];
    
    // 그룹 라벨 + 트랙
    const lbl = el('div', { 
      class: 'tl-row-label group' + (isCollapsed ? ' collapsed' : ''),
      onclick: (e) => {
        // 좌클릭 = 펼치기/접기, shift+click = 상세
        if (e.shiftKey) {
          openTimelineTaskModal(g);
        } else {
          TL_FILTER.collapsed[g.timeline_task_id] = !isCollapsed;
          renderContent();
        }
      }
    }, [
      el('span', { class: 'tl-group-arrow' }, '▼'),
      el('div', { class: 'tl-group-icon', style: { background: info.color } }, info.icon),
      el('span', { class: 'tl-row-name' }, g.name),
      el('span', { class: 'tl-row-meta' }, 'W' + getTaskSw(g) + '~W' + getTaskEw(g))
    ]);
    
    const trk = el('div', { class: 'tl-row-track group' });
    const gSw = getTaskSw(g);
    const gEw = getTaskEw(g);
    const sIdx = gSw - tlStart();
    const span = gEw - gSw + 1;
    trk.appendChild(el('div', { 
      class: 'tl-group-bar',
      style: {
        left: 'calc(var(--tl-week-w) * ' + sIdx + ')',
        width: 'calc(var(--tl-week-w) * ' + span + ')',
        background: info.color
      }
    }));
    // 오늘 선
    if (todayWk >= tlStart() && todayWk <= tlEnd()) {
      const todayIdx = todayWk - tlStart();
      trk.appendChild(el('div', { 
        class: 'tl-today-line',
        style: { left: 'calc(var(--tl-week-w) * ' + todayIdx + ' + var(--tl-week-w) / 2)' }
      }));
    }
    
    grid.appendChild(lbl);
    grid.appendChild(trk);
    
    // 하위 태스크
    if (!isCollapsed) {
      const children = childrenByGroup[g.timeline_task_id] || [];
      children.forEach(t => {
        const tInfo = TIMELINE_CAT_INFO[t.category] || info;
        const ownerName = t.owner_id ? nameOfStakeholder(t.owner_id) : '';
        
        const tLbl = el('div', { 
          class: 'tl-row-label',
          onclick: function() { openTimelineTaskPopover(t, this); }
        }, [
          el('span', { style: { width: '12px', flexShrink: '0' } }),  // 들여쓰기
          el('span', { 
            style: { width: '6px', height: '6px', borderRadius: '50%', background: tInfo.color, flexShrink: '0' }
          }),
          el('span', { class: 'tl-row-name', title: t.name }, t.name),
          ownerName ? el('span', { class: 'tl-row-meta' }, '@' + ownerName) : null
        ].filter(Boolean));
        
        const tTrk = el('div', { class: 'tl-row-track' });
        const tSw = getTaskSw(t);
        const tEw = getTaskEw(t);
        const tIdx = tSw - tlStart();
        const tSpan = tEw - tSw + 1;
        const prog = Number(t.progress) || 0;
        
        const bar = el('div', { 
          class: 'tl-bar status-' + (t.status || 'planned'),
          style: {
            left: 'calc(var(--tl-week-w) * ' + tIdx + ' + 2px)',
            width: 'calc(var(--tl-week-w) * ' + tSpan + ' - 4px)',
            background: tInfo.color
          },
          onclick: function(e) { e.stopPropagation(); openTimelineTaskPopover(t, this); },
          title: t.name + ' (W' + tSw + '~W' + tEw + ') · ' + TL_STATUS_KR[t.status] + (prog ? ' · ' + prog + '%' : '')
        }, [
          prog > 0 && prog < 100 ? el('div', { 
            class: 'tl-bar-progress', 
            style: { width: prog + '%' } 
          }) : null,
          el('span', { class: 'tl-bar-text' }, t.name)
        ].filter(Boolean));
        tTrk.appendChild(bar);
        
        // 오늘 선
        if (todayWk >= tlStart() && todayWk <= tlEnd()) {
          const todayIdx = todayWk - tlStart();
          tTrk.appendChild(el('div', { 
            class: 'tl-today-line',
            style: { left: 'calc(var(--tl-week-w) * ' + todayIdx + ' + var(--tl-week-w) / 2)' }
          }));
        }
        
        grid.appendChild(tLbl);
        grid.appendChild(tTrk);
      });
    }
  });
  
  // ─── 메일스레드 카테고리 행 (기존 groups 끝나고) ───
  const showMail = (TL_FILTER.cat === 'all' || TL_FILTER.cat === 'mail');
  const allThreads = (STATE.data.mail_threads || []).filter(t => t.status !== 'deleted');
  if (showMail && allThreads.length > 0) {
    const mailInfo = TIMELINE_CAT_INFO.mail;
    const mailCollapsed = !!TL_FILTER.collapsed['__mail__'];
    
    // 각 스레드의 활동 범위 계산 (logs의 date 기반)
    const threadsWithRange = allThreads.map(th => {
      const threadLogs = (STATE.data.logs || []).filter(l => l.thread_id === th.thread_id);
      const dates = threadLogs.map(l => fmtDate(l.date)).filter(Boolean).sort();
      const firstDate = dates[0] || fmtDate(th.kickoff_date) || fmtDate(th.created_at);
      const lastDate = dates[dates.length - 1] || firstDate;
      return { thread: th, firstDate, lastDate, mailCount: threadLogs.length };
    }).filter(x => x.firstDate);  // 날짜 정보 없는 스레드 제외
    
    // 그룹 라벨 (메일스레드 카테고리 헤더)
    const mailLbl = el('div', { 
      class: 'tl-row-label group' + (mailCollapsed ? ' collapsed' : ''),
      onclick: () => {
        TL_FILTER.collapsed['__mail__'] = !mailCollapsed;
        renderContent();
      }
    }, [
      el('span', { class: 'tl-group-arrow' }, '▼'),
      el('div', { class: 'tl-group-icon', style: { background: mailInfo.color } }, mailInfo.icon),
      el('span', { class: 'tl-row-name' }, mailInfo.name),
      el('span', { class: 'tl-row-meta' }, threadsWithRange.length + '개 스레드')
    ]);
    
    // 그룹 트랙 (스레드들의 전체 범위)
    const mailTrk = el('div', { class: 'tl-row-track group' });
    if (threadsWithRange.length > 0 && !mailCollapsed) {
      const allFirstWks = threadsWithRange.map(x => dateToTlWeek(x.firstDate)).filter(w => w !== null);
      const allLastWks  = threadsWithRange.map(x => dateToTlWeek(x.lastDate)).filter(w => w !== null);
      if (allFirstWks.length > 0) {
        const groupSw = Math.max(tlStart(), Math.min(...allFirstWks));
        const groupEw = Math.min(tlEnd(),   Math.max(...allLastWks));
        if (groupEw >= groupSw) {
          const sIdx = groupSw - tlStart();
          const span = groupEw - groupSw + 1;
          mailTrk.appendChild(el('div', { 
            class: 'tl-group-bar',
            style: {
              left: 'calc(var(--tl-week-w) * ' + sIdx + ')',
              width: 'calc(var(--tl-week-w) * ' + span + ')',
              background: mailInfo.color,
              opacity: '0.35'
            }
          }));
        }
      }
    }
    // 오늘 선
    if (todayWk >= tlStart() && todayWk <= tlEnd()) {
      const todayIdx = todayWk - tlStart();
      mailTrk.appendChild(el('div', { 
        class: 'tl-today-line',
        style: { left: 'calc(var(--tl-week-w) * ' + todayIdx + ' + var(--tl-week-w) / 2)' }
      }));
    }
    
    grid.appendChild(mailLbl);
    grid.appendChild(mailTrk);
    
    // 펼친 상태일 때 각 스레드 행
    if (!mailCollapsed) {
      // 시작일 빠른 순으로 정렬
      threadsWithRange.sort((a, b) => (a.firstDate || '').localeCompare(b.firstDate || ''));
      
      threadsWithRange.forEach(x => {
        const th = x.thread;
        const swRaw = dateToTlWeek(x.firstDate);
        const ewRaw = dateToTlWeek(x.lastDate);
        if (swRaw === null || ewRaw === null) return;
        
        // 표시 범위 밖이면 잘림 처리, 아예 범위 밖이면 건너뜀
        const sw = Math.max(tlStart(), swRaw);
        const ew = Math.min(tlEnd(), ewRaw);
        const outOfRange = (ewRaw < tlStart()) || (swRaw > tlEnd());
        
        const thLbl = el('div', { 
          class: 'tl-row-label',
          onclick: () => openMailThreadDetail(th)
        }, [
          el('span', { style: { width: '12px', flexShrink: '0' } }),
          el('span', { 
            style: { width: '6px', height: '6px', borderRadius: '50%', background: mailInfo.color, flexShrink: '0' }
          }),
          el('span', { class: 'tl-row-name', title: th.name }, th.name),
          el('span', { class: 'tl-row-meta' }, '✉ ' + x.mailCount + (th.client_org ? ' · ' + th.client_org : ''))
        ]);
        
        const thTrk = el('div', { class: 'tl-row-track' });
        if (!outOfRange && ew >= sw) {
          const tIdx = sw - tlStart();
          const tSpan = ew - sw + 1;
          const isClampedLeft = swRaw < tlStart();
          const isClampedRight = ewRaw > tlEnd();
          
          const bar = el('div', { 
            class: 'tl-bar status-progress',
            style: {
              left: 'calc(var(--tl-week-w) * ' + tIdx + ' + 2px)',
              width: 'calc(var(--tl-week-w) * ' + tSpan + ' - 4px)',
              background: mailInfo.color,
              // 잘림 표시 — 좌/우 가장자리 살짝 페이드
              ...(isClampedLeft  ? { borderTopLeftRadius:  '0', borderBottomLeftRadius:  '0' } : {}),
              ...(isClampedRight ? { borderTopRightRadius: '0', borderBottomRightRadius: '0' } : {}),
            },
            onclick: (e) => { e.stopPropagation(); openMailThreadDetail(th); },
            title: th.name + ' (W' + swRaw + '~W' + ewRaw + ') · 메일 ' + x.mailCount + '건' + 
                   (th.current_stage ? ' · ' + th.current_stage : '')
          }, [
            el('span', { class: 'tl-bar-text' }, th.name + ' (' + x.mailCount + ')')
          ]);
          thTrk.appendChild(bar);
        } else {
          // 범위 밖 표시
          thTrk.appendChild(el('div', { 
            style: { 
              position: 'absolute', left: '8px', top: '50%', transform: 'translateY(-50%)',
              fontSize: '10px', color: 'var(--text-faint)', fontStyle: 'italic'
            } 
          }, '⚠ W' + swRaw + '~W' + ewRaw + ' (타임라인 범위 밖)'));
        }
        
        // 오늘 선
        if (todayWk >= tlStart() && todayWk <= tlEnd()) {
          const todayIdx = todayWk - tlStart();
          thTrk.appendChild(el('div', { 
            class: 'tl-today-line',
            style: { left: 'calc(var(--tl-week-w) * ' + todayIdx + ' + var(--tl-week-w) / 2)' }
          }));
        }
        
        grid.appendChild(thLbl);
        grid.appendChild(thTrk);
      });
    }
  }
  
  wrap.appendChild(grid);
  root.appendChild(wrap);
  
  // 안내 + 통계
  const stats = (() => {
    const visible = groups.flatMap(g => [g, ...(childrenByGroup[g.timeline_task_id] || [])])
      .filter(t => TL_FILTER.cat === 'all' || t.category === TL_FILTER.cat);
    const sub = visible.filter(t => t.parent_id);
    const done = sub.filter(t => t.status === 'done').length;
    const prog = sub.filter(t => t.status === 'progress').length;
    const delayed = sub.filter(t => t.status === 'delayed').length;
    return { total: sub.length, done, prog, delayed };
  })();
  
  root.appendChild(el('div', { 
    style: { 
      marginTop: '12px', fontSize: '11.5px', color: 'var(--text-faint)',
      display: 'flex', gap: '14px', flexWrap: 'wrap'
    }
  }, [
    el('span', {}, '하위 태스크: ' + stats.total + '개'),
    el('span', { style: { color: 'var(--ok, #16a34a)' } }, '✓ 완료 ' + stats.done),
    el('span', { style: { color: '#1d4ed8' } }, '▶ 진행중 ' + stats.prog),
    stats.delayed > 0 ? el('span', { style: { color: '#dc2626' } }, '⚠ 지연 ' + stats.delayed) : null,
    (TL_FILTER.cat === 'all' || TL_FILTER.cat === 'mail') && allThreads.length > 0
      ? el('span', { style: { color: '#db2777' } }, '✉ 메일스레드 ' + allThreads.length + '개')
      : null,
    el('span', { style: { marginLeft: 'auto' } }, '막대 클릭 → 상세 / 그룹 클릭 → 접기·펴기 / Shift+그룹 클릭 → 그룹 편집')
  ].filter(Boolean)));
}

function openTimelineTaskModal(existing) {
  const isEdit = !!existing;
  const t = existing || {
    timeline_task_id: '',
    parent_id: '',
    category: 'contract',
    name: '',
    start_date: '',
    end_date: '',
    status: 'planned',
    progress: 0,
    brand_completion: '',
    owner_id: '',
    next_action: '',
    url: '',
    memo: ''
  };
  
  // 폼 필드
  const fName = el('input', { type: 'text', class: 'mp-input', value: t.name || '' });
  
  const fCat = el('select', { class: 'mp-input' });
  Object.keys(TIMELINE_CAT_INFO).forEach(k => {
    const info = TIMELINE_CAT_INFO[k];
    const o = el('option', { value: k }, info.name);
    if (t.category === k) o.selected = true;
    fCat.appendChild(o);
  });
  
  const fParent = el('select', { class: 'mp-input' });
  fParent.appendChild(el('option', { value: '' }, '(없음 = 그룹)'));
  (STATE.data.timeline_tasks || [])
    .filter(g => !g.parent_id && g.timeline_task_id !== t.timeline_task_id)
    .sort((a, b) => (a.timeline_task_id || '').localeCompare(b.timeline_task_id || ''))
    .forEach(g => {
      const o = el('option', { value: g.timeline_task_id }, g.name);
      if (t.parent_id === g.timeline_task_id) o.selected = true;
      fParent.appendChild(o);
    });
  
  // start_date/end_date 입력 — 기존 sw/ew 호환
  const initStart = t.start_date || (t.sw != null && t.sw !== '' ? isoWeekToMondayStr(tlYear(), Number(t.sw)) : '');
  const initEnd   = t.end_date   || (t.ew != null && t.ew !== '' ? isoWeekToSundayStr(tlYear(), Number(t.ew)) : '');
  const fStartDate = el('input', { type: 'text', class: 'mp-input', value: initStart, placeholder: 'YYYY-MM-DD', style: { width: '130px' } });
  const fEndDate   = el('input', { type: 'text', class: 'mp-input', value: initEnd,   placeholder: 'YYYY-MM-DD', style: { width: '130px' } });
  
  // 상태 사이클 버튼
  let curStatus = t.status || 'planned';
  const fStatusBtn = el('button', { 
    class: 'tl-status-btn s-' + curStatus,
    type: 'button',
    onclick: () => {
      const idx = TL_STATUS_CYCLE.indexOf(curStatus);
      curStatus = TL_STATUS_CYCLE[(idx + 1) % TL_STATUS_CYCLE.length];
      fStatusBtn.className = 'tl-status-btn s-' + curStatus;
      fStatusBtn.textContent = '● ' + TL_STATUS_KR[curStatus] + ' (클릭=다음)';
    }
  }, '● ' + TL_STATUS_KR[curStatus] + ' (클릭=다음)');
  
  const fProgress = el('input', { 
    type: 'range', min: 0, max: 100, step: 5,
    value: Number(t.progress) || 0,
    style: { width: '100%' }
  });
  const fProgressVal = el('span', { 
    style: { fontWeight: '700', color: 'var(--accent, #4f46e5)', minWidth: '40px', display: 'inline-block' }
  }, (Number(t.progress) || 0) + '%');
  fProgress.addEventListener('input', () => { fProgressVal.textContent = fProgress.value + '%'; });
  
  const fOwner = el('select', { class: 'mp-input' });
  fOwner.appendChild(el('option', { value: '' }, '(없음)'));
  (STATE.data.stakeholders || []).slice()
    .sort((a, b) => (a.name_ko || '').localeCompare(b.name_ko || ''))
    .forEach(s => {
      const o = el('option', { value: s.stakeholder_id }, (s.name_ko || s.name_en || '?') + ' (' + (s.org || '') + ')');
      if (t.owner_id === s.stakeholder_id) o.selected = true;
      fOwner.appendChild(o);
    });
  
  const fNextAction = el('input', { type: 'text', class: 'mp-input', value: t.next_action || '', placeholder: '다음 액션 (예: 김홍주 컨펌 받기)' });
  const fUrl = el('input', { type: 'text', class: 'mp-input', value: t.url || '', placeholder: 'Drive URL / Figma 링크 등' });
  const fMemo = el('textarea', { class: 'mp-input', rows: 4, placeholder: '메모 (누적 기록)' });
  fMemo.value = t.memo || '';
  
  // 브랜드 체크박스 그리드 (13개 음식 브랜드만)
  const completedSet = new Set(
    (t.brand_completion || '').split(',').map(s => s.trim()).filter(Boolean)
  );
  const brandChecks = [];
  const brandGrid = el('div', { class: 'tl-brand-grid' });
  (STATE.data.brands || []).slice()
    .sort((a, b) => (a.brand_id || '').localeCompare(b.brand_id || ''))
    .forEach(b => {
      const checked = completedSet.has(b.brand_id);
      const cb = el('input', { type: 'checkbox', checked });
      const label = el('label', { 
        class: 'tl-brand-check' + (checked ? ' checked' : '')
      }, [
        cb,
        el('span', {}, b.brand_id + ' ' + b.brand_name)
      ]);
      cb.addEventListener('change', () => {
        if (cb.checked) label.classList.add('checked'); 
        else label.classList.remove('checked');
      });
      brandChecks.push({ brand_id: b.brand_id, cb });
      brandGrid.appendChild(label);
    });
  
  // 관련 logs 자동 표시 (category 매칭)
  // category 매핑: contract → 모델계약/브랜드계약, visual → 키비주얼, menu → 메뉴개발, youtube → 유튜브, promo → 판촉물, campaign → 노출/KPI, report → KPI
  const CAT_TO_LOG = {
    contract: ['모델계약', '브랜드계약'],
    visual:   ['키비주얼'],
    menu:     ['메뉴개발', '촬영'],
    youtube:  ['유튜브'],
    promo:    ['판촉물'],
    campaign: ['노출', 'KPI'],
    report:   ['KPI']
  };
  const relatedCats = CAT_TO_LOG[t.category] || [];
  const relatedLogs = (STATE.data.logs || [])
    .filter(l => relatedCats.includes(l.category))
    .sort((a, b) => ((b.date || '') + (b.time || '')).localeCompare((a.date || '') + (a.time || '')))
    .slice(0, 8);
  
  const logsSection = relatedLogs.length > 0
    ? el('div', { style: { marginTop: '14px' } }, [
        el('div', { class: 'mp-label' }, '관련 logs (' + relatedCats.join(', ') + ' 카테고리 최근 ' + relatedLogs.length + '건)'),
        ...relatedLogs.map(l => el('div', { 
          style: { 
            padding: '6px 10px', marginBottom: '4px',
            background: 'rgba(0,0,0,0.025)', borderRadius: '4px', 
            fontSize: '11.5px', cursor: 'pointer'
          },
          onclick: () => {
            closeModal();
            openLogForm(l);
          }
        }, [
          el('span', { style: { color: 'var(--text-faint)', marginRight: '6px' } }, l.date || ''),
          el('strong', {}, l.subject || '—'),
          l.brand_id ? el('span', { style: { color: 'var(--text-muted)', marginLeft: '6px' } }, ' · ' + nameOfBrand(l.brand_id)) : null
        ].filter(Boolean)))
      ])
    : null;
  
  // 관련 메일스레드 (logs의 thread_id 통해)
  const threadIdsFromLogs = new Set();
  relatedLogs.forEach(l => { if (l.thread_id) threadIdsFromLogs.add(l.thread_id); });
  // 추가로 본 캠페인 카테고리는 브랜드명으로도 매칭
  const taskName = (t.name || '').toLowerCase();
  const relatedThreads = (STATE.data.mail_threads || []).filter(th => {
    if (threadIdsFromLogs.has(th.thread_id)) return true;
    // task 이름에 thread name이 들어있거나 그 반대
    const tn = (th.name || '').toLowerCase();
    return tn && (taskName.includes(tn) || tn.split(/[\s×x]+/).some(part => part.length > 2 && taskName.includes(part)));
  }).slice(0, 5);
  
  const threadsSection = relatedThreads.length > 0
    ? el('div', { style: { marginTop: '14px' } }, [
        el('div', { class: 'mp-label' }, '🔗 관련 메일스레드 ' + relatedThreads.length + '건'),
        ...relatedThreads.map(th => {
          const logCount = (STATE.data.logs || []).filter(l => l.thread_id === th.thread_id).length;
          return el('div', { 
            style: { 
              padding: '7px 10px', marginBottom: '4px',
              background: 'rgba(58, 134, 255, 0.06)',
              borderLeft: '3px solid #3a86ff',
              borderRadius: '4px', fontSize: '11.5px', cursor: 'pointer'
            },
            onclick: () => { closeModal(); openMailThreadDetail(th); }
          }, [
            el('div', { style: { fontWeight: '600' } }, th.name || '(이름 없음)'),
            el('div', { style: { fontSize: '10.5px', color: 'var(--text-muted)', marginTop: '2px' } },
              [
                '✉ ' + logCount + '건',
                th.current_stage || null,
                th.client_org ? '· ' + th.client_org : null
              ].filter(Boolean).join(' · '))
          ]);
        })
      ])
    : null;
  
  // 폼 구성
  const fieldRow = (label, input) => el('div', { class: 'mp-row' }, [
    el('div', { class: 'mp-label' }, label),
    input
  ]);
  
  const body = el('div', {}, [
    fieldRow('태스크 이름 ★', fName),
    el('div', { class: 'mp-inline-fields' }, [
      fieldRow('카테고리', fCat),
      fieldRow('상위 그룹', fParent),
    ]),
    el('div', { class: 'mp-inline-fields' }, [
      fieldRow('시작 날짜', fStartDate),
      fieldRow('종료 날짜', fEndDate),
      el('div', { class: 'mp-row', style: { flex: '2' } }, [
        el('div', { class: 'mp-label' }, '상태'),
        fStatusBtn
      ]),
    ]),
    el('div', { class: 'mp-row' }, [
      el('div', { class: 'mp-label' }, '진행률 (Progress)'),
      el('div', { style: { display: 'flex', alignItems: 'center', gap: '12px' } }, [
        fProgress, fProgressVal
      ])
    ]),
    fieldRow('담당자', fOwner),
    fieldRow('다음 액션 한 줄', fNextAction),
    fieldRow('외부 링크 (URL)', fUrl),
    fieldRow('메모', fMemo),
    el('div', { class: 'mp-row' }, [
      el('div', { class: 'mp-label' }, '브랜드별 완료 체크 ('+brandChecks.length+'개)'),
      brandGrid
    ]),
    logsSection,
    threadsSection
  ]);
  
  // 푸터 버튼
  const footer = [];
  if (isEdit) {
    footer.push(el('button', { 
      class: 'btn btn-secondary',
      style: { color: 'var(--err, #dc2626)', borderColor: 'rgba(220, 38, 38, 0.3)' },
      onclick: async () => {
        if (!confirm('이 태스크를 삭제할까요?\n\n' + t.name)) return;
        try {
          await apiDelete('timeline_tasks', t.timeline_task_id);          closeModal();
          renderContent();
          toast('삭제되었습니다');
        } catch (err) { toast(err.message, 'err'); }
      }
    }, '🗑 삭제'));
  }
  footer.push(el('button', { class: 'btn btn-secondary', onclick: closeModal }, '취소'));
  footer.push(el('button', { 
    class: 'btn btn-primary', 
    onclick: async () => {
      if (!fName.value.trim()) { toast('태스크 이름을 입력해주세요', 'err'); return; }
      const sdV = String(fStartDate.value || '').trim();
      const edV = String(fEndDate.value || '').trim();
      if (sdV && edV && sdV > edV) {
        toast('시작 날짜가 종료 날짜보다 늦습니다', 'err'); return;
      }
      
      // brand_completion 직렬화
      const completed = brandChecks.filter(x => x.cb.checked).map(x => x.brand_id).join(',');
      
      const data = {
        parent_id: fParent.value,
        category: fCat.value,
        name: fName.value.trim(),
        start_date: sdV,
        end_date: edV,
        status: curStatus,
        progress: Number(fProgress.value),
        brand_completion: completed,
        owner_id: fOwner.value,
        next_action: fNextAction.value.trim(),
        url: fUrl.value.trim(),
        memo: fMemo.value
      };
      
      try {
        if (isEdit) {
          await apiUpdate('timeline_tasks', t.timeline_task_id, data);
        } else {
          await apiCreate('timeline_tasks', data);
        }        closeModal();
        renderContent();
        toast(isEdit ? '수정되었습니다' : '추가되었습니다');
      } catch (err) { toast(err.message, 'err'); }
    }
  }, isEdit ? '💾 저장' : '＋ 추가'));
  
  openModal({
    title: isEdit ? ('타임라인 태스크 ' + (t.timeline_task_id || '')) : '새 타임라인 태스크',
    body,
    wide: true,
    footer
  });
}

function renderMailThreads(root) {
  const all = (STATE.data.mail_threads || []).slice();
  
  if (all.length === 0) {
    root.appendChild(el('div', { class: 'empty' }, [
      el('div', { class: 'empty-title' }, '아직 메일스레드가 없습니다'),
      '＋ 새 스레드 버튼으로 직접 만들거나, 📥 스레드 일괄 등록으로 메일 한 통째 붙여넣어 자동 생성하세요'
    ]));
    return;
  }
  
  // 필터 상태 (STATE.filters에 저장)
  const f = STATE.filters || (STATE.filters = {});
  
  // 각 스레드의 메일 수 + 마지막 활동일 계산
  const enriched = all.map(t => {
    const logs = (STATE.data.logs || []).filter(l => l.thread_id === t.thread_id);
    const lastLogDate = logs.length > 0 
      ? logs.reduce((max, l) => ((l.date || '') > max ? (l.date || '') : max), '')
      : '';
    return { ...t, _mailCount: logs.length, _lastActivity: lastLogDate };
  });
  
  // 필터 적용
  let filtered = enriched.filter(t => {
    if (f.mt_status && t.status !== f.mt_status) return false;
    if (f.mt_client && (t.client_org || '').toLowerCase() !== f.mt_client.toLowerCase()) return false;
    if (f.mt_search) {
      const s = f.mt_search.toLowerCase();
      // 스레드 자체 필드 + 스레드 내 모든 메일의 oneliner / subject 포함
      const threadLogs = (STATE.data.logs || []).filter(l => l.thread_id === t.thread_id);
      const onelinerBlob = threadLogs.map(l => (l.oneliner || '') + ' ' + (l.subject || '')).join(' ');
      const blob = [t.name, t.subtitle, t.client_org, t.current_stage, t.next_action, onelinerBlob].join(' ').toLowerCase();
      if (!blob.includes(s)) return false;
    }
    return true;
  });
  
  // 정렬 적용
  const sortMode = f.mt_sort || 'thread_id';  // 기본: 스레드 번호순 (TH001 → TH013)
  filtered.sort((a, b) => {
    if (sortMode === 'thread_id') {
      return (a.thread_id || '').localeCompare(b.thread_id || '');
    }
    if (sortMode === 'brand') {
      // 브랜드 ID 순 (B01 → B02 → ... → B13). 미지정은 맨 뒤.
      const ak = a.brand_id || 'ZZZ';
      const bk = b.brand_id || 'ZZZ';
      if (ak !== bk) return ak.localeCompare(bk);
      // 같은 브랜드면 최근 활동순
      const aa = a._lastActivity || String(a.updated_at || a.created_at || '');
      const bb = b._lastActivity || String(b.updated_at || b.created_at || '');
      return bb.localeCompare(aa);
    }
    if (sortMode === 'recent') {
      const ak = a._lastActivity || String(a.updated_at || a.created_at || '');
      const bk = b._lastActivity || String(b.updated_at || b.created_at || '');
      return bk.localeCompare(ak);
    }
    if (sortMode === 'name') {
      return (a.name || '').localeCompare(b.name || '', 'ko');
    }
    if (sortMode === 'mails') {
      return (b._mailCount || 0) - (a._mailCount || 0);
    }
    if (sortMode === 'kickoff') {
      return String(b.kickoff_date || '').localeCompare(String(a.kickoff_date || ''));
    }
    return 0;
  });
  
  // 클라이언트 목록 (필터 옵션)
  const clientOrgs = [...new Set(enriched.map(t => t.client_org).filter(Boolean))].sort();
  
  // ─── 새 메일 알림 바 ───
  const nm = getNewMails();
  if (nm.count > 0) {
    const bar = el('div', { class: 'mt-newbar' }, [
      el('span', { class: 'mt-newbar-icon' }, '📬'),
      el('span', { class: 'mt-newbar-text' }, '새로 들어온 메일 ' + nm.count + '건'),
      nm.unmatchedCount > 0
        ? el('span', {
            class: 'mt-newbar-sub',
            title: '브랜드가 매칭되지 않은 새 메일 — 클릭해서 브랜드 지정',
            onclick: () => openUnmatchedMailPanel()
          }, ['⚠ 브랜드 미확인 ' + nm.unmatchedCount + '건'])
        : null,
      el('button', {
        class: 'mt-newbar-read',
        onclick: () => { markMailsRead(); renderNav(); renderContent(); toast('✓ 다 읽음 처리됨'); }
      }, '다 읽음')
    ].filter(Boolean));
    root.appendChild(bar);
  }

  // ─── 필터/정렬 바 ───
  const fbar = el('div', { class: 'filter-bar' }, [
    el('span', { class: 'filter-label' }, '필터'),
    // 상태
    (() => {
      const sel = el('select', { 
        onchange: (e) => { STATE.filters.mt_status = e.target.value; renderContent(); }
      });
      sel.appendChild(el('option', { value: '' }, '모든 상태'));
      MT_STATUS_OPTIONS.forEach(([v, l]) => {
        const o = el('option', { value: v }, l);
        if (f.mt_status === v) o.selected = true;
        sel.appendChild(o);
      });
      return sel;
    })(),
    // 클라이언트
    (() => {
      const sel = el('select', { 
        onchange: (e) => { STATE.filters.mt_client = e.target.value; renderContent(); }
      });
      sel.appendChild(el('option', { value: '' }, '모든 클라이언트'));
      clientOrgs.forEach(c => {
        const o = el('option', { value: c }, c);
        if (f.mt_client === c) o.selected = true;
        sel.appendChild(o);
      });
      return sel;
    })(),
    // 검색
    el('input', {
      type: 'text', placeholder: '검색 (스레드명·단계·한 줄 요약·메일제목)',
      value: f.mt_search || '',
      oninput: (e) => { STATE.filters.mt_search = e.target.value; renderContent(); },
      style: { minWidth: '240px' }
    }),
    // 정렬
    el('span', { style: { marginLeft: 'auto', fontSize: '11.5px', color: 'var(--text-muted)' } }, '정렬'),
    (() => {
      const sel = el('select', { 
        onchange: (e) => { STATE.filters.mt_sort = e.target.value; renderContent(); }
      });
      [['thread_id','스레드 번호순'],['brand','브랜드 순서'],['recent','최근 활동순'],['name','이름순'],['mails','메일 많은 순'],['kickoff','시작일순']].forEach(([v, l]) => {
        const o = el('option', { value: v }, l);
        if (sortMode === v) o.selected = true;
        sel.appendChild(o);
      });
      return sel;
    })(),
    (f.mt_status || f.mt_client || f.mt_search) 
      ? el('button', { 
          class: 'btn btn-ghost', 
          onclick: () => { 
            delete STATE.filters.mt_status; 
            delete STATE.filters.mt_client; 
            delete STATE.filters.mt_search; 
            renderContent(); 
          }
        }, '필터 초기화')
      : null
  ].filter(Boolean));
  root.appendChild(fbar);
  
  // 상태별 카운트
  const byStatus = {};
  enriched.forEach(t => { byStatus[t.status || 'active'] = (byStatus[t.status || 'active'] || 0) + 1; });
  
  root.appendChild(el('div', { 
    style: { 
      display: 'flex', gap: '8px', alignItems: 'center', flexWrap: 'wrap',
      marginBottom: '12px', fontSize: '11.5px', color: 'var(--text-muted)' 
    } 
  }, [
    el('span', {}, '총 ' + filtered.length + '건' + (filtered.length !== enriched.length ? ' (전체 ' + enriched.length + ')' : '')),
    ...Object.keys(byStatus).map(s => {
      const label = MT_STATUS_LABEL[s] || s;
      return el('span', { class: 'mt-status-chip s-' + s }, label + ' ' + byStatus[s]);
    }),
    el('span', { style: { marginLeft: 'auto', color: 'var(--text-faint)' } }, '카드 클릭 → 상세 뷰')
  ]));
  
  if (filtered.length === 0) {
    root.appendChild(el('div', { class: 'empty' }, [
      el('div', { class: 'empty-title' }, '조건에 맞는 스레드가 없습니다'),
      '필터를 초기화해보세요'
    ]));
    return;
  }
  
  const grid = el('div', { class: 'mt-grid' });
  filtered.forEach(t => grid.appendChild(mailThreadCard(t)));
  root.appendChild(grid);
}

function mailThreadCard(t) {
  // 관련 logs 카운트 (같은 thread_id)
  const relatedLogs = (STATE.data.logs || []).filter(l => l.thread_id === t.thread_id);
  const status = t.status || 'active';
  const statusLabel = MT_STATUS_LABEL[status] || status;
  
  const card = el('div', { 
    class: 'mt-card',
    onclick: () => openMailThreadDetail(t)
  });
  
  card.appendChild(el('div', { class: 'mt-card-status-bar s-' + status }));

  // 새 메일 있는 스레드 → 빨간 점
  const _lastSeen = getMailLastSeenMs();
  const newInThread = relatedLogs.filter(l => isNewMail(l, _lastSeen)).length;
  if (newInThread > 0) {
    card.appendChild(el('div', {
      class: 'mt-card-newdot',
      title: '새 메일 ' + newInThread + '건'
    }));
  }
  
  // 메일함 URL 버튼 (단일 클릭: 복사, 더블클릭: 인라인 편집)
  const mailboxBtn = el('button', {
    class: 'mt-card-mailbox-btn' + (t.mailbox_url ? ' active' : ''),
    title: t.mailbox_url 
      ? '클릭: URL 복사 · 더블클릭: 수정\n' + t.mailbox_url
      : '더블클릭으로 메일함 URL 추가',
    onclick: async (e) => {
      e.stopPropagation();
      if (t.mailbox_url) {
        try {
          await navigator.clipboard.writeText(t.mailbox_url);
          toast('✓ 메일함 URL 복사됨');
        } catch (err) { toast('복사 실패', 'err'); }
      } else {
        toast('메일함 URL이 없습니다. 더블클릭으로 추가하세요.', 'warn');
      }
    },
    ondblclick: (e) => {
      e.stopPropagation();
      e.preventDefault();
      showInlineUrlEdit(mailboxBtn, t.mailbox_url, async (newUrl) => {
        await apiUpdate('mail_threads', t.thread_id, { mailbox_url: newUrl });
        t.mailbox_url = newUrl;
        mailboxBtn.classList.toggle('active', !!newUrl);
        mailboxBtn.title = newUrl 
          ? '클릭: URL 복사 · 더블클릭: 수정\n' + newUrl
          : '더블클릭으로 메일함 URL 추가';
      });
    }
  }, '🔗');
  
  card.appendChild(el('div', { class: 'mt-card-head' }, [
    el('span', { class: 'mt-card-id' }, t.thread_id || ''),
    el('span', { class: 'mt-status-chip s-' + status }, statusLabel),
    mailboxBtn
  ]));
  
  card.appendChild(el('div', { class: 'mt-card-name' }, t.name || '(이름 없음)'));
  
  if (t.subtitle) {
    card.appendChild(el('div', { class: 'mt-card-subtitle' }, t.subtitle));
  }
  
  // 브랜드 배지 (명시 지정된 brand_id 있을 때)
  if (t.brand_id) {
    const brand = (STATE.data.brands || []).find(b => b.brand_id === t.brand_id);
    if (brand) {
      card.appendChild(el('div', { class: 'mt-card-brand-badge' }, 
        '🎯 ' + brand.brand_id + ' · ' + (brand.brand_name || '')
      ));
    }
  }
  
  if (t.client_org) {
    card.appendChild(el('div', { class: 'mt-card-client' }, '👥 ' + t.client_org));
  }
  
  if (t.current_stage) {
    card.appendChild(el('div', { class: 'mt-card-stage' }, [
      el('div', { class: 'mt-card-stage-label' }, '현재 단계'),
      el('div', { class: 'mt-card-stage-val' }, t.current_stage)
    ]));
  }
  
  // 한 줄 요약 미리보기 (최근 2개 + 외 N건)
  const onelinersSorted = relatedLogs
    .filter(l => l.oneliner)
    .sort((a, b) => {
      const dA = String(a.date || '') + ' ' + String(a.time || '');
      const dB = String(b.date || '') + ' ' + String(b.time || '');
      return dA.localeCompare(dB);
    });
  
  if (onelinersSorted.length > 0) {
    const previewCount = Math.min(2, onelinersSorted.length);
    const previews = onelinersSorted.slice(-previewCount);  // 최근 N개
    const remaining = onelinersSorted.length - previewCount;
    
    const onelinerBlock = el('div', { class: 'mt-card-oneliners' }, [
      el('div', { class: 'mt-card-oneliners-label' }, '✨ 핵심 흐름'),
      ...previews.map(l => el('div', { class: 'mt-card-oneliner-row' }, [
        el('span', { class: 'mt-card-oneliner-date' }, fmtDateShort(l.date).split(' ')[0]),
        el('span', { class: 'mt-card-oneliner-text', title: l.oneliner }, l.oneliner)
      ])),
      remaining > 0 
        ? el('div', { class: 'mt-card-oneliners-more' }, `외 ${remaining}건의 요약`)
        : null
    ].filter(Boolean));
    card.appendChild(onelinerBlock);
  }
  
  card.appendChild(el('div', { class: 'mt-card-meta' }, [
    el('span', {}, '📧 ' + relatedLogs.length + '건'),
    el('span', {}, t.kickoff_date ? '시작 ' + fmtDateShort(t.kickoff_date) : '')
  ]));
  
  return card;
}

function openMailThreadDetail(t) {
  // 같은 thread_id의 logs 모두 가져와서 시간순
  const threadId = t.thread_id;
  const thread = t;  // alias (rerenderTimeline에서 사용)
  const logs = (STATE.data.logs || [])
    .filter(l => l.thread_id === t.thread_id)
    .sort((a, b) => {
      const ak = (a.date || '') + ' ' + (a.time || '');
      const bk = (b.date || '') + ' ' + (b.time || '');
      return ak.localeCompare(bk);
    });
  
  // 양사 참여자 자동 분류 (도메인 기반)
  const allEmails = new Set();
  logs.forEach(l => {
    if (l.from_id) {
      const s = STATE.data.stakeholders.find(x => x.stakeholder_id === l.from_id);
      if (s && s.email) allEmails.add(s.email.toLowerCase());
    }
    const toList = (l.to_ids || '').split(/[,;]/).map(x => x.trim()).filter(Boolean);
    toList.forEach(id => {
      const s = STATE.data.stakeholders.find(x => x.stakeholder_id === id);
      if (s && s.email) allEmails.add(s.email.toLowerCase());
    });
  });
  
  const usEmails = [...allEmails].filter(e => /@olivecompany\.co\.kr$/i.test(e));
  const clientEmails = [...allEmails].filter(e => !/@olivecompany\.co\.kr$/i.test(e));
  
  const emailToStakeholder = (email) => STATE.data.stakeholders.find(s => s.email && s.email.toLowerCase() === email);
  const usMembers = usEmails.map(emailToStakeholder).filter(Boolean);
  const clientMembers = clientEmails.map(emailToStakeholder).filter(Boolean);
  
  // 첫 컨택 / 마지막 활동
  const firstLog = logs[0];
  const lastLog = logs[logs.length - 1];
  const firstDate = firstLog ? fmtDate(firstLog.date) : '—';
  const lastDate = lastLog ? fmtDate(lastLog.date) : '—';
  
  // ─── 좌측 사이드바 ───
  const sidebarSection = (label, value, valueClass) => 
    el('div', { class: 'mt-sidebar-section', title: value || '' }, [
      el('div', { class: 'mt-sidebar-label' }, label),
      el('div', { class: 'mt-sidebar-value' + (valueClass ? ' ' + valueClass : '') }, value || '—')
    ]);
  
  const buildSidebarParticipant = (members, badgeClass, label) => {
    const main = members[0];
    const others = members.slice(1);
    
    const card = el('div', { class: 'mt-sidebar-participant' });
    card.appendChild(el('div', { class: 'mt-sidebar-participant-badge ' + badgeClass }, label));
    
    if (main) {
      const mainArea = el('div', { 
        class: 'mt-sidebar-participant-main',
        title: '클릭하여 연락처 보기'
      });
      mainArea.appendChild(el('div', { class: 'mt-sidebar-participant-name' }, main.name_ko || main.name_en || '—'));
      if (main.role || main.org) {
        mainArea.appendChild(el('div', { class: 'mt-sidebar-participant-role' }, (main.role || '') + (main.org ? ' · ' + main.org : '')));
      }
      mainArea.onclick = (e) => {
        e.stopPropagation();
        showStakeholderPopover(mainArea, main.stakeholder_id, t.thread_id);
      };
      card.appendChild(mainArea);
    } else {
      card.appendChild(el('div', { class: 'mt-sidebar-participant-name', style: { color: 'var(--text-faint)' } }, '참여자 없음'));
    }
    
    if (others.length > 0) {
      const othersEl = el('div', { 
        class: 'mt-sidebar-participant-others mt-sidebar-participant-others-clickable',
        title: '클릭하여 나머지 참여자 보기'
      }, '+' + others.length + (others.length === 1 ? ' ' + (others[0].name_ko || others[0].name_en) : ''));
      othersEl.onclick = (e) => {
        e.stopPropagation();
        if (others.length === 1) {
          showStakeholderPopover(othersEl, others[0].stakeholder_id, t.thread_id);
        } else {
          showStakeholderListPopover(othersEl, others, t.thread_id);
        }
      };
      card.appendChild(othersEl);
    }
    
    return card;
  };
  
  const sidebar = el('div', { class: 'mt-detail-sidebar' }, [
    // 상단 제목 영역 (사이드바 안)
    el('div', { style: { marginBottom: '18px', paddingBottom: '14px', borderBottom: '1px solid var(--border-soft, rgba(0,0,0,0.06))' } }, [
      t.client_org ? el('div', { class: 'mt-detail-kicker', style: { fontSize: '10.5px', marginBottom: '4px' } }, '파트너십 · ' + t.client_org) : null,
      el('div', { class: 'mt-detail-title', style: { fontSize: '16px', fontWeight: '600' } }, t.name || '(이름 없음)'),
      t.subtitle ? el('div', { class: 'mt-detail-subtitle', style: { fontSize: '12px', marginTop: '4px' } }, t.subtitle) : null
    ].filter(Boolean)),
    
    sidebarSection('최초 컨택', fmtDateShort(firstDate)),
    sidebarSection('최근 활동', fmtDateShort(lastDate)),
    sidebarSection('현재 단계', t.current_stage, 'stage'),
    sidebarSection('다음 단계', t.next_action, 'next-action'),
    
    t.mailbox_url ? el('div', { class: 'mt-sidebar-section' }, [
      el('div', { class: 'mt-sidebar-label' }, '📨 브랜드 메일함'),
      el('a', { 
        href: t.mailbox_url, target: '_blank', rel: 'noopener',
        style: { fontSize: '12px', color: 'var(--accent, #4f46e5)', textDecoration: 'none', wordBreak: 'break-all' },
        title: t.mailbox_url
      }, '메일함 열기 →')
    ]) : null,
    
    el('div', { class: 'mt-sidebar-divider' }),
    
    el('div', { class: 'mt-sidebar-label', style: { marginBottom: '8px' } }, '참여자'),
    buildSidebarParticipant(clientMembers, 'client', t.client_org || 'Client'),
    buildSidebarParticipant(usMembers, 'us', 'Olive Partners')
  ]);
  
  // ─── 정렬 상태 (모달 세션 내에서만 유지, 기본: 둘 다 최신순) ───
  let flowDesc = true;
  let timelineDesc = true;
  
  const sortedLogs = (desc) => [...logs].sort((a, b) => {
    const ak = (a.date || '') + ' ' + (a.time || '');
    const bk = (b.date || '') + ' ' + (b.time || '');
    return desc ? bk.localeCompare(ak) : ak.localeCompare(bk);
  });
  
  // 핵심 흐름 재렌더 함수 placeholder (실제 정의는 아래)
  // 타임라인 안에서 oneliner 저장 시 호출되므로 미리 ref 보관
  let rerenderFlow = () => {};
  
  // ─── 타임라인 (헬퍼: ID → 표시명/색) ───
  const idToName = (id) => {
    if (!id) return '';
    const s = STATE.data.stakeholders.find(x => x.stakeholder_id === id);
    return s ? (s.name_ko || s.name_en || s.email || id) : id;
  };
  const idToTone = (id) => {
    if (!id) return '';
    const s = STATE.data.stakeholders.find(x => x.stakeholder_id === id);
    if (!s) return '';
    return s.org === '올리브파트너스' ? 'olive' : 'client';
  };
  const splitIds = (str) => String(str || '').split(/[,;]/).map(x => x.trim()).filter(Boolean);
  
  // ─── 타임라인 이벤트 1개 렌더 (함수화) ───
  const renderTimelineEvent = (l) => {
    const dateShort = fmtDateShort(l.date);
    const timeT = fmtTime(l.time);
    const attachments = String(l.attachments_link || '')
      .split(/\n+/).map(x => x.trim()).filter(Boolean);
    
    const fromName = idToName(l.from_id);
    const toNames = splitIds(l.to_ids).map(idToName).filter(Boolean);
    const ccNames = splitIds(l.cc_ids).map(idToName).filter(Boolean);
    
    // 펼침 영역 (참조 + 본문 + 첨부)
    const expandable = el('div', { 
      class: 'mt-tl-expand',
      style: { display: 'none' }
    }, [
      ccNames.length > 0 ? el('div', { class: 'mt-tl-cc' }, [
        el('span', { class: 'mt-tl-cc-label' }, '참조'),
        el('span', { class: 'mt-tl-cc-val' }, ccNames.join(', '))
      ]) : null,
      l.summary ? el('div', { class: 'mt-tl-summary' }, cleanMailBody(l.summary)) : null,
      attachments.length > 0 ? el('div', { class: 'mt-tl-attachments' }, [
        '📎 ',
        ...attachments.map(a => el('span', { class: 'file' }, a))
      ]) : null,
      l.mail_url ? el('div', { 
        style: { marginTop: '8px', fontSize: '11.5px' } 
      }, [
        el('a', { 
          href: l.mail_url, target: '_blank', rel: 'noopener',
          style: { color: 'var(--accent, #4f46e5)', textDecoration: 'none' },

  // ─── 타임라인 컨테이너 + 정렬 토글 + 재렌더 ───
  const timeline = el('div', { class: 'mt-timeline' });
  const rerenderTimeline = () => {
    timeline.innerHTML = '';
    
    // 이 스레드의 task 목록
    const threadTasks = (STATE.data.tasks || []).filter(t => 
      t.thread_id === threadId
    );

      timeline.appendChild(el('div', {

      return;
    }
    
    // logs + tasks 합치고 시간순 정렬
    const items = [];
    logs.forEach(l => items.push({ 
      kind: 'log', data: l,
      sortKey: (fmtDate(l.date) || '') + ' ' + (l.time || '00:00')
    }));
    threadTasks.forEach(t => items.push({ 
      kind: 'task', data: t,
      sortKey: (fmtDate(t.due_date) || '') + ' ' + ((t.due_time || '').slice(0, 5) || '00:00')
    }));
    
    items.sort((a, b) => timelineDesc 
      ? b.sortKey.localeCompare(a.sortKey) 
      : a.sortKey.localeCompare(b.sortKey)
    );
    
    // ─── + slot 만드는 헬퍼 (호버 강조 라인 + 슬롯 어디든 클릭 = 인라인 입력)
    const makeAddSlot = (insertDate, insertTime) => {

      const addBtn = el('button', { 
        class: 'mt-tl-add-slot-btn',
        tabindex: '-1'
      }, '+');

        ev.stopPropagation();
        if (insertSlot.querySelector('.mt-tl-task-inline')) return;
        
        // 인라인 입력 박스 — 날짜는 짧은 라벨 (편집 시 비우기 가능)
        let currentDate = insertDate;

          class: 'mt-tl-task-inline-datelabel'

          class: 'mt-tl-now-btn',
          type: 'button',
          title: '메일보다 늦은 시간 자동 설정 (마지막 항목 + 1분)'
        }, '🕐');
        nowBtn.onclick = (e) => {
          e.stopPropagation();
          e.preventDefault();
          const next = getNextSlotDateTime(threadId);
          currentDate = next.date;
          dateLabel.textContent = fmtDateMonthDay(next.date);
          dateLabel.classList.remove('empty');
          timeEl.value = next.time;
        };
        
        const titleInput = el('input', { 
          type: 'text', 
          class: 'mt-tl-task-inline-input',
          placeholder: '할 일 한 줄 입력... (Enter: 저장, Esc: 취소)'
        });
        
        const closeInline = () => { inline.remove(); };
        
        const submit = async () => {
          const title = titleInput.value.trim();
          if (!title) { closeInline(); return; }

          // 비우기 한 경우 빈 값 그대로 저장 (insertTime fallback 안 함)
          const parsedTime = parseTime4(timeEl.value) || '';
          const data = {
            due_date: currentDate || '',
            due_time: parsedTime,
            title: title,
            brand_id: thread.brand_id || '',
            thread_id: threadId,
            status: '대기',
            category: '할일',
            priority: '',
            description: ''
          };
          try {
            await apiCreate('tasks', data);            closeInline();
            rerenderTimeline();
            toast('✓ 할 일 추가됨', 'ok');
          } catch (err) {
            toast('실패: ' + err.message, 'err');
          }
        };
        
        const clearBtn = el('button', { 
          class: 'mt-tl-task-inline-btn',
          title: '날짜/시간 비우기'
        }, '비우기');
        clearBtn.onclick = (e) => { 
          e.stopPropagation();
          currentDate = '';
          dateLabel.textContent = '날짜 없음';
          dateLabel.classList.add('empty');
          timeEl.value = '';
          titleInput.focus();
        };
        
        const saveBtn = el('button', { class: 'mt-tl-task-inline-btn primary' }, '저장');
        saveBtn.onclick = (e) => { e.stopPropagation(); submit(); };
        
        const cancelBtn = el('button', { class: 'mt-tl-task-inline-btn' }, '취소');
        cancelBtn.onclick = (e) => { e.stopPropagation(); closeInline(); };
        
        titleInput.onkeydown = (e) => {
          if (e.key === 'Enter') { e.preventDefault(); submit(); }
          else if (e.key === 'Escape') { e.preventDefault(); closeInline(); }
        };
        
        const inline = el('div', { class: 'mt-tl-task-inline' }, [
          el('div', { class: 'mt-tl-task-inline-time', style: { display: 'flex', flexDirection: 'column', gap: '3px' } }, [
            dateLabel, 
            el('div', { style: { display: 'flex', gap: '3px', alignItems: 'center' } }, [timeEl, nowBtn])
          ]),
          el('div', { style: { display: 'flex', alignItems: 'center', gap: '8px', minWidth: 0 } }, [

          el('div', { class: 'mt-tl-task-inline-actions' }, [clearBtn, cancelBtn, saveBtn])

      return insertSlot;

    // 렌더 — slot + 카드 시간순 교차
    items.forEach((item, i) => {
      // 카드 사이 (i > 0) — 두 카드 중 시간상 더 이전 기준
      if (i > 0) {
        const prevItem = items[i - 1];
        const curItem = items[i];
        const earlier = prevItem.sortKey < curItem.sortKey ? prevItem : curItem;
        timeline.appendChild(makeAddSlot(

          earlier.sortKey.split(' ')[1] || ''

    if (items.length > 0) {
      const firstItem = items[0];
      const topSlot = makeAddSlot(
        firstItem.sortKey.split(' ')[0] || '',

      timeline.insertBefore(topSlot, timeline.firstChild);

  const tlBtnDesc = el('button', { class: 'mt-sort-btn active' }, '최신순');

  // ─── 핵심 흐름 (모든 메일의 oneliner — 공란도 표시, 클릭 인라인 편집) ───
  const buildFlowRow = (l) => {
    const row = el('div', { class: 'mt-flow-row', 'data-flow-log-id': l.log_id });
    
    const from = l.from_id ? STATE.data.stakeholders.find(x => x.stakeholder_id === l.from_id) : null;
    const fromName = from ? (from.name_ko || from.name_en || '?') : (l.from_id || '?');

    const dateShort = (fmtDateShort(l.date) || '').split(' ')[0];

    row.appendChild(el('span', { 
      class: 'mt-flow-date',
      title: '클릭하여 타임라인으로 이동',
      onclick: () => scrollToTimelineLog(l.log_id)
    }, dateShort));
    
    // 발신자 칩 (타임라인과 동일 스타일) — 클릭 시 스크롤
    row.appendChild(el('span', { 
      class: 'mt-flow-from-chip ' + fromTone,
      title: '클릭하여 타임라인으로 이동',
      onclick: () => scrollToTimelineLog(l.log_id)
    }, fromName));
    
    // oneliner 인라인 편집 (텍스트 영역 → 클릭 시 input + 저장/취소 아이콘)
    let editing = false;
    let textWrap = el('span', {});
    row.appendChild(textWrap);
    
    const renderText = () => {
      textWrap.innerHTML = '';
      textWrap.appendChild(el('span', { 
        class: 'mt-flow-text' + (l.oneliner ? '' : ' empty'),
        onclick: (e) => { e.stopPropagation(); startEdit(); }
      }, l.oneliner || '＋ 한 줄 요약 추가'));
    };
    
    const startEdit = () => {
      if (editing) return;
      editing = true;
      
      const input = el('input', {
        type: 'text', class: 'mt-flow-input',
        value: l.oneliner || '',
        placeholder: '한 줄 요약...'
      });
      
      let isSaving = false;
      const saveBtn = el('button', { class: 'mt-flow-icon-btn save', title: '저장 (Enter)' }, '💾');
      const cancelBtn = el('button', { class: 'mt-flow-icon-btn cancel', title: '취소 (Esc)' }, '✕');
      
      const editWrap = el('div', { class: 'mt-flow-edit-wrap' }, [input, saveBtn, cancelBtn]);
      textWrap.innerHTML = '';
      textWrap.appendChild(editWrap);
      setTimeout(() => { input.focus(); input.select(); }, 0);
      
      const doSave = async () => {
        if (isSaving) return;
        const val = input.value.trim();
        if (val === (l.oneliner || '')) {
          editing = false;
          renderText();
          return;
        }
        isSaving = true;
        saveBtn.disabled = true;
        cancelBtn.disabled = true;
        saveBtn.innerHTML = '<span class="btn-spinner-sm">⟳</span>';
        try {
          await apiUpdate('logs', l.log_id, { oneliner: val });
          l.oneliner = val;
          editing = false;
          renderText();
          toast('✓ 저장됨');
        } catch (err) { 
          toast(err.message || '저장 실패', 'err'); 
          isSaving = false;
          saveBtn.disabled = false;
          cancelBtn.disabled = false;
          saveBtn.innerHTML = '💾';
        }
      };
      const doCancel = () => {
        if (isSaving) return;
        editing = false;
        renderText();

      cancelBtn.onclick = (e) => { e.stopPropagation(); doCancel(); };
      
      input.addEventListener('keydown', (e) => {
        e.stopPropagation();
        if (e.key === 'Enter') { e.preventDefault(); doSave(); }
        else if (e.key === 'Escape') { e.preventDefault(); doCancel(); }

    };
    
    renderText();
    return row;

  // ─── 핵심 흐름: 3-state 펼침 상태 (기본 'one' = 최신 1건만) ───

  const expBtnNone = el('button', { class: 'mt-flow-expand-btn' }, '전체 접기');

  const expBtnAll  = el('button', { class: 'mt-flow-expand-btn' }, '전체 펼침');
  const updateExpandBtns = () => {
    [expBtnNone, expBtnOne, expBtnAll].forEach(b => b.classList.remove('active'));
    if (flowExpandMode === 'none') expBtnNone.classList.add('active');
    else if (flowExpandMode === 'one') expBtnOne.classList.add('active');
    else expBtnAll.classList.add('active');
  };
  expBtnNone.onclick = () => { flowExpandMode = 'none'; updateExpandBtns(); rerenderFlow(); };
  expBtnOne.onclick  = () => { flowExpandMode = 'one';  updateExpandBtns(); rerenderFlow(); };
  expBtnAll.onclick  = () => { flowExpandMode = 'all';  updateExpandBtns(); rerenderFlow(); };
  
  const flowSection = el('div', { class: 'mt-flow' }, [
    el('div', { class: 'mt-section-header' }, [
      el('div', { class: 'mt-flow-title' }, '✨ 핵심 흐름'),
      el('div', { style: { display: 'flex', alignItems: 'center', gap: '4px', flexWrap: 'wrap' } }, [
        el('div', { class: 'mt-sort-toggle' }, [flowBtnDesc, flowBtnAsc]),
        el('div', { class: 'mt-flow-expand-toggle' }, [expBtnNone, expBtnOne, expBtnAll])
      ])
    ]),
    flowRowsContainer
  ]);
  rerenderFlow();
  
  // ─── 메인 영역 (핵심 흐름 + 타임라인) ───
  const main = el('div', { class: 'mt-detail-main' }, [
    flowSection,
    timelineHeader,
    timeline
  ]);
  
  // ─── 우측 사이드바 (단계별 진행 — 인라인 편집) ───
  const rightSidebar = buildThreadRightSidebar(t);
  
  // ─── 최종 body: 좌측 사이드바 + 메인 + 우측 사이드바 ───
  const body = el('div', { class: 'mt-detail-layout' }, [sidebar, main, rightSidebar]);
  
  openModal({
    title: t.thread_id + ' · ' + (t.name || ''),
    body,
    wide: true,
    onMount: () => {
      // 플로팅 ＋ 버튼을 modal 자체에 직접 추가 (modal 우측 하단 absolute)
      const modalEl = document.querySelector('.modal-overlay .modal');
      if (modalEl && !modalEl.querySelector('.mt-fab-add')) {
        const fabBtn = el('button', { 
          class: 'mt-fab-add',
          title: '항목 추가 (메일/통화/미팅/메모)'
        }, '＋');
        
        // 드롭다운 메뉴 토글
        let menuEl = null;
        const showMenu = () => {
          if (menuEl) return;
          menuEl = el('div', { class: 'mt-fab-menu' }, [
            el('div', { 
              class: 'mt-fab-menu-item', 
              onclick: () => { closeMenu(); openMailEditForm(t, null); }
            }, [
              el('span', { class: 'mt-fab-menu-item-icon type-mail' }, '📧'),
              el('span', {}, '메일 추가')
            ]),
            el('div', { 
              class: 'mt-fab-menu-item',
              onclick: () => { closeMenu(); openSimpleLogForm(t, null, { entryType: '통화' }); }
            }, [
              el('span', { class: 'mt-fab-menu-item-icon type-call' }, '📞'),
              el('span', {}, '통화 메모')
            ]),
            el('div', { 
              class: 'mt-fab-menu-item',
              onclick: () => { closeMenu(); openSimpleLogForm(t, null, { entryType: '미팅' }); }
            }, [
              el('span', { class: 'mt-fab-menu-item-icon type-meeting' }, '📅'),
              el('span', {}, '미팅 메모')
            ]),
            el('div', { 
              class: 'mt-fab-menu-item',
              onclick: () => { closeMenu(); openSimpleLogForm(t, null, { entryType: '메모' }); }
            }, [
              el('span', { class: 'mt-fab-menu-item-icon type-memo' }, '📝'),
              el('span', {}, '자유 메모')
            ]),
            el('div', { 
              class: 'mt-fab-menu-item',
              onclick: () => { closeMenu(); openTaskForm(t, null); }
            }, [
              el('span', { class: 'mt-fab-menu-item-icon type-task' }, '✅'),
              el('span', {}, '할 일 추가')
            ])
          ]);
          fabBtn.appendChild(menuEl);
          // 외부 클릭 시 닫기
          setTimeout(() => {
            const outClick = (e) => {
              if (!fabBtn.contains(e.target)) {
                closeMenu();
                document.removeEventListener('click', outClick);
              }
            };
            document.addEventListener('click', outClick);
          }, 0);
        };
        const closeMenu = () => {
          if (menuEl) {
            menuEl.remove();
            menuEl = null;
          }
        };
        
        fabBtn.onclick = (e) => {
          e.stopPropagation();
          if (menuEl) closeMenu();
          else showMenu();
        };
        
        modalEl.appendChild(fabBtn);
      }
    },
    footer: [
      el('button', { 
        class: 'btn btn-secondary', 
        style: { color: 'var(--err, #dc2626)', borderColor: 'rgba(220, 38, 38, 0.3)' },
        onclick: async () => {
          const relatedLogs = (STATE.data.logs || []).filter(l => l.thread_id === t.thread_id);
          const logCount = relatedLogs.length;
          
          const msg = '이 스레드를 삭제할까요?\n\n' + t.name + 
                      (logCount > 0 
                        ? '\n\n⚠ 연결된 메일 ' + logCount + '건도 함께 삭제됩니다.\n(되돌릴 수 없음)' 
                        : '\n\n연결된 메일 없음.');
          if (!confirm(msg)) return;
          
          try {
            showTopLoading(0, '삭제 준비 중...');
            const totalSteps = logCount + 2;  // logs + thread + reload
            
            // 1) 연결된 logs 먼저 삭제
            for (let i = 0; i < relatedLogs.length; i++) {
              const log = relatedLogs[i];
              const pct = ((i + 1) / totalSteps) * 100;
              showTopLoading(pct, `메일 삭제 중 (${i+1}/${logCount})...`);
              await apiDelete('logs', log.log_id);
            }
            
            // 2) 스레드 삭제
            const threadPct = ((logCount + 1) / totalSteps) * 100;
            showTopLoading(threadPct, '스레드 삭제 중...');
            await apiDelete('mail_threads', t.thread_id);
            
            // 3) 재로드
            showTopLoading(95, '새로고침 중...');            closeModal();
            renderContent();
            
            showTopLoading(100, '✓ 삭제 완료');
            toast('스레드 삭제됨' + (logCount > 0 ? ' (메일 ' + logCount + '건 함께 삭제)' : ''));
            hideTopLoading();
          } catch (err) { 
            hideTopLoading();
            toast(err.message, 'err'); 
          }
        }
      }, '🗑 삭제'),
      el('button', { class: 'btn btn-secondary', onclick: () => { closeModal(); openMailThreadForm(t); } }, '✏ 편집'),
      el('button', { class: 'btn btn-primary', onclick: closeModal }, '닫기')
    ]
  });
}

// ─── 핵심 흐름 → 타임라인 스크롤 + 펼침 + flash ───
function scrollToTimelineLog(logId) {
  const target = document.querySelector(`.mt-tl-event[data-log-id="${logId}"]`);
  if (!target) return;
  
  // 펼침 (닫혀있으면 헤더 클릭으로 펼침)
  if (!target.classList.contains('expanded')) {
    const header = target.querySelector('.mt-tl-header');
    if (header) header.click();
  }
  
  // 스크롤
  target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  
  // flash
  target.classList.remove('mt-tl-event-flash');
  void target.offsetWidth;  // reflow 트리거
  target.classList.add('mt-tl-event-flash');
  setTimeout(() => target.classList.remove('mt-tl-event-flash'), 1500);
}

// ─── 인라인 URL 편집 popover (스레드 메일함 URL / 메일 URL 등) ─────
// anchor 옆에 작은 popover (input + 💾 + ✕)
// onSave(newUrl) → Promise (API 호출)
function showInlineUrlEdit(anchor, currentUrl, onSave) {
  // 이미 떠있으면 제거
  const existing = document.getElementById('url-edit-popover');
  if (existing) existing.remove();
  
  const input = el('input', {
    type: 'url',
    value: currentUrl || '',
    placeholder: 'https://...'
  });
  
  const saveBtn = el('button', { class: 'mt-flow-icon-btn save', title: '저장 (Enter)' }, '💾');
  const cancelBtn = el('button', { class: 'mt-flow-icon-btn cancel', title: '취소 (Esc)' }, '✕');
  
  const pop = el('div', { class: 'url-edit-popover', id: 'url-edit-popover' }, [input, saveBtn, cancelBtn]);
  document.body.appendChild(pop);
  
  // 위치
  const rect = anchor.getBoundingClientRect();
  const popRect = pop.getBoundingClientRect();
  let left = rect.right + 6;
  let top = rect.top;
  if (left + popRect.width > window.innerWidth - 10) {
    left = Math.max(10, rect.left - popRect.width - 6);
  }
  if (top + popRect.height > window.innerHeight - 10) {
    top = window.innerHeight - popRect.height - 10;
  }
  if (top < 10) top = 10;
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  
  setTimeout(() => { input.focus(); input.select(); }, 0);
  
  const cleanup = () => {
    pop.remove();
    document.removeEventListener('click', outsideHandler);
  };
  const outsideHandler = (e) => {
    if (!pop.contains(e.target) && e.target !== anchor) cleanup();
  };
  setTimeout(() => document.addEventListener('click', outsideHandler), 0);
  
  const doSave = async () => {
    const v = input.value.trim();
    saveBtn.disabled = true;
    cancelBtn.disabled = true;
    saveBtn.innerHTML = '<span class="btn-spinner-sm">⟳</span>';
    try {
      await onSave(v);
      toast('✓ 저장됨');
      cleanup();
    } catch (err) {
      toast(err.message || '저장 실패', 'err');
      saveBtn.disabled = false;
      cancelBtn.disabled = false;
      saveBtn.innerHTML = '💾';
    }
  };
  
  saveBtn.onclick = (e) => { e.stopPropagation(); doSave(); };
  cancelBtn.onclick = (e) => { e.stopPropagation(); cleanup(); };
  input.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); doSave(); }
    else if (e.key === 'Escape') { e.preventDefault(); cleanup(); }
  });
  input.addEventListener('click', (e) => e.stopPropagation());
}

// ─── 연락처 팝오버 (사이드바 참여자 클릭 시) ─────────────────────────
function _stkPopoverOutsideHandler(e) {
  const pop = document.getElementById('stk-popover');
  if (!pop) return;
  if (!pop.contains(e.target)) hideStakeholderPopover();
}

function hideStakeholderPopover() {
  const pop = document.getElementById('stk-popover');
  if (pop) pop.remove();
  document.removeEventListener('click', _stkPopoverOutsideHandler);
}

function positionPopover(pop, anchor) {
  const rect = anchor.getBoundingClientRect();
  const popRect = pop.getBoundingClientRect();
  
  // 기본: anchor 우측에
  let left = rect.right + 10;
  let top = rect.top;
  
  // 우측 화면 넘침 → anchor 좌측으로
  if (left + popRect.width > window.innerWidth - 10) {
    left = rect.left - popRect.width - 10;
  }
  if (left < 10) left = 10;
  
  // 하단 넘침 → 위로 조정
  if (top + popRect.height > window.innerHeight - 10) {
    top = window.innerHeight - popRect.height - 10;
  }
  if (top < 10) top = 10;
  
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
}

function showStakeholderPopover(anchor, stakeholderId, threadId) {
  // 같은 사람 팝오버 떠있으면 토글 닫음
  const existing = document.getElementById('stk-popover');
  if (existing && existing.dataset.stakeholderId === stakeholderId) {
    hideStakeholderPopover();
    return;
  }
  hideStakeholderPopover();
  
  const stk = (STATE.data.stakeholders || []).find(s => s.stakeholder_id === stakeholderId);
  if (!stk) { toast('연락처 정보를 찾을 수 없습니다', 'err'); return; }
  
  // 이 스레드 내 활동 통계
  let activity = null;
  if (threadId) {
    const threadLogs = (STATE.data.logs || []).filter(l => l.thread_id === threadId);
    const sent = threadLogs.filter(l => l.from_id === stakeholderId);
    const received = threadLogs.filter(l => {
      const toIds = String(l.to_ids || '').split(/[,;]/).map(x => x.trim());
      const ccIds = String(l.cc_ids || '').split(/[,;]/).map(x => x.trim());
      return toIds.includes(stakeholderId) || ccIds.includes(stakeholderId);
    });
    const latestDate = [...sent, ...received]
      .map(l => l.date || '')
      .filter(Boolean)
      .sort()
      .reverse()[0];
    activity = { sent: sent.length, received: received.length, latest: latestDate };
  }
  
  const pop = el('div', { class: 'stk-popover', id: 'stk-popover' });
  pop.dataset.stakeholderId = stakeholderId;
  
  // 닫기 버튼
  pop.appendChild(el('button', { 
    class: 'stk-popover-close',
    onclick: () => hideStakeholderPopover()
  }, '✕'));
  
  // 이름
  pop.appendChild(el('div', { class: 'stk-popover-name' }, [
    el('span', {}, stk.name_ko || stk.name_en || '?'),
    stk.name_en && stk.name_ko 
      ? el('span', { class: 'stk-popover-name-en' }, ' (' + stk.name_en + ')') 
      : null
  ].filter(Boolean)));
  
  // 조직 / 역할 / 팀
  const subline = [];
  if (stk.org) subline.push(stk.org);
  if (stk.role) subline.push(stk.role);
  if (stk.team) subline.push(stk.team);
  if (subline.length) {
    pop.appendChild(el('div', { class: 'stk-popover-subline' }, subline.join(' · ')));
  }
  
  // 연락처
  const contacts = el('div', { class: 'stk-popover-contacts' });
  if (stk.email) {
    const e = el('div', {}, '📧  ' + stk.email);
    makeCopyable(e, stk.email, { type: 'email' });
    contacts.appendChild(e);
  }
  if (stk.phone) {
    const p = el('div', {}, '📞  ' + stk.phone);
    makeCopyable(p, stk.phone, { type: 'phone' });
    contacts.appendChild(p);
  }
  if (contacts.children.length > 0) pop.appendChild(contacts);
  
  // 이 스레드 내 활동
  if (activity && (activity.sent > 0 || activity.received > 0)) {
    pop.appendChild(el('div', { class: 'stk-popover-activity' }, [
      el('div', { class: 'stk-popover-label-row' }, '이 스레드 내 활동'),
      el('div', { class: 'stk-popover-activity-val' }, 
        '발신 ' + activity.sent + '건 · 수신 ' + activity.received + '건' + 
        (activity.latest ? ' · 최근 ' + fmtDateShort(activity.latest) : '')
      )
    ]));
  }
  
  // 페이지로 가기 링크
  pop.appendChild(el('div', { class: 'stk-popover-footer' }, [
    el('button', { 
      class: 'btn btn-ghost stk-popover-link',
      onclick: () => {
        hideStakeholderPopover();
        closeModal();
        STATE.page = 'stakeholders';
        if (STATE.filters) STATE.filters.search_stakeholders = stk.name_ko || stk.name_en || stakeholderId;
        STATE.highlightStakeholderId = stakeholderId;  // 렌더 후 펄스 강조
        renderContent();
        if (typeof renderNav === 'function') renderNav();
      }
    }, '연락처 페이지에서 보기 →')
  ]));
  
  document.body.appendChild(pop);
  positionPopover(pop, anchor);
  
  setTimeout(() => {
    document.addEventListener('click', _stkPopoverOutsideHandler);
  }, 0);
}

function showStakeholderListPopover(anchor, stakeholders, threadId) {
  hideStakeholderPopover();
  
  const pop = el('div', { class: 'stk-popover stk-popover-list', id: 'stk-popover' });

  stakeholders.forEach(s => {
    const item = el('div', { class: 'stk-popover-list-item' }, [

      (s.org || s.role) 
        ? el('div', { class: 'stk-popover-list-role' }, [s.org, s.role].filter(Boolean).join(' · '))
