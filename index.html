<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>bkImages 기간 마이그레이션</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif;max-width:760px;margin:40px auto;padding:20px;background:#f5f6fa;font-size:13px}
h2{font-size:17px;margin-bottom:6px}
p{color:#666;margin-bottom:12px;line-height:1.6}
.btns{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
button{padding:8px 20px;background:#3a3af0;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
button:disabled{opacity:.4}
button.sec{background:#555}
button.warn{background:#dc2626}
#log{padding:14px;background:#fff;border-radius:8px;height:460px;overflow-y:auto;border:1px solid #e5e5e5;font-family:monospace;font-size:11.5px;line-height:1.9}
.ok{color:#166534}.err{color:#991b1b}.info{color:#3a3af0}.skip{color:#888}.warn{color:#92400e}.sep{color:#ccc}
</style>
</head>
<body>
<h2>🔧 bkImages 기간 마이그레이션</h2>
<p>
  <b>Step 1</b> — 기간 없는 소재에 periods 채우기 (startAt/endAt → periods[0])<br>
  <b>Step 2</b> — 브검 기간 겹침 분석 (2개까지 허용, 3개 이상이면 짧은 기간 우선 유지 + 긴 것 쪼개기)<br>
  <b>Step 3</b> — 분석 결과 Firebase 반영
</p>
<div class="btns">
  <button id="btnLoad">1. 소재 로드</button>
  <button id="btnAnalyze" disabled>2. 겹침 분석</button>
  <button id="btnApplyStep1" disabled class="sec">3-A. periods 채우기 저장</button>
  <button id="btnApplyStep2" disabled class="warn">3-B. 겹침 수정 저장</button>
</div>
<div id="log">대기 중...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const _app = initializeApp({
  apiKey:'AIzaSyCEP7E_VJ6JkE_AZ5udN4aZfa3wUlLYr4I',
  authDomain:'daily-report-naver-ad-2026.firebaseapp.com',
  projectId:'daily-report-naver-ad-2026',
  appId:'1:649512750747:web:6597ebc08040f413be003e'
});
const db = getFirestore(_app);
signInAnonymously(getAuth(_app)).catch(e=>console.warn('[auth]',e));

const log = document.getElementById('log');
function L(msg, cls){ const d=document.createElement('div'); d.className=cls||''; d.innerHTML=msg; log.appendChild(d); log.scrollTop=log.scrollHeight; }
function ms(iso){ return iso ? new Date(iso).getTime() : 0; }
function fmtP(p){ return (p.startAt||'?').slice(0,16)+' ~ '+(p.endAt||'?').slice(0,16); }

let _all = []; // { _id, name, pcId, moId, startAt, endAt, periods, ... }
let _step1 = []; // 업데이트할 { _id, periods }
let _step2 = []; // 겹침 수정할 { _id, periods }

// ── 1. 로드 ──
document.getElementById('btnLoad').addEventListener('click', async ()=>{
  log.innerHTML='';
  L('Firebase 로드 중...','info');
  const snap = await getDocs(collection(db,'bkImages'));
  _all = snap.docs.map(d=>({_id:d.id,...d.data()}));
  L(`${_all.length}개 소재 로드됨`,'info');
  let noPeriods=0, hasPeriods=0;
  _all.forEach(c=>{
    if(c.periods&&c.periods.length){ hasPeriods++; }
    else { noPeriods++; }
  });
  L(`periods 있음: ${hasPeriods}개 / 없음: ${noPeriods}개`,'');
  document.getElementById('btnAnalyze').disabled=false;
  document.getElementById('btnApplyStep1').disabled=false;
});

// ── 2. 겹침 분석 ──
document.getElementById('btnAnalyze').addEventListener('click', ()=>{
  L('─────────────────','sep');
  L('겹침 분석 시작...','info');

  // 모든 소재의 현재 periods (없으면 startAt/endAt으로 임시 생성)
  const getPeriods = (c) => {
    if(c.periods&&c.periods.length) return c.periods;
    if(c.startAt&&c.endAt) return [{startAt:c.startAt,endAt:c.endAt}];
    return [];
  };

  // 겹침 감지: 모든 시간 슬라이스를 1분 단위 대신 구간 비교
  // 각 소재의 각 period에 대해 몇 개 소재와 겹치는지 확인
  const overlaps = []; // { ids: [id1,id2,id3], startAt, endAt } — 3개 이상 겹치는 구간

  // 구간 겹침 여부
  const overlaps2 = (a,b) => ms(a.startAt)<ms(b.endAt) && ms(a.endAt)>ms(b.startAt);

  // 모든 소재 쌍(pair) 비교 → 3개 이상 겹치는 구간 찾기
  // 이벤트 스윕 알고리즘
  const events = []; // { t, type: 'start'|'end', id, period }
  _all.forEach(c=>{
    getPeriods(c).forEach((p,pi)=>{
      if(!p.startAt||!p.endAt) return;
      events.push({t:ms(p.startAt), type:'start', id:c._id, p});
      events.push({t:ms(p.endAt),   type:'end',   id:c._id, p});
    });
  });
  events.sort((a,b)=>a.t-b.t||(a.type==='end'?-1:1));

  const active = new Map(); // id → period
  let maxOverlap=0;
  const overlapSets=[]; // 3개 이상인 구간
  events.forEach(ev=>{
    if(ev.type==='start'){
      active.set(ev.id, ev.p);
      if(active.size>=3){
        const ids=[...active.keys()];
        overlapSets.push({ids, startAt:new Date(ev.t).toISOString().slice(0,16), count:active.size});
      }
      maxOverlap=Math.max(maxOverlap,active.size);
    } else {
      active.delete(ev.id);
    }
  });

  if(overlapSets.length===0){
    L('✅ 3개 이상 겹치는 구간 없음 (2개 이하만 존재)','ok');
  } else {
    L(`⚠️ 3개 이상 겹치는 구간 ${overlapSets.length}개 발견`,'warn');
    overlapSets.slice(0,10).forEach(s=>{
      L(`&nbsp; ${s.startAt} 기준 ${s.count}개 겹침: ${s.ids.map(id=>{
        const c=_all.find(x=>x._id===id);
        return c?c.name:id;
      }).join(', ')}`,'warn');
    });
  }
  L(`최대 동시 운영 소재 수: ${maxOverlap}개`,'');

  // Step2 대상 계산: 3개 이상 겹치는 구간에서 짧은 기간 우선 유지, 긴 것 쪼개기
  _step2 = [];
  if(overlapSets.length>0){
    L('겹침 수정 계산 중...','info');
    const newPeriods = {}; // id → periods[]
    _all.forEach(c=>{ newPeriods[c._id] = getPeriods(c).map(p=>({...p})); });

    // 반복: 3개 이상 겹치는 구간이 없어질 때까지
    let iter=0;
    while(iter++<20){
      // 현재 겹침 재계산
      const ev2=[];
      Object.entries(newPeriods).forEach(([id,ps])=>{
        ps.forEach(p=>{ if(p.startAt&&p.endAt){
          ev2.push({t:ms(p.startAt),type:'start',id,p});
          ev2.push({t:ms(p.endAt),type:'end',id,p});
        }});
      });
      ev2.sort((a,b)=>a.t-b.t||(a.type==='end'?-1:1));
      const act2=new Map();
      let found=false;
      for(const ev of ev2){
        if(ev.type==='start'){
          act2.set(ev.id,ev.p);
          if(act2.size>=3){
            // 3개 이상 겹침 → 가장 긴 기간 소재 쪼개기
            const entries=[...act2.entries()].map(([id,p])=>({
              id, p, dur: ms(p.endAt)-ms(p.startAt)
            })).sort((a,b)=>b.dur-a.dur); // 긴 것 먼저
            // 짧은 2개 유지, 가장 긴 것 쪼개기
            const toSplit = entries[0];
            // 겹치는 구간: 모든 active 소재의 교집합
            const overStart = Math.max(...[...act2.values()].map(p=>ms(p.startAt)));
            const overEnd   = Math.min(...[...act2.values()].map(p=>ms(p.endAt)));
            // 쪼개기: toSplit의 period에서 [overStart~overEnd] 제거
            const sp = toSplit.p;
            const newPs = [];
            if(ms(sp.startAt) < overStart-60000){
              newPs.push({startAt:sp.startAt, endAt:new Date(overStart-60000).toISOString().slice(0,16)});
            }
            if(ms(sp.endAt) > overEnd+60000){
              newPs.push({startAt:new Date(overEnd+60000).toISOString().slice(0,16), endAt:sp.endAt});
            }
            // 기존 periods에서 sp 교체
            const idx = newPeriods[toSplit.id].indexOf(sp);
            if(idx>=0) newPeriods[toSplit.id].splice(idx,1,...newPs);
            found=true;
            break;
          }
        } else {
          act2.delete(ev.id);
        }
      }
      if(!found) break;
    }

    // 변경된 것만 step2에 추가
    Object.entries(newPeriods).forEach(([id,ps])=>{
      const orig = _all.find(c=>c._id===id);
      if(!orig) return;
      const origPs = getPeriods(orig);
      const changed = JSON.stringify(ps)!==JSON.stringify(origPs);
      if(changed){
        _step2.push({_id:id, name:orig.name, periods:ps, origPeriods:origPs});
      }
    });

    if(_step2.length>0){
      L(`수정 대상 ${_step2.length}개 소재:`,'info');
      _step2.forEach(s=>{
        L(`&nbsp; <b>${s.name}</b>`,'');
        s.origPeriods.forEach((p,i)=>L(`&nbsp;&nbsp; 기존 ${i+1}차: ${fmtP(p)}`,'skip'));
        s.periods.forEach((p,i)=>L(`&nbsp;&nbsp; 수정 ${i+1}차: ${fmtP(p)}`,'ok'));
      });
      document.getElementById('btnApplyStep2').disabled=false;
    } else {
      L('수정 필요한 소재 없음','ok');
    }
  }

  // Step1 대상
  _step1 = _all.filter(c=>!c.periods||!c.periods.length).filter(c=>c.startAt&&c.endAt);
  L(`─────────────────`,'sep');
  L(`Step1 대상 (periods 없는 소재): ${_step1.length}개`,'info');
});

// ── 3-A. periods 채우기 ──
document.getElementById('btnApplyStep1').addEventListener('click', async ()=>{
  document.getElementById('btnApplyStep1').disabled=true;
  let ok=0,err=0;
  for(const c of _step1){
    try{
      await updateDoc(doc(db,'bkImages',c._id),{
        periods:[{startAt:c.startAt,endAt:c.endAt}]
      });
      L(`✅ ${c.name}`,'ok');
      ok++;
    }catch(e){ L(`❌ ${c.name}: ${e.message}`,'err'); err++; }
  }
  L(`<b>Step1 완료 — 성공 ${ok} / 오류 ${err}</b>`,'info');
});

// ── 3-B. 겹침 수정 ──
document.getElementById('btnApplyStep2').addEventListener('click', async ()=>{
  document.getElementById('btnApplyStep2').disabled=true;
  let ok=0,err=0;
  for(const s of _step2){
    try{
      // startAt/endAt도 마지막 period로 갱신
      const last = s.periods[s.periods.length-1];
      await updateDoc(doc(db,'bkImages',s._id),{
        periods: s.periods,
        startAt: last.startAt,
        endAt:   last.endAt
      });
      L(`✅ ${s.name} (${s.periods.length}개 기간)`,'ok');
      ok++;
    }catch(e){ L(`❌ ${s.name}: ${e.message}`,'err'); err++; }
  }
  L(`<b>Step2 완료 — 성공 ${ok} / 오류 ${err}</b>`,'info');
});
</script>
</body>
</html>
