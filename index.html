function buildThreadRightSidebar(thread) {
  const brandId = thread.brand_id;
  const wrap = el('div', { class: 'mt-detail-right-sidebar' });
  
  // 헤더
  wrap.appendChild(el('div', { class: 'bp-side-header' }, '단계별 진행'));
  
  if (!brandId) {
    wrap.appendChild(el('div', { 
      style: { fontSize: '11.5px', color: 'var(--text-faint)', padding: '8px 4px' } 
    }, '연결된 브랜드 없음'));
    return wrap;
  }
  
  // 진행중/대기 섹션 + 완료 섹션 컨테이너
  const activeList = el('div');
  const doneList = el('div', { class: 'bp-side-done-list' });
  
  // process 행 생성 (divider row 만나면 구분선/헤더 삽입)
  const rerender = () => {
    activeList.innerHTML = '';
    doneList.innerHTML = '';
    let doneCount = 0;
    
    const allTypes = getProcessTypes();
    let pendingDivider = null;  // 다음 활성 항목 앞에 표시될 divider
    let hasActiveAfterDivider = false;
    
    allTypes.forEach(pt => {
      if (pt.isDivider) {
        // divider는 보류 — 다음 활성 항목이 나올 때 같이 표시
        pendingDivider = pt;
        hasActiveAfterDivider = false;
        return;
      }
      
      const proc = (STATE.data.brand_processes || []).find(
        p => p.brand_id === brandId && p.process_type === pt.id
      );
      const status = (proc && proc.status) || '대기';
      const isDone = status === '완료';
      const item = buildProcessSideItem(brandId, pt, proc, rerender);
      
      if (isDone) {
        item.classList.add('is-done');
        doneList.appendChild(item);
        doneCount++;
      } else {
        // pendingDivider 있으면 먼저 추가 (첫 활성 항목 직전)
        if (pendingDivider && !hasActiveAfterDivider) {
          const divEl = el('div', { class: 'bp-side-divider' });
          if (pendingDivider.label) {
            divEl.appendChild(el('span', { class: 'bp-side-divider-label' }, pendingDivider.label));
          }
          activeList.appendChild(divEl);
          hasActiveAfterDivider = true;
        }
        activeList.appendChild(item);
      }
    });
    
    // 완료 토글 텍스트 갱신
    doneCountEl.textContent = doneCount > 0 ? `완료됨 (${doneCount}개)` : '완료됨';
    doneSection.style.display = doneCount > 0 ? '' : 'none';
  };
  
  wrap.appendChild(activeList);
  
  // 완료 토글 섹션
  const doneArrow = el('span', { class: 'bp-side-done-arrow' }, '▸');
  const doneCountEl = el('span', {}, '완료됨');
  const doneSection = el('div', {});
  const doneToggle = el('div', { 
    class: 'bp-side-done-toggle',
    onclick: () => {
      doneToggle.classList.toggle('open');
      doneList.classList.toggle('open');
    }
  }, [doneArrow, doneCountEl]);
  doneSection.appendChild(doneToggle);
  doneSection.appendChild(doneList);
  wrap.appendChild(doneSection);
  
  rerender();
  return wrap;
}

function buildProcessSideItem(brandId, processType, existingProc, onAfterSave) {
  const proc = existingProc || {};
  const status = proc.status || '대기';
  const stConf = PROCESS_STATUSES.find(s => s.id === status) || PROCESS_STATUSES[0];
  
  const item = el('div', { 
    class: 'bp-side-item' + (status === '이슈' ? ' is-issue' : '') 
  });
  
  // 상단 row: 라벨 + 상태 칩
  const label = el('div', { class: 'bp-side-label' }, processType.label);
  
  const chip = el('div', { 
    class: 'bp-side-chip',
    style: { background: stConf.bg, color: stConf.color },
    onclick: (e) => {
      e.stopPropagation();
      showProcessStatusDropdown(chip, brandId, processType.id, proc, onAfterSave);
    }
  }, status);
  
  const topRow = el('div', { class: 'bp-side-row' }, [label, chip]);
  item.appendChild(topRow);
  
  // 메모 (클릭 시 textarea)
  const memoText = proc.text || '';
  const memoEl = el('div', { 
    class: 'bp-side-memo' + (memoText ? '' : ' is-placeholder'),
    onclick: () => {
      // textarea로 교체
      const ta = el('textarea', { 
        class: 'bp-side-memo-edit',
        placeholder: '메모 입력'
      });
      ta.value = memoText;
      memoEl.replaceWith(ta);
      ta.focus();
      ta.select();
      
      const save = async () => {
        const newText = ta.value.trim();
        if (newText === memoText) {
          // 변경 없음 — 원복
          ta.replaceWith(memoEl);
          return;
        }
        try {
          if (proc.process_id) {
            // 업데이트
            await apiUpdate('brand_processes', proc.process_id, { text: newText });
            proc.text = newText;
          } else {
            // 새로 생성 — apiCreate가 자동으로 STATE.data.brand_processes에 push함
            await apiCreate('brand_processes', {
              brand_id: brandId,
              process_type: processType.id,
              status: '대기',
              text: newText,
              checklist_json: ''
            });
          }
          toast('✓ 저장됨', 'ok');
          if (onAfterSave) onAfterSave();
        } catch (err) {
          console.error('brand_processes 저장 실패:', err);
          toast('저장 실패: ' + (err.message || '오류') + ' (시트 확인 필요)', 'err');
          ta.replaceWith(memoEl);
        }
      };
      
      ta.addEventListener('blur', save);
      ta.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          e.preventDefault();
          ta.value = memoText;
          ta.replaceWith(memoEl);
        } else if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
          e.preventDefault();
          ta.blur();
        }
      });
    }
  }, memoText || '+ 메모 추가');
  item.appendChild(memoEl);
  
  return item;
}

function showProcessStatusDropdown(anchorEl, brandId, processTypeId, existingProc, onAfterSave) {
  // 기존 popup 제거
  document.querySelectorAll('.bp-side-status-pop').forEach(p => p.remove());
  
  const popup = el('div', { class: 'bp-side-status-pop' });
  PROCESS_STATUSES.forEach(s => {
    const opt = el('div', { 
      class: 'bp-side-status-opt',
      style: { color: s.color },
      onclick: async (e) => {
        e.stopPropagation();
        popup.remove();
        // 저장
        try {
          if (existingProc && existingProc.process_id) {
            await apiUpdate('brand_processes', existingProc.process_id, { status: s.id });
            existingProc.status = s.id;
          } else {
            // apiCreate가 자동으로 STATE.data.brand_processes에 push함
            await apiCreate('brand_processes', {
              brand_id: brandId,
              process_type: processTypeId,
              status: s.id,
              text: '',
              checklist_json: ''
            });
          }
          toast('✓ 상태 변경: ' + s.id, 'ok');
          if (onAfterSave) onAfterSave();
        } catch (err) {
          console.error('brand_processes 저장 실패:', err);
          toast('저장 실패: ' + (err.message || '오류') + ' (시트 확인 필요)', 'err');
        }
      }
    }, s.id);
    popup.appendChild(opt);
  });
  
  document.body.appendChild(popup);
  
  // 위치 계산 (anchor 아래쪽)
  const rect = anchorEl.getBoundingClientRect();
  popup.style.top = (rect.bottom + 4) + 'px';
  popup.style.left = Math.max(8, rect.left) + 'px';
  
  // 외부 클릭 시 닫기
  setTimeout(() => {
    const closeHandler = (e) => {
      if (!popup.contains(e.target)) {
        popup.remove();
        document.removeEventListener('click', closeHandler);
      }
    };
    document.addEventListener('click', closeHandler);
  }, 0);
}

// ═══════════════════════════════════════════════════════════════
// Process Popover — 단계별 비교 표 셀 클릭 시 뜸 (× / Esc로만 닫힘)
// ═══════════════════════════════════════════════════════════════
let _activeProcessPopover = null;

function closeProcessPopover() {
  if (_activeProcessPopover) {
    if (_activeProcessPopover._cleanup) _activeProcessPopover._cleanup();
    _activeProcessPopover.remove();
    _activeProcessPopover = null;
  }
}

function openProcessPopover({ title, body, footer, anchorEl, width, onClose }) {
  closeProcessPopover();  // 기존 popover 닫기
  const popW = width || 380;
  
  // popover 구조
  const closeBtn = el('button', { 
    class: 'bp-popover-close', 
    type: 'button',
    onclick: () => closeProcessPopover()
  }, '×');
  
  const headerEl = el('div', { class: 'bp-popover-header' }, [
    el('div', { class: 'bp-popover-title' }, title),
    closeBtn
  ]);
  
  const bodyEl = el('div', {}, [body].filter(Boolean));
  const footerEl = footer ? el('div', { class: 'bp-popover-footer' }, footer) : null;
  
  const popover = el('div', { 
    class: 'bp-popover',
    style: { width: popW + 'px' }
  }, [
    headerEl,
    bodyEl,
    footerEl
  ].filter(Boolean));
  
  document.body.appendChild(popover);
  _activeProcessPopover = popover;
  
  // ─── 위치 계산 (anchor 기준 위/아래 자동) ───
  const positionPopover = () => {
    if (!anchorEl || !document.body.contains(anchorEl)) return;
    const rect = anchorEl.getBoundingClientRect();
    const popH = popover.offsetHeight || 400;
    const popWidth = popover.offsetWidth || popW;
    const viewH = window.innerHeight;
    const viewW = window.innerWidth;
    const spaceBelow = viewH - rect.bottom;
    const spaceAbove = rect.top;
    
    // 위/아래 결정 — 아래 공간 우선, 부족하면 위로
    let top, useBelow;
    if (spaceBelow >= popH + 20 || spaceBelow >= spaceAbove) {
      top = rect.bottom + 12;
      useBelow = true;
    } else {
      top = rect.top - popH - 12;
      useBelow = false;
    }
    
    // 좌측 위치 (anchor 좌측 기준, 화면 밖 안 나가게)
    let left = rect.left;
    if (left + popWidth > viewW - 16) left = viewW - popWidth - 16;
    if (left < 8) left = 8;
    
    popover.style.top = top + 'px';
    popover.style.left = left + 'px';
    
    // 말꼬리 위치 — anchor 중앙과 일치되게
    popover.classList.toggle('above', !useBelow);
    popover.classList.toggle('below', useBelow);
    
    // 말꼬리 좌측 오프셋 (anchor 중앙 - popover 좌측)
    const arrowOffset = Math.max(8, Math.min(popWidth - 22, rect.left + (rect.width / 2) - left - 7));
    popover.style.setProperty('--arrow-left', arrowOffset + 'px');
  };
  
  // 첫 위치 계산 (paint 후)
  requestAnimationFrame(positionPopover);
  
  // 스크롤/리사이즈 시 재계산
  const onScrollOrResize = () => positionPopover();
  document.addEventListener('scroll', onScrollOrResize, true);
  window.addEventListener('resize', onScrollOrResize);
  
  // Esc 키 닫기
  const onKeyDown = (e) => {
    if (e.key === 'Escape') {
      e.preventDefault();
      e.stopPropagation();
      closeProcessPopover();
    }
  };
  document.addEventListener('keydown', onKeyDown);
  
  // 외부 클릭 닫기 (popover 내부 + 담당자 picker 같은 자식 popover는 제외)
  const onDocClick = (e) => {
    if (popover.contains(e.target)) return;  // popover 내부 클릭
    // 다른 떠 있는 picker/popup 클릭은 무시 (stakeholder picker 등)
    if (e.target.closest('.stk-picker, .stk-popover, .cal-pop, .stk-pick-popover')) return;
    closeProcessPopover();
  };
  // setTimeout(0): 이 popover를 연 클릭 이벤트가 document까지 도달하기 전에 리스너 추가되지 않게
  setTimeout(() => {
    document.addEventListener('click', onDocClick);
  }, 0);
  
  // cleanup
  popover._cleanup = () => {
    document.removeEventListener('scroll', onScrollOrResize, true);
    window.removeEventListener('resize', onScrollOrResize);
    document.removeEventListener('keydown', onKeyDown);
    document.removeEventListener('click', onDocClick);
    if (onClose) onClose();
  };
  
  return popover;
}

function openBrandProcessEdit(brand, processType, existingProc, anchorEl) {
  const proc = existingProc || {
    brand_id: brand.brand_id,
    process_type: processType.id,
    status: '대기',
    text: '',
    owner_id: '',
    date: '',
    time: '',
    checklist_json: '[]'
  };
  
  // ─── 상태 4개 칩
  let currentStatus = proc.status || '대기';
  const statusRow = el('div', { class: 'bp-status-row' });
  const statusChips = [];
  PROCESS_STATUSES.forEach(s => {
    const chip = el('button', { 
      class: 'bp-status-chip' + (s.id === currentStatus ? ' active' : ''),
      style: { 
        color: s.color, 
        background: s.id === currentStatus ? s.bg : 'transparent',
        borderColor: s.id === currentStatus ? s.color : 'var(--border)'
      },
      onclick: (e) => {
        e.preventDefault();
        currentStatus = s.id;
        statusChips.forEach(c => {
          const cs = PROCESS_STATUSES.find(x => x.id === c.dataset.statusId);
          c.classList.toggle('active', cs.id === currentStatus);
          c.style.background = cs.id === currentStatus ? cs.bg : 'transparent';
          c.style.borderColor = cs.id === currentStatus ? cs.color : 'var(--border)';
        });
      }
    }, s.id);
    chip.dataset.statusId = s.id;
    statusChips.push(chip);
    statusRow.appendChild(chip);
  });
  
  // ─── 메모 텍스트
  const textInput = el('textarea', { 
    class: 'mp-input',
    placeholder: '메모 (예: 계약서 확인 완료, 날인 진행 예정)',
    style: { minHeight: '60px', fontSize: '13px' }
  });
  textInput.value = proc.text || '';
  
  // ─── 담당자 (stakeholder)
  const ownerInput = el('input', { type: 'hidden' });
  ownerInput.value = proc.owner_id || '';
  const ownerLabel = el('span', { class: 'bp-owner-label' }, 
    proc.owner_id ? (nameOfStakeholder(proc.owner_id) || '') : ''
  );
  const ownerBtn = el('button', { 
    class: 'bp-owner-btn' + (proc.owner_id ? ' has-owner' : ''),
    type: 'button',
    title: '담당자 선택',
    onclick: (e) => {
      e.preventDefault();
      openStakeholderPicker(ownerBtn, [ownerInput.value].filter(Boolean), {
        multi: false,
        onSelect: (ids) => {
          ownerInput.value = ids[0] || '';
          ownerLabel.textContent = ids[0] ? (nameOfStakeholder(ids[0]) || '') : '';
          ownerBtn.classList.toggle('has-owner', !!ids[0]);
        }
      });
    }
  }, [
    el('span', {}, '👤'),
    ownerLabel
  ]);
  
  // ─── 날짜 + 시간
  const dateInput = makeDateInput({ value: fmtDate(proc.date) || '' });
  const timeInput = makeTimeInput({ value: proc.time || '' });
  
  // ─── 체크리스트
  let checklist = [];
  try {
    checklist = JSON.parse(proc.checklist_json || '[]');
    if (!Array.isArray(checklist)) checklist = [];
  } catch { checklist = []; }
  
  const checklistWrap = el('div', { class: 'bp-checklist' });
  const renderChecklist = () => {
    checklistWrap.innerHTML = '';
    checklist.forEach((item, idx) => {
      const row = el('div', { class: 'bp-checklist-row' });
      const cb = el('input', { 
        type: 'checkbox',
        onchange: () => {
          checklist[idx].done = cb.checked;
          renderChecklist();
        }
      });
      cb.checked = item.done;
      const text = el('input', {
        type: 'text',
        class: 'bp-checklist-text',
        value: item.text || '',
        placeholder: '체크리스트 항목',
        onchange: () => { checklist[idx].text = text.value.trim(); }
      });
      if (item.done) text.style.textDecoration = 'line-through';
      const delBtn = el('button', { 
        class: 'bp-checklist-del',
        title: '삭제',
        onclick: (e) => {
          e.preventDefault();
          checklist.splice(idx, 1);
          renderChecklist();
        }
      }, '🗑');
      row.appendChild(cb);
      row.appendChild(text);
      row.appendChild(delBtn);

        ownerBtn
      ]),

      ]),

// ─── 클릭 복사 헬퍼 ─────────────────────────────────────────
// 단일 클릭 → 클립보드 복사 + 토스트
// 더블 클릭 → 메일(mailto:) 또는 전화(tel:) 앱 열기 (type에 따라)
// opts: { type: 'email' | 'phone' | 'text' }
function makeCopyable(element, value, opts) {
  opts = opts || {};
  if (!value) return element;
  const type = opts.type || 'text';
  
  element.classList.add('clickable-copy');
  element.title = type === 'email' 
    ? '클릭: 복사 · 더블클릭: 메일 보내기'
    : type === 'phone'
    ? '클릭: 복사 · 더블클릭: 전화 걸기'
    : '클릭: 복사';
  
  let clickTimer = null;
  
  element.addEventListener('click', (e) => {
    e.stopPropagation();
    if (clickTimer) return;  // 이미 대기 중 (단일 클릭 처리 대기)
    clickTimer = setTimeout(async () => {
      clickTimer = null;
      try {
        await navigator.clipboard.writeText(value);
        toast('✓ 복사됨: ' + value);
      } catch (err) {
        toast('복사 실패', 'err');
      }
    }, 220);  // 더블클릭 가능성 위해 짧게 지연
  });
  
  if (type === 'email' || type === 'phone') {
    element.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      e.preventDefault();
      if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
      const url = (type === 'email' ? 'mailto:' : 'tel:') + value;
      window.location.href = url;
    });
  }
  
  return element;
}

// 이메일/전화 라인 자동 생성 (copy 동작 포함)
// 사용: makeContactLine(s.email, 'email', { marginTop: '2px' })
function makeContactLine(value, type, extraStyle) {
  if (!value) return null;
  const icon = type === 'email' ? '✉ ' : type === 'phone' ? '☎ ' : '';
  const div = el('div', { 
    style: Object.assign({ 
      fontSize: '11px', 
      color: 'var(--text-muted)' 
    }, extraStyle || {})
  }, icon + value);
  makeCopyable(div, value, { type });
  return div;
}

// ─── stakeholder ↔ brand 매칭/연결/해제 헬퍼 ──────────────────
// 한 사람이 여러 브랜드 연결 가능 (related_brand_ids 콤마 구분)
// 기존 related_brand_id (단일) 도 같이 인식
function stakeholderInBrand(stk, brandId) {
  if (!stk || !brandId) return false;
  if (stk.related_brand_id === brandId) return true;
  const ids = String(stk.related_brand_ids || '').split(',').map(x => x.trim()).filter(Boolean);
  return ids.includes(brandId);
}

async function linkStakeholderToBrand(stk, brandId) {
  const ids = String(stk.related_brand_ids || '').split(',').map(x => x.trim()).filter(Boolean);
  if (ids.includes(brandId)) return false;  // 이미 연결됨
  if (stk.related_brand_id === brandId) return false;  // 단일 필드에 이미 있음
  ids.push(brandId);
  const newIdsStr = ids.join(', ');
  await apiUpdate('stakeholders', stk.stakeholder_id, { related_brand_ids: newIdsStr });
  stk.related_brand_ids = newIdsStr;
  return true;
}

async function unlinkStakeholderFromBrand(stk, brandId) {
  const updates = {};
  let changed = false;
  
  // related_brand_ids에서 제거
  const ids = String(stk.related_brand_ids || '').split(',').map(x => x.trim()).filter(Boolean);
  const newIds = ids.filter(x => x !== brandId);
  if (ids.length !== newIds.length) {
    const newIdsStr = newIds.join(', ');
    updates.related_brand_ids = newIdsStr;
    stk.related_brand_ids = newIdsStr;
    changed = true;
  }
  
  // related_brand_id (단일)가 이 브랜드면 비우기
  if (stk.related_brand_id === brandId) {
    updates.related_brand_id = '';
    stk.related_brand_id = '';
    changed = true;
  }
  
  if (changed) {
    await apiUpdate('stakeholders', stk.stakeholder_id, updates);
  }
  return changed;
}

// ─── 브랜드 인라인 편집 헬퍼 ───────────────────────────────
// element 안에 보이는 텍스트를 더블클릭 시 input으로 교체 → 자동 저장
// Enter: 즉시 저장 | Esc: 취소 | blur (다른 곳 클릭): 자동 저장
// opts: { brand, field, type='text', options=[], displayFn=(v)=>v, onSaved, placeholder }
function makeBrandEditable(element, opts) {
  element.classList.add('brand-editable');
  element.title = '더블클릭하여 수정';
  
  let editing = false;
  
  element.addEventListener('dblclick', (e) => {
    e.stopPropagation();
    e.preventDefault();
    if (editing) return;
    editing = true;
    element.classList.add('editing');
    
    const currentVal = opts.brand[opts.field] !== undefined ? opts.brand[opts.field] : '';
    const originalHtml = element.innerHTML;
    
    let input;
    const type = opts.type || 'text';
    
    if (type === 'select') {
      input = el('select', { class: 'brand-inline-input' });
      (opts.options || []).forEach(([v, label]) => {
        const o = el('option', { value: v }, label);
        if (String(currentVal) === String(v)) o.selected = true;
        input.appendChild(o);
      });
    } else if (type === 'date') {
      input = el('input', { 
        type: 'date', 
        class: 'brand-inline-input', 
        value: currentVal ? fmtDate(currentVal) : '' 
      });
    } else if (type === 'textarea') {
      input = el('textarea', { 
        class: 'brand-inline-input textarea', 
        rows: 2,
        placeholder: opts.placeholder || ''
      });
      input.value = currentVal || '';
    } else {
      input = el('input', { 
        type: 'text', 
        class: 'brand-inline-input', 
        value: currentVal || '',
        placeholder: opts.placeholder || ''
      });
    }
    
    // 우측 상태 아이콘 (저장 중 ⟳, 성공 시 ✓)
    const statusEl = el('span', { class: 'brand-inline-status' });
    
    const wrap = el('div', { class: 'brand-inline-wrap' }, [input, statusEl]);
    element.innerHTML = '';
    element.appendChild(wrap);
    
    setTimeout(() => { 
      input.focus(); 
      if (type !== 'select' && input.select) input.select(); 
    }, 0);
    
    let saving = false;
    let cancelled = false;
    
    const restore = () => {
      cancelled = true;
      editing = false;
      element.classList.remove('editing');
      element.innerHTML = originalHtml;
    };
    
    const doSave = async () => {
      if (saving || cancelled || !editing) return;
      const newVal = (input.value || '').trim();
      if (String(newVal) === String(currentVal || '')) {
        // 변경 없음 → 그냥 닫기
        restore();
        return;
      }
      saving = true;
      input.disabled = true;
      statusEl.innerHTML = '<span class="btn-spinner-sm">⟳</span>';
      
      try {
        await apiUpdate('brands', opts.brand.brand_id, { [opts.field]: newVal });
        opts.brand[opts.field] = newVal;
        statusEl.innerHTML = '<span style="color: #22c55e">✓</span>';
        setTimeout(() => {
          if (cancelled) return;
          editing = false;
          element.classList.remove('editing');
          if (opts.onSaved) {
            opts.onSaved(newVal);
          } else {
            element.innerHTML = '';
            const display = opts.displayFn ? opts.displayFn(newVal) : (newVal || '—');
            element.textContent = display;
          }
        }, 300);
      } catch (err) {
        saving = false;
        input.disabled = false;
        statusEl.innerHTML = '';
        toast(err.message || '저장 실패', 'err');
        setTimeout(() => input.focus(), 0);
      }
    };
    
    // ─── 저장 트리거들 ───
    // 1) Enter (textarea 제외) → 즉시 저장
    // 2) Esc → 취소
    // 3) blur (다른 곳 클릭) → 자동 저장
    // 4) select/date의 change → 즉시 저장
    
    input.addEventListener('keydown', (ev) => {
      ev.stopPropagation();
      if (ev.key === 'Enter' && type !== 'textarea') { 
        ev.preventDefault(); 
        input.blur();  // blur → doSave 트리거
      }
      else if (ev.key === 'Escape') { 
        ev.preventDefault(); 
        restore(); 
      }
    });
    
    // blur 자동 저장 (짧은 지연으로 다른 이벤트 먼저 처리)
    input.addEventListener('blur', () => {
      setTimeout(() => { if (editing && !cancelled) doSave(); }, 80);
    });
    
    input.addEventListener('click', (ev) => ev.stopPropagation());
  });
}

    progressItems.forEach(([label, fieldKey]) => {
      const v = b[fieldKey];
      const valEl = el('div', { 
        class: 'brand-progress-val tone-' + statusToTone(v) 
      }, v || '—');
      makeBrandEditable(valEl, {
        brand: b, field: fieldKey, type: 'textarea', placeholder: '예: 완료 / 개발중 / 계약서 전달 필요',
        onSaved: (newVal) => {
          valEl.textContent = newVal || '—';
          valEl.className = 'brand-progress-val tone-' + statusToTone(newVal);
          // brand-editable 클래스가 인라인 편집 시 제거됐을 수 있어서 다시 적용
          valEl.classList.add('brand-editable');
        }
      });
      progressGrid.appendChild(el('div', { class: 'brand-progress-item' }, [
        el('div', { class: 'brand-progress-label' }, label),
        valEl
      ]));
    });
    detailEl.appendChild(el('div', { class: 'brand-progress-section' }, [
      el('h4', { class: 'brand-section-title' }, '진행 상태 (셀 더블클릭하여 수정)'),
      progressGrid
    ]));
    
    // 관련 데이터 매칭
    const bname = (b.brand_name || '').toLowerCase();
    const bid = b.brand_id;
    const baliases = String(b.aliases || '').split(',').map(a => a.trim().toLowerCase()).filter(Boolean);
    
    const matchedThreads = (STATE.data.mail_threads || []).filter(t => {
      if (t.brand_id && t.brand_id === bid) return true;
      if (t.brand_id && t.brand_id !== bid) return false;
      const blob = ((t.name || '') + ' ' + (t.client_org || '') + ' ' + (t.subtitle || '')).toLowerCase();
      if (bname && blob.includes(bname)) return true;
      if (baliases.some(a => blob.includes(a))) return true;
      const logsInThread = (STATE.data.logs || []).filter(l => l.thread_id === t.thread_id && l.brand_id === bid);
      return logsInThread.length > 0;
    });
    
    const brandStakeholders = (STATE.data.stakeholders || []).filter(s => 
      stakeholderInBrand(s, b.brand_id)
    );
    
    const brandTasks = (STATE.data.tasks || []).filter(t => t.brand_id === b.brand_id);
    const pendingTasks = brandTasks.filter(t => t.status === '대기' || t.status === '진행중');
    const completedTasks = brandTasks.filter(t => t.status === '완료');
    
    if (matchedThreads.length > 0) {
      detailEl.appendChild(el('div', { class: 'brand-list-section' }, [
        el('h4', { class: 'brand-section-title' }, '📨 관련 메일스레드 (' + matchedThreads.length + ')'),
        el('div', { class: 'brand-thread-list' }, matchedThreads.map(t => {
          // 그 스레드의 가장 최신 log 찾기 (date + time DESC)
          const threadLogs = (STATE.data.logs || [])
            .filter(l => l.thread_id === t.thread_id)
            .sort((a, b) => {
              const ak = (b.date || '') + ' ' + (b.time || '');
              const bk = (a.date || '') + ' ' + (a.time || '');
              return ak.localeCompare(bk);
            });
          const latest = threadLogs[0];
          
          // 최신 요약 라인 만들기
          let latestLine = null;
          if (latest && latest.oneliner && latest.oneliner.trim()) {
            latestLine = el('div', { class: 'brand-thread-latest' }, [
              fmtDateShort(latest.date),
              el('span', { class: 'brand-thread-latest-type' }, '[' + (latest.type || '메일') + ']'),
              latest.oneliner.trim()
            ]);
          } else {
            latestLine = el('div', { class: 'brand-thread-latest empty' }, '최신 한 줄 요약 없음');
          }
          
          return el('div', {
            class: 'brand-thread-item',
            onclick: () => openMailThreadDetail(t)
          }, [
            el('div', { class: 'brand-thread-row1' }, [
              el('span', { class: 'brand-thread-id' }, t.thread_id || ''),
              el('span', { class: 'brand-thread-name' }, t.name || '(이름 없음)'),
              t.current_stage ? el('span', { class: 'brand-thread-stage' }, t.current_stage) : null
            ].filter(Boolean)),
            latestLine
          ]);
        }))
      ]));
    }
    
    // ─── 연락처 섹션 (연결/해제/검색 추가) ─────────────────
    const stkSection = el('div', { class: 'brand-list-section' });
    
    // 제목 + ➕ 아이콘
    const addIcon = el('button', { 
      class: 'brand-stk-add-icon',
      title: '연락처 연결 추가'
    }, '➕');
    stkSection.appendChild(el('h4', { class: 'brand-section-title' }, [
      '👥 관련 연락처 (' + brandStakeholders.length + ')',
      addIcon
    ]));
    
    const stkListEl = el('div', { class: 'brand-stk-list' });
    brandStakeholders.forEach(s => {
      const item = el('div', { class: 'brand-stk-item' }, [
        el('div', { class: 'brand-stk-name' }, s.name_ko || s.name_en || '?'),
        el('div', { class: 'brand-stk-role' }, [s.org, s.role].filter(Boolean).join(' · ')),
        el('button', {
          class: 'brand-stk-unlink',
          title: '이 브랜드 연결 해제',
          onclick: async (ev) => {
            ev.stopPropagation();
            try {
              await unlinkStakeholderFromBrand(s, b.brand_id);
              toast('✓ 연결 해제됨');
              renderDetail();
            } catch (err) { toast(err.message || '해제 실패', 'err'); }
          }
        }, '✕')
      ]);
      
      // 이메일 / 전화 표시 (클릭 = 복사, 더블클릭 = 메일/전화 앱)
      if (s.email) {
        const emailEl = el('div', { class: 'brand-stk-contact-line' }, '✉ ' + s.email);
        makeCopyable(emailEl, s.email, { type: 'email' });
        item.appendChild(emailEl);
      }
      if (s.phone) {
        const phoneEl = el('div', { class: 'brand-stk-contact-line' }, '☎ ' + s.phone);
        makeCopyable(phoneEl, s.phone, { type: 'phone' });
        item.appendChild(phoneEl);
      }
      
      // 카드 본문 클릭 → 팝오버 (이메일/전화 클릭은 stopPropagation으로 차단됨)
      item.addEventListener('click', (ev) => {
        if (ev.target.classList.contains('brand-stk-unlink')) return;
        if (ev.target.classList.contains('clickable-copy')) return;
        if (ev.target.closest('.clickable-copy')) return;
        showStakeholderPopover(item, s.stakeholder_id);
      });
      stkListEl.appendChild(item);
    });
    stkSection.appendChild(stkListEl);
    
    // 검색창 컨테이너 (➕ 클릭 시 등장)
    const searchSlot = el('div');
    stkSection.appendChild(searchSlot);
    
    const showSearchUI = () => {
      const searchWrap = el('div', { class: 'brand-stk-search-wrap' });
      const input = el('input', {
        type: 'text',
        class: 'brand-stk-search-input',
        placeholder: '이름 / 조직 / 역할 검색...'
      });
      const results = el('div', { class: 'brand-stk-search-results', style: { display: 'none' } });
      searchWrap.appendChild(input);
      searchWrap.appendChild(results);
      
      const renderResults = () => {
        const q = input.value.trim().toLowerCase();
        results.innerHTML = '';
        if (!q) { results.style.display = 'none'; return; }
        
        const matches = (STATE.data.stakeholders || []).filter(s => {
          if (stakeholderInBrand(s, b.brand_id)) return false;
          const blob = [s.name_ko, s.name_en, s.org, s.role, s.team]
            .filter(Boolean).join(' ').toLowerCase();
          return blob.includes(q);
        }).slice(0, 15);
        
        if (matches.length === 0) {
          results.appendChild(el('div', { 
            class: 'brand-stk-search-item', 
            style: { color: 'var(--text-faint)', cursor: 'default', fontStyle: 'italic' } 
          }, '매칭 결과 없음'));
        } else {
          matches.forEach(s => {
            const item = el('div', {
              class: 'brand-stk-search-item',
              onclick: async () => {
                try {
                  await linkStakeholderToBrand(s, b.brand_id);
                  toast('✓ ' + (s.name_ko || s.name_en || '?') + ' 연결됨');
                  renderDetail();
                } catch (err) { toast(err.message || '연결 실패', 'err'); }
              }
            }, [
              el('div', { class: 'brand-stk-search-item-name' }, s.name_ko || s.name_en || '?'),
              el('div', { class: 'brand-stk-search-item-org' }, 
                [s.org, s.role, s.team].filter(Boolean).join(' · ')
              )
            ]);
            results.appendChild(item);
          });
        }
        results.style.display = 'block';
      };
      
      input.addEventListener('input', renderResults);
      input.addEventListener('focus', renderResults);
      input.addEventListener('keydown', (ev) => {
        if (ev.key === 'Escape') {
          ev.preventDefault();
          searchSlot.innerHTML = '';
        }
      });
      
      setTimeout(() => {
        const outClick = (ev) => {
          if (!searchWrap.contains(ev.target) && ev.target !== addIcon) {
            searchSlot.innerHTML = '';
            document.removeEventListener('click', outClick);
          }
        };
        document.addEventListener('click', outClick);
      }, 0);
      
      searchSlot.innerHTML = '';
      searchSlot.appendChild(searchWrap);
      setTimeout(() => input.focus(), 0);
    };
    
    addIcon.onclick = (ev) => { 
      ev.stopPropagation(); 
      if (searchSlot.firstChild) {
        searchSlot.innerHTML = '';  // 토글
      } else {
        showSearchUI();
      }
    };
    
    detailEl.appendChild(stkSection);
    
    if (brandTasks.length > 0) {
      detailEl.appendChild(el('div', { class: 'brand-list-section' }, [
        el('h4', { class: 'brand-section-title' }, 
          '✅ 할 일 (' + pendingTasks.length + '건 대기 · ' + completedTasks.length + '건 완료)'
        ),
        el('div', { class: 'brand-task-list' }, brandTasks.map(t =>
          el('div', {
            class: 'brand-task-item' + (t.status === '완료' ? ' done' : ''),
            onclick: () => openTaskForm(t)
          }, [
            el('span', { class: 'brand-task-check' }, t.status === '완료' ? '✓' : '○'),
            el('span', { class: 'brand-task-title' }, t.title || '(제목 없음)'),
            t.due_date ? el('span', { class: 'brand-task-due' }, fmtDateShort(t.due_date)) : null
          ].filter(Boolean))
        ))
      ]));
    }
    
    const matchKeys = [b.brand_name, ...baliases].filter(Boolean).map(k => k.toLowerCase());
    const matchedTimelineTasks = (STATE.data.timeline_tasks || []).filter(tt => {
      const text = (tt.name || '').toLowerCase();
      return matchKeys.some(k => k && text.includes(k));
    });
    
    if (matchedTimelineTasks.length > 0) {
      detailEl.appendChild(el('div', { class: 'brand-list-section' }, [
        el('h4', { class: 'brand-section-title' }, '▦ 타임라인 관련 태스크 (' + matchedTimelineTasks.length + ')'),
        el('div', { class: 'brand-tt-list' }, matchedTimelineTasks.map(tt => {
          const prog = parseInt(tt.progress || 0, 10) || 0;
          const status = tt.status || 'planned';
          return el('div', { class: 'brand-tt-item' }, [
            el('div', { class: 'brand-tt-head' }, [
              el('span', { class: 'brand-tt-id' }, tt.timeline_task_id || ''),
              el('span', { class: 'brand-tt-name' }, tt.name || ''),
              el('span', { class: 'brand-tt-status status-' + status }, status)
            ]),
            el('div', { class: 'brand-tt-progress' }, [
              el('div', { class: 'brand-tt-progress-bar', style: { width: prog + '%' } })
            ]),
            el('div', { class: 'brand-tt-progress-text' }, prog + '%')
          ]);
        }))
      ]));
    }
  };
  
  container.appendChild(listEl);
  container.appendChild(detailEl);
  root.appendChild(container);
  
  renderList();
  renderDetail();
}

// ═══════════════════════════════════════════════════════════════
//  Logs 페이지
// ═══════════════════════════════════════════════════════════════
function renderLogs(root) {
  const all = STATE.data.logs.slice().sort((a,b) => {
    const ak = (a.date || '') + ' ' + (a.time || '');
    const bk = (b.date || '') + ' ' + (b.time || '');
    return bk.localeCompare(ak);
  });
  
  // 필터
  const f = STATE.filters;
  const filtered = all.filter(l => {
    if (f.brand_id && l.brand_id !== f.brand_id) return false;
    if (f.category && l.category !== f.category) return false;
    if (f.type && l.type !== f.type) return false;
    if (f.search) {
      const s = f.search.toLowerCase();
      const blob = [l.subject, l.summary, l.oneliner, l.from_id, l.to_ids].join(' ').toLowerCase();
      if (!blob.includes(s)) return false;
    }
    return true;
  });
  
  // 필터 바
  const fbar = el('div', { class: 'filter-bar' }, [
    el('span', { class: 'filter-label' }, '필터'),
    selectFilter('brand_id', '모든 브랜드', STATE.data.brands.map(b => [b.brand_id, b.brand_name])),
    selectFilter('category', '모든 카테고리', [
      ['모델계약','모델계약'],['브랜드계약','브랜드계약'],['메뉴개발','메뉴개발'],['촬영','촬영'],
      ['입금','입금'],['키비주얼','키비주얼'],['판촉물','판촉물'],['유튜브','유튜브'],
      ['노출','노출'],['KPI','KPI'],['기타','기타']
    ]),
    selectFilter('type', '모든 유형', [['메일','메일'],['카톡','카톡'],['통화','통화'],['미팅','미팅'],['메모','메모'],['변경','변경']]),
    el('input', {
      type: 'text', placeholder: '검색 (제목, 요약)',
      value: f.search || '',
      oninput: (e) => { STATE.filters.search = e.target.value; renderContent(); },
      style: { minWidth: '200px' }
    }),
    Object.keys(STATE.filters).length > 0 
      ? el('button', { class: 'btn btn-ghost', onclick: () => { STATE.filters = {}; renderContent(); } }, '필터 초기화')
      : null
  ].filter(Boolean));
  root.appendChild(fbar);
  
  root.appendChild(el('div', { 
    style: { 
      fontSize: '12px', color: 'var(--text-muted)', marginBottom: '10px',
      display: 'flex', alignItems: 'center', gap: '10px' 
    } 
  }, [
    el('span', {}, `총 ${filtered.length}건${filtered.length !== all.length ? ` (전체 ${all.length}건 중)` : ''}`),
    el('span', { style: { color: 'var(--text-faint)' } }, '· 행 클릭 → 내용 펼치기'),
    el('span', { style: { marginLeft: 'auto', color: 'var(--text-faint)' } }, [
      el('button', { 
        class: 'btn btn-ghost', 
        style: { fontSize: '11px', padding: '3px 8px' },
        onclick: () => { document.querySelectorAll('.log-row.open').forEach(r => r.classList.remove('open')); }
      }, '모두 접기')
    ])
  ]));
  
  if (filtered.length === 0) {
    root.appendChild(el('div', { class: 'empty' }, [
      el('div', { class: 'empty-title' }, '로그가 없습니다'),
      all.length === 0 ? '우측 상단 "＋ 새 로그" 버튼으로 첫 기록을 남겨보세요' : '필터 조건에 맞는 기록이 없습니다'
    ]));
    return;
  }
  
  // 토글 리스트
  const list = el('div', { class: 'log-list' });
  filtered.forEach(l => list.appendChild(logRow(l)));
  root.appendChild(list);
}

function logRow(l) {
  const row = el('div', { class: 'log-row' });
  
  // 메타 정보 줄 (한 줄 헤더)
  const timeStr = fmtTime(l.time);
  const dateStr = fmtDate(l.date) + (timeStr ? ' ' + timeStr : '');
  
  const head = el('div', { 
    class: 'log-row-head',
    onclick: () => row.classList.toggle('open')
  }, [
    el('span', { class: 'lr-toggle' }, '▶'),
    el('span', { class: 'lr-date' }, dateStr),
    el('span', { class: 'lr-type t-' + (l.type || '메모') }, l.type || '메모'),
    el('span', { class: 'lr-dir d-' + (l.direction || '') }, l.direction || '—'),
    el('span', { class: 'lr-cat' }, l.category || ''),
    el('span', { class: 'lr-subject', title: l.subject }, l.subject || '(제목 없음)'),
    el('span', { class: 'lr-brand', title: l.brand_id ? nameOfBrand(l.brand_id) : '' }, 
      l.brand_id ? nameOfBrand(l.brand_id) : '—'),
    el('span', { class: 'lr-actions' }, [
      el('button', { 
        class: 'btn-icon', 
        title: '수정', 
        onclick: (e) => { e.stopPropagation(); openLogForm(l); } 
      }, '✏'),
      el('button', { 
        class: 'btn-icon', 
        title: '삭제', 
        onclick: (e) => { e.stopPropagation(); confirmDelete('logs', l.log_id); } 
      }, '🗑')
    ])
  ]);
  row.appendChild(head);
  
  // 펼침 영역 = 등록 모달 양식 (라벨-값 페어, 본문 전문은 제외)
  const fromName = l.from_id ? nameOfStakeholder(l.from_id) : '';
  const toIds = (l.to_ids || '').split(/[,;]/).map(s => s.trim()).filter(Boolean);
  const toNames = toIds.map(id => nameOfStakeholder(id)).filter(Boolean).join(', ');
  
  const field = (label, value, isFull) => el('div', { 
    class: 'lrb-field' + (isFull ? ' full' : '')
  }, [
    el('div', { class: 'lrb-field-label' }, label),
    el('div', { class: 'lrb-field-value' + (value ? '' : ' empty') }, value || '—')
  ]);
  
  const body = el('div', { class: 'log-row-body' }, [
    el('div', { class: 'lrb-form' }, [
      field('날짜', fmtDate(l.date)),
      field('시간', fmtTime(l.time)),
      field('유형', l.type || ''),
      field('방향', l.direction || ''),
      field('관련 브랜드', l.brand_id ? nameOfBrand(l.brand_id) : ''),
      field('카테고리', l.category || ''),
      field('보낸 사람', fromName),
      field('받는 사람', toNames),
      field('제목', l.subject || '', true),
      // 요약 (멀티라인)
      el('div', { class: 'lrb-field full' }, [
        el('div', { class: 'lrb-field-label' }, '요약'),
        l.summary 
          ? el('div', { class: 'lrb-field-value multiline' }, cleanMailBody(l.summary))
          : el('div', { class: 'lrb-field-value empty' }, '—')
      ]),
      el('div', { class: 'lrb-field full' }, [
        el('div', { class: 'lrb-field-label' }, '첨부 링크'),
        l.attachments_link 
          ? el('div', { class: 'lrb-field-value' }, [
              el('a', { 
                href: l.attachments_link, target: '_blank',
                onclick: (e) => e.stopPropagation()
              }, l.attachments_link)
            ])
          : el('div', { class: 'lrb-field-value empty' }, '—')
      ])
    ])
  ]);
  row.appendChild(body);
  
  return row;
}

function selectFilter(key, defaultLabel, options) {
  const sel = el('select', {
    onchange: (e) => {
      if (e.target.value) STATE.filters[key] = e.target.value;
      else delete STATE.filters[key];
      renderContent();
    }
  }, [
    el('option', { value: '' }, defaultLabel),
    ...options.map(([v, label]) => {
      const opt = el('option', { value: v }, label);
      if (STATE.filters[key] === v) opt.selected = true;
      return opt;
    })
  ]);
  return sel;
}

// ═══════════════════════════════════════════════════════════════
//  Stakeholders 페이지
// ═══════════════════════════════════════════════════════════════
function renderStakeholders(root) {
  const all = STATE.data.stakeholders;
  
  // 검색 필터
  const f = STATE.filters;
  const filtered = all.filter(s => {
    if (f.org && s.org !== f.org) return false;
    if (f.contact_role && s._role !== f.contact_role) return false;
    if (f.search) {
      const k = f.search.toLowerCase();
      const blob = [s.name_ko, s.name_en, s.org, s.role, s.team, s.email, s.phone].join(' ').toLowerCase();
      if (!blob.includes(k)) return false;
    }
    return true;
  });
  
  // org별 인원 카운트 (필터 적용 전 전체 기준)
  const orgCounts = {};
  all.forEach(s => {
    const o = s.org || '기타';
    orgCounts[o] = (orgCounts[o] || 0) + 1;
  });
  
  // ─── 카테고리 칩 필터 (org 기반) ───
  const ORG_ORDER_FILTER = ['셰프','셰프소속사','쿠팡이츠','올리브파트너스','라꼰즈','브랜드사','기타'];
  const visibleOrgs = ORG_ORDER_FILTER.filter(o => orgCounts[o] > 0);
  
  const chipBar = el('div', { class: 'sh-chip-bar' }, [
    // 전체 칩
    el('button', {
      class: 'sh-chip' + (!f.org ? ' active' : ''),
      onclick: () => { delete STATE.filters.org; renderContent(); }
    }, '전체 · ' + all.length),
    ...visibleOrgs.map(o => el('button', {
      class: 'sh-chip' + (f.org === o ? ' active' : ''),
      onclick: () => { 
        STATE.filters.org = (f.org === o) ? '' : o; 
        if (!STATE.filters.org) delete STATE.filters.org;
        renderContent(); 
      }
    }, o + ' · ' + orgCounts[o]))
  ]);
  root.appendChild(chipBar);
  
  // ─── 보조 필터 (역할 + 검색) ───
  const fbar = el('div', { class: 'filter-bar' }, [
    el('span', { class: 'filter-label' }, '필터'),
    selectFilter('contact_role', '모든 역할', [['메인','메인'],['참조','참조'],['그룹메일','그룹메일']]),
    el('input', {
      type: 'text', placeholder: '이름 / 이메일 / 역할 검색',
      value: f.search || '',
      oninput: (e) => { STATE.filters.search = e.target.value; renderContent(); },
      style: { minWidth: '240px' }
    })
  ]);
  root.appendChild(fbar);
  
  if (filtered.length === 0) {
    root.appendChild(el('div', { class: 'empty' }, [
      el('div', { class: 'empty-title' }, '연락처가 없습니다'),
      '우측 상단 버튼으로 추가해주세요'
    ]));
    return;
  }
  
  // 소속별 그룹
  const ORG_ORDER = ['쿠팡이츠','올리브파트너스','라꼰즈','셰프','셰프소속사','브랜드사','기타'];
  const byOrg = {};
  filtered.forEach(s => {
    const o = s.org || '기타';
    if (!byOrg[o]) byOrg[o] = [];
    byOrg[o].push(s);
  });
  
  ORG_ORDER.forEach(o => {
    if (!byOrg[o]) return;
    const group = el('div', { class: 'stakeholder-group' }, [
      el('div', { class: 'sh-group-title' }, `${o} · ${byOrg[o].length}명`),
      el('div', { class: 'sh-grid' }, byOrg[o].map(s => stakeholderCard(s)))
    ]);
    root.appendChild(group);
    delete byOrg[o];
  });
  // 위 ORDER에 없는 소속도 출력
  Object.keys(byOrg).forEach(o => {
    const group = el('div', { class: 'stakeholder-group' }, [
      el('div', { class: 'sh-group-title' }, `${o} · ${byOrg[o].length}명`),
      el('div', { class: 'sh-grid' }, byOrg[o].map(s => stakeholderCard(s)))
    ]);
    root.appendChild(group);
  });
  
  // 강조 대상 있으면 스크롤 + 펄스 트리거 + STATE 초기화
  if (STATE.highlightStakeholderId) {
    const targetId = STATE.highlightStakeholderId;
    STATE.highlightStakeholderId = null;  // 1회만
    setTimeout(() => {
      const target = document.querySelector('.sh-card[data-stakeholder-id="' + targetId + '"]');
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        // 1회 펄스 후 클래스 제거 → 테두리 원래대로
        setTimeout(() => target.classList.remove('stk-highlight'), 1850);
      }
    }, 60);
  }
}

function stakeholderCard(s) {
  const isHighlight = STATE.highlightStakeholderId === s.stakeholder_id;
  const card = el('div', { 
    class: 'sh-card' + (isHighlight ? ' stk-highlight' : ''),
    'data-stakeholder-id': s.stakeholder_id
  }, [
    el('div', { class: 'sh-actions' }, [
      el('button', { class: 'btn-icon', title: '수정', onclick: () => openStakeholderForm(s) }, '✏'),
      el('button', { class: 'btn-icon', title: '삭제', onclick: () => confirmDelete('stakeholders', s.stakeholder_id) }, '🗑')
    ]),
    el('div', { class: 'sh-name' }, [
      s.name_ko || s.name_en || '—',
      s.name_en && s.name_ko ? el('span', { class: 'sh-name-en' }, '(' + s.name_en + ')') : null,
      s._role ? el('span', { class: 'sh-role-chip r-' + s._role }, s._role) : null
    ].filter(Boolean)),
    el('div', { class: 'sh-role' }, [s.role, s.team].filter(Boolean).join(' · ') || '—'),
    el('div', { class: 'sh-contact' }, [
      s.email ? (() => { const sp = el('span', {}, '✉ ' + s.email); makeCopyable(sp, s.email, { type: 'email' }); return sp; })() : null,
      s.phone ? (() => { const sp = el('span', {}, '☎ ' + s.phone); makeCopyable(sp, s.phone, { type: 'phone' }); return sp; })() : null,

// ═══════════════════════════════════════════════════════════════
//  Tasks 페이지 (칸반)
// ═══════════════════════════════════════════════════════════════
function renderTasks(root) {
  const all = STATE.data.tasks;
  const f = STATE.filters;
  const filtered = all.filter(t => {
    if (f.brand_id && t.brand_id !== f.brand_id) return false;
    if (f.priority && t.priority !== f.priority) return false;
    return true;
  });
  
  const fbar = el('div', { class: 'filter-bar' }, [
    el('span', { class: 'filter-label' }, '필터'),
    selectFilter('brand_id', '모든 브랜드', STATE.data.brands.map(b => [b.brand_id, b.brand_name])),
    selectFilter('priority', '모든 우선순위', [['높음','높음'],['중간','중간'],['낮음','낮음']])
  ]);
  root.appendChild(fbar);
  
  const STATUSES = ['대기','진행중','완료','보류'];
  const board = el('div', { class: 'task-board' });
  
  STATUSES.forEach(status => {
    const tasks = filtered.filter(t => t.status === status || (!t.status && status === '대기'));
    const col = el('div', { class: 'task-column' }, [
      el('div', { class: 'task-col-head' }, [
        status,
        el('span', { class: 'task-col-count' }, String(tasks.length))
      ])
    ]);
    tasks.sort((a,b) => (a.due_date || '9999').localeCompare(b.due_date || '9999'));
    tasks.forEach(t => col.appendChild(taskCard(t)));
    board.appendChild(col);
  });
  
  root.appendChild(board);
}

function taskCard(t) {
  const card = el('div', { class: 'task-card', onclick: () => openTaskForm(t) });
  card.appendChild(el('div', { class: 'task-title' }, t.title || '—'));
  
  const meta = el('div', { class: 'task-meta' });
  if (t.priority) meta.appendChild(el('span', { class: 'task-priority ' + t.priority }));
  if (t.due_date) {
    const diff = Math.round((new Date(t.due_date) - new Date()) / 86400000);
    let cls = '';
    if (diff < 0 && t.status !== '완료') cls = 'overdue';
    else if (diff <= 3 && t.status !== '완료') cls = 'soon';
    meta.appendChild(el('span', { class: 'task-due ' + cls }, fmtDate(t.due_date)));
  }
  if (t.brand_id) meta.appendChild(el('span', {}, '· ' + nameOfBrand(t.brand_id)));
  if (t.owner_id) meta.appendChild(el('span', {}, '· ' + nameOfStakeholder(t.owner_id)));
  card.appendChild(meta);
  
  return card;
}

//  Documents 페이지
// ═══════════════════════════════════════════════════════════════
function renderDocuments(root) {
  const all = STATE.data.documents.slice().sort((a,b) => (b.date || '').localeCompare(a.date || ''));
  const f = STATE.filters;
  const filtered = all.filter(d => {
    if (f.category && d.category !== f.category) return false;
    if (f.type && d.type !== f.type) return false;
    if (f.search) {
      const k = f.search.toLowerCase();
      const blob = [d.title, d.summary, d.from_org, d.to_org].join(' ').toLowerCase();
      if (!blob.includes(k)) return false;
    }
    return true;
  });
  
  const fbar = el('div', { class: 'filter-bar' }, [
    el('span', { class: 'filter-label' }, '필터'),
    selectFilter('category', '모든 카테고리', [
      ['키비주얼','키비주얼'],['판촉물','판촉물'],['유튜브','유튜브'],['계약','계약'],
      ['노출','노출'],['기획','기획'],['KPI','KPI'],['기타','기타']
    ]),
    selectFilter('type', '모든 유형', [['계약서','계약서'],['제안서','제안서'],['기획안','기획안'],['PDF','PDF'],['PPT','PPT'],['이미지','이미지'],['메일','메일'],['기타','기타']]),
    el('input', {
      type: 'text', placeholder: '제목 / 요약 / 한 줄 요약 검색',
      value: f.search || '',
      oninput: (e) => { STATE.filters.search = e.target.value; renderContent(); }
    })
  ]);
  root.appendChild(fbar);
  
  if (filtered.length === 0) {
    root.appendChild(el('div', { class: 'empty' }, [el('div', { class: 'empty-title' }, '문서가 없습니다'), '＋ 새 문서 버튼으로 추가하세요']));
    return;
  }
  
  const grid = el('div', { class: 'doc-grid' });
  filtered.forEach(d => {
    const card = el('div', { class: 'doc-card' });
    card.appendChild(el('div', { class: 'doc-actions' }, [
      el('button', { class: 'btn-icon', title: '수정', onclick: () => openDocumentForm(d) }, '✏'),
      el('button', { class: 'btn-icon', title: '삭제', onclick: () => confirmDelete('documents', d.doc_id) }, '🗑')
    ]));
    if (d.type) card.appendChild(el('div', { class: 'doc-type' }, d.type));
    card.appendChild(el('div', { class: 'doc-title' }, d.title || '—'));
    card.appendChild(el('div', { class: 'doc-meta' }, [
      fmtDate(d.date),
      ' · ', d.direction || '', 
      ' · ', d.from_org || '', d.to_org ? ' → ' + d.to_org : ''
    ].filter(Boolean).join('')));
    if (d.summary) card.appendChild(el('div', { class: 'doc-summary' }, d.summary));
    if (d.file_url) card.appendChild(el('a', { 
      href: d.file_url, target: '_blank', 
      style: { display: 'inline-block', marginTop: '8px', fontSize: '12px', color: 'var(--primary)', fontWeight: '600' } 
    }, '📎 파일 열기'));
    grid.appendChild(card);
  });
  root.appendChild(grid);
}

// ═══════════════════════════════════════════════════════════════
//  Milestones 페이지
// ═══════════════════════════════════════════════════════════════
function renderMilestones(root) {
  const all = STATE.data.milestones.slice().sort((a,b) => (a.date || '').localeCompare(b.date || ''));
  if (all.length === 0) {
    root.appendChild(el('div', { class: 'empty' }, [el('div', { class: 'empty-title' }, '마일스톤이 없습니다'), '＋ 새 마일스톤 버튼으로 추가하세요']));
    return;
  }
  
  const today = new Date(); today.setHours(0,0,0,0);
  const upcoming = all.filter(m => new Date(m.date) >= today);
  const past = all.filter(m => new Date(m.date) < today);
  
  if (upcoming.length > 0) {
    root.appendChild(el('div', { class: 'section-header' }, [
      el('div', { class: 'section-title' }, `다가오는 마일스톤 · ${upcoming.length}건`),
      el('div', { class: 'section-sub' }, '날짜순 정렬')
    ]));
    const tl = el('div', { class: 'ms-timeline', style: { marginBottom: '32px' } });
    upcoming.forEach(m => tl.appendChild(milestoneItemFull(m)));
    root.appendChild(tl);
  }
  
  if (past.length > 0) {
    root.appendChild(el('div', { class: 'section-header' }, [
      el('div', { class: 'section-title' }, `지난 마일스톤 · ${past.length}건`),
      el('div', { class: 'section-sub' }, '')
    ]));
    const tl = el('div', { class: 'ms-timeline' });
    past.reverse().forEach(m => tl.appendChild(milestoneItemFull(m)));
    root.appendChild(tl);
  }
}

function milestoneItemFull(m) {
  const item = el('div', { class: 'ms-item' });
  const dd = dDay(m.date);
  if (dd) {
    const diff = Math.round((new Date(m.date) - new Date()) / 86400000);
    let cls = '';
    if (diff < 0) cls = 'past';
    else if (diff <= 3) cls = 'urgent';
    item.appendChild(el('div', { class: 'ms-d-day ' + cls }, dd));
  }
  item.appendChild(el('div', { 
    style: { position: 'absolute', top: '10px', right: '60px', display: 'flex', gap: '2px' }
  }, [
    el('button', { class: 'btn-icon', title: '수정', onclick: () => openMilestoneForm(m) }, '✏'),
    el('button', { class: 'btn-icon', title: '삭제', onclick: () => confirmDelete('milestones', m.milestone_id) }, '🗑')
  ]));
  item.appendChild(el('div', { class: 'ms-date' }, fmtDate(m.date) + (m.round ? ` · Round ${m.round}` : '') + (m.brand_id ? ' · ' + nameOfBrand(m.brand_id) : '')));
  item.appendChild(el('div', { class: 'ms-title' }, m.title || '—'));
  if (m.description) item.appendChild(el('div', { class: 'ms-desc' }, m.description));
  return item;
}

function renderSettings(root) {

    el('input', {
      class: 'form-input',
      id: 'urlInput',
      type: 'text',
      placeholder: 'https://script.google.com/macros/s/AKfycb.../exec',
      value: CONFIG.APPS_SCRIPT_URL || ''
    }),
    el('div', { class: 'form-hint' }, '값은 이 브라우저에만 저장됩니다 (localStorage). 다른 PC에서는 다시 입력 필요.')
  ]));
  
  // 시크릿 키 (읽기 전용)
  panel.appendChild(el('div', { class: 'form-field full', style: { marginTop: '14px' } }, [
    el('label', { class: 'form-label' }, '시크릿 키 (Apps Script와 동일해야 함)'),
    el('input', {
      class: 'form-input',
      type: 'text',
      value: CONFIG.SECRET_KEY,
      readonly: 'true',
      style: { fontFamily: 'var(--font-mono)', background: 'var(--surface-alt)' }
    })
  ]));
  
  panel.appendChild(el('div', { style: { display: 'flex', gap: '8px', marginTop: '20px' } }, [
    el('button', { class: 'btn btn-primary', onclick: () => {
      const v = document.getElementById('urlInput').value.trim();
      if (!v) { toast('URL을 입력해주세요', 'err'); return; }
      localStorage.setItem('appsScriptUrl', v);
      CONFIG.APPS_SCRIPT_URL = v;
      toast('저장됨. 데이터를 불러옵니다...');
      bootApp();
    } }, '저장 후 연결'),
    el('button', { class: 'btn btn-secondary', onclick: () => {
      localStorage.removeItem('appsScriptUrl');
      CONFIG.APPS_SCRIPT_URL = '';
      STATE.loaded = false;
      toast('URL이 초기화되었습니다');
      renderContent();
      renderSidebarFooter();
    } }, '초기화')
  ]));
  
  // ─── 타임라인 캠페인 기간 설정 ───
  panel.appendChild(el('div', { style: { marginTop: '36px', paddingTop: '20px', borderTop: '1px solid var(--border)' } }, [
    el('h3', { style: { fontFamily: 'var(--font-display)', fontSize: '15px', fontWeight: '600', marginBottom: '6px' } }, '타임라인 캠페인 기간'),
    el('p', { style: { color: 'var(--text-muted)', marginBottom: '14px', fontSize: '12px' } }, 
      '타임라인 페이지의 가로축 범위. 캠페인이 늘어나거나 줄어들면 여기서 조정.'),
    el('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '10px' } }, [
      el('div', { class: 'form-field' }, [
        el('label', { class: 'form-label' }, '연도'),
        el('input', { 
          class: 'form-input', id: 'tlYearInput', type: 'number',
          value: tlYear(), min: 2024, max: 2030, step: 1
        })
      ]),
      el('div', { class: 'form-field' }, [
        el('label', { class: 'form-label' }, '시작 주차'),
        el('input', { 
          class: 'form-input', id: 'tlStartInput', type: 'number',
          value: tlStart(), min: 1, max: 53, step: 1
        }),
        el('div', { class: 'form-hint', id: 'tlStartHint' }, '주차 → 날짜 미리보기')
      ]),
      el('div', { class: 'form-field' }, [
        el('label', { class: 'form-label' }, '종료 주차'),
        el('input', { 
          class: 'form-input', id: 'tlEndInput', type: 'number',
          value: tlEnd(), min: 1, max: 53, step: 1
        }),
        el('div', { class: 'form-hint', id: 'tlEndHint' }, '주차 → 날짜 미리보기')
      ])
    ]),
    el('div', { style: { display: 'flex', gap: '8px', marginTop: '14px', alignItems: 'center' } }, [
      el('button', { class: 'btn btn-primary', onclick: () => {
        const y = Number(document.getElementById('tlYearInput').value);
        const s = Number(document.getElementById('tlStartInput').value);
        const e = Number(document.getElementById('tlEndInput').value);
        if (!y || y < 2024 || y > 2030) { toast('연도를 확인해주세요 (2024~2030)', 'err'); return; }
        if (!s || !e || s < 1 || e > 53 || s >= e) { toast('주차 범위를 확인해주세요 (시작 < 종료, 1~53)', 'err'); return; }
        if (e - s > 52) { toast('한 해 최대 53주 — 범위가 너무 큽니다', 'err'); return; }
        localStorage.setItem('tlYear', y);
        localStorage.setItem('tlWkStart', s);
        localStorage.setItem('tlWkEnd', e);
        CONFIG.TL_YEAR = y;
        CONFIG.TL_WK_START = s;
        CONFIG.TL_WK_END = e;
        toast('타임라인 기간이 저장되었습니다 (' + (e - s + 1) + '주)');
        renderContent();
      } }, '캠페인 기간 저장'),
      el('button', { class: 'btn btn-secondary', onclick: () => {
        document.getElementById('tlYearInput').value = 2026;
        document.getElementById('tlStartInput').value = 14;
        document.getElementById('tlEndInput').value = 44;
        updateTlPreview();
      } }, '기본값으로'),
      el('span', { id: 'tlSpan', style: { marginLeft: 'auto', fontSize: '11.5px', color: 'var(--text-muted)' } }, 
        '현재: ' + tlYear() + ' W' + tlStart() + '~W' + tlEnd() + ' (' + (tlEnd() - tlStart() + 1) + '주)')
    ])
  ]));
  
  // 주차 → 날짜 미리보기 갱신
  function updateTlPreview() {
    const y = Number(document.getElementById('tlYearInput').value) || 2026;
    const s = Number(document.getElementById('tlStartInput').value) || 1;
    const e = Number(document.getElementById('tlEndInput').value) || 1;
    try {
      const sMon = tlWeekToMonday(y, s);
      const eMon = tlWeekToMonday(y, e);
      document.getElementById('tlStartHint').textContent = 'W' + s + ' 월요일 = ' + (sMon.getMonth()+1) + '/' + sMon.getDate();
      document.getElementById('tlEndHint').textContent = 'W' + e + ' 월요일 = ' + (eMon.getMonth()+1) + '/' + eMon.getDate();
      if (e > s) {
        document.getElementById('tlSpan').textContent = '미리보기: ' + y + ' W' + s + '~W' + e + ' (' + (e - s + 1) + '주)';
      }
    } catch(_) {}
  }
  // 초기 미리보기 + 입력 이벤트
  setTimeout(() => {
    updateTlPreview();
    ['tlYearInput','tlStartInput','tlEndInput'].forEach(id => {
      const elInp = document.getElementById(id);
      if (elInp) elInp.addEventListener('input', updateTlPreview);
    });
  }, 0);
  
  // 사용법 안내
  panel.appendChild(el('div', { style: { marginTop: '36px', paddingTop: '20px', borderTop: '1px solid var(--border)' } }, [
    el('h3', { style: { fontFamily: 'var(--font-display)', fontSize: '15px', fontWeight: '600', marginBottom: '10px' } }, '사용법 요약'),
    el('ol', { style: { paddingLeft: '20px', color: 'var(--text-muted)', fontSize: '13px', lineHeight: '1.8' } }, [
      el('li', {}, '구글시트 → 확장 프로그램 > Apps Script'),
      el('li', {}, 'Code.gs 파일 내용 전체를 복붙'),
      el('li', {}, '함수 목록에서 setup 선택 → 실행 → 권한 승인'),
      el('li', {}, '배포 > 새 배포 > 웹앱 (실행: 나, 액세스: 모든 사용자)'),
      el('li', {}, '발급된 URL을 위 입력란에 붙여넣기 → 저장 후 연결')
    ])
  ]));
  
  root.appendChild(panel);
}

// 모달 Esc 키 핸들러 (전역, 모달 열릴 때 등록/닫을 때 제거)
let _modalEscHandler = null;
let _modalOnClose = null;  // 닫힐 때 호출되는 콜백 (자식 모달 → 부모 reopen 등)

function openModal({ title, body, footer, wide, onMount, onClose }) {
  // 이전 모달의 onClose는 호출하지 않음 (새 모달이 덮어쓰는 경우)
  // 단, Esc 핸들러는 정리
  if (_modalEscHandler) {
    document.removeEventListener('keydown', _modalEscHandler);
    _modalEscHandler = null;
  }
  _modalOnClose = onClose || null;
  
  const overlay = document.getElementById('modalOverlay');
  overlay.innerHTML = '';
  
  const modal = el('div', { class: 'modal' + (wide ? ' wide' : '') });
  modal.appendChild(el('div', { class: 'modal-header' }, [
    el('div', { class: 'modal-title' }, title),
    el('button', { class: 'btn-icon', onclick: closeModal, title: '닫기' }, '✕')
  ]));
  modal.appendChild(el('div', { class: 'modal-body' }, body));
  if (footer) modal.appendChild(el('div', { class: 'modal-footer' }, footer));
  
  overlay.appendChild(modal);
  overlay.classList.add('show');
  
  // 배경 클릭 시 닫기 → 비활성화. Esc / X / 닫기 버튼만 닫기 가능.
  overlay.onclick = null;
  
  // Esc 키 닫기 핸들러 등록
  _modalEscHandler = (e) => {
    if (e.key === 'Escape') {
      e.preventDefault();
      closeModal();
    }
  };
  document.addEventListener('keydown', _modalEscHandler);
  
  if (onMount) requestAnimationFrame(() => onMount());
}

function closeModal() {
  const overlay = document.getElementById('modalOverlay');
  overlay.classList.remove('show');
  overlay.innerHTML = '';
  
  // Esc 핸들러 정리
  if (_modalEscHandler) {
    document.removeEventListener('keydown', _modalEscHandler);
    _modalEscHandler = null;
  }
  
  // onClose 콜백 호출 (자식 모달 → 부모 reopen 등)
  const cb = _modalOnClose;
  _modalOnClose = null;
  if (cb) cb();
}

function confirmDelete(sheet, id) {
  openModal({
    title: '삭제하시겠습니까?',
    body: el('div', { style: { fontSize: '14px', color: 'var(--text-muted)' } }, 
      `${sheet} 시트의 ${id} 항목을 영구 삭제합니다. 이 작업은 되돌릴 수 없습니다.`),
    footer: [
      el('button', { class: 'btn btn-secondary', onclick: closeModal }, '취소'),
      (() => {
        const btn = el('button', { class: 'btn btn-danger' }, '삭제');
        btn.onclick = async () => {
          await withButtonLoading(btn, async () => {
            await apiDelete(sheet, id);          }, { loadingText: '삭제 중...', successText: '✓ 삭제됨' });
          closeModal();
          renderContent();
          renderNav();
        };
        return btn;
      })()
    ]
  });
}

function field(label, name, opts = {}) {
  const wrap = el('div', { class: 'form-field' + (opts.full ? ' full' : '') });
  wrap.appendChild(el('label', { class: 'form-label' }, label));
  
  if (opts.type === 'select') {
    const sel = el('select', { class: 'form-select', name }, [
      el('option', { value: '' }, opts.placeholder || '선택'),
      ...opts.options.map(([v, l]) => {
        const o = el('option', { value: v }, l);
        if (String(opts.value || '') === String(v)) o.selected = true;
        return o;
      })
    ]);
    wrap.appendChild(sel);
  } else if (opts.type === 'textarea') {
    wrap.appendChild(el('textarea', { class: 'form-textarea', name, placeholder: opts.placeholder || '' }, opts.value || ''));
  } else {
    wrap.appendChild(el('input', { 
      class: 'form-input', name, 
      type: opts.type || 'text',
      placeholder: opts.placeholder || '',
      value: opts.value != null ? opts.value : ''
    }));
  }
  if (opts.hint) wrap.appendChild(el('div', { class: 'form-hint' }, opts.hint));
  return wrap;
}

function formData(form) {
  const data = {};
  Array.from(form.elements).forEach(elm => {
    if (elm.name) data[elm.name] = elm.value;
  });
  return data;
}

        progressFill,
        el('div', { class: 'save-progress-text' }, [progressMsg, progressPct])
      ]);
      
      const updateProgress = (pct, msg) => {
        const p = Math.round(pct);
        progressFill.style.width = p + '%';
        progressPct.textContent = p + '%';
        if (msg) progressMsg.textContent = msg;
      };
      
      // 버튼 자리에 진행률 바 표시 (저장 버튼 + 초기화 버튼이 들어있는 부모)

      const initBtn = saveBtn.previousElementSibling;
      if (initBtn) initBtn.disabled = true;
      saveBtn.parentNode.insertBefore(progressBar, saveBtn);
      
      let saved = { stakeholders: 0, thread: 0, logs: 0 };
      
      try {
        // ─── 1) 새 stakeholders 등록 (0 → 20%) ───
        const stakesToAdd = newStakeChecks.filter(s => s.cb.checked);
        const newStakeMap = {};
        
        if (stakesToAdd.length === 0) {
          updateProgress(20, '연락처: 추가할 사람 없음');
        } else {
          for (let i = 0; i < stakesToAdd.length; i++) {
            const sc = stakesToAdd[i];
            const pct = (20 * i / stakesToAdd.length);
            updateProgress(pct, `연락처 등록 ${i+1}/${stakesToAdd.length} — ${sc.nameInp.value.trim() || sc.email}`);
            
            const stakeData = {
              name_ko: sc.nameInp.value.trim() || sc.email.split('@')[0],
              email: sc.email,
              org: sc.org,
              related_brand_id: '',
              contact_role: '',
              role: '',
              team: '',
              phone: '',
              notes: '스레드 일괄 등록에서 자동 추가됨'
            };
            const res = await apiCreate('stakeholders', stakeData);
            newStakeMap[sc.email] = res.id;
            saved.stakeholders++;
          }
          updateProgress(20, '연락처 ' + saved.stakeholders + '명 등록 완료');
        }
        
        // ─── 2) 새 스레드 생성 또는 기존 갱신 (20 → 30%) ───
        updateProgress(22, r.existingThread ? '기존 스레드 매칭 중...' : '새 스레드 생성 중...');
        let threadId;
        if (r.existingThread) {
          threadId = r.existingThread.thread_id;
          const updates = {};
          if (fCurrentStage.value.trim() !== (r.existingThread.current_stage || '')) {
            updates.current_stage = fCurrentStage.value.trim();
          }
          if (fNextAction.value.trim() !== (r.existingThread.next_action || '')) {
            updates.next_action = fNextAction.value.trim();
          }
          if (Object.keys(updates).length > 0) {
            await apiUpdate('mail_threads', threadId, updates);
          }
        } else {
          const threadData = {
            name: fThreadName.value.trim() || r.baseSubject,
            subtitle: '',
            client_org: fClientOrg.value.trim(),
            status: 'active',
            current_stage: fCurrentStage.value.trim(),
            next_action: fNextAction.value.trim(),
            kickoff_date: fKickoffDate.value
          };
          const res = await apiCreate('mail_threads', threadData);
          threadId = res.id;
          saved.thread = 1;
        }
        updateProgress(30, '스레드 ' + (r.existingThread ? '매칭' : '생성') + ' 완료');
        
        // ─── 3) STATE 1차 갱신 (30 → 40%) ───
        updateProgress(32, '데이터 동기화 중...');        updateProgress(40, '메일 등록 준비 완료');
        
        // ─── 4) 각 메일을 logs로 등록 (40 → 90%) — 가장 오래 ───
        const resolveStakeId = (email) => {
          if (!email) return '';
          if (newStakeMap[email]) return newStakeMap[email];
          const found = findStakeholderByEmail(email);
          return found ? found.stakeholder_id : '';
        };
        
        const totalMails = r.mails.length;
        for (let i = 0; i < totalMails; i++) {
          const m = r.mails[i];
          const pct = 40 + (50 * i / totalMails);
          const subjShort = (m.subject || '제목 없음').slice(0, 30) + (m.subject && m.subject.length > 30 ? '...' : '');
          updateProgress(pct, `메일 등록 ${i+1}/${totalMails} — ${subjShort}`);
          
          const fromId = resolveStakeId(m.from_email);
          const toIds = m.to_emails.map(resolveStakeId).filter(Boolean).join(',');
          const ccIds = (m.cc_emails || []).map(resolveStakeId).filter(Boolean).join(',');
          const attachStr = (m.attachments || []).join('\n');
          
          const logData = {
            date: m.date,
            time: m.time,
            type: '메일',
            direction: inferMailDirection(m.from_email),
            brand_id: '',
            category: '',
            from_id: fromId,
            to_ids: toIds,
            cc_ids: ccIds,
            subject: m.subject,
            summary: m.body,
            attachments_link: attachStr,
            thread_id: threadId
          };
          
          await apiCreate('logs', logData);
          saved.logs++;
        }
        updateProgress(90, '메일 ' + saved.logs + '건 등록 완료');
        
        // ─── 5) 최종 동기화 (90 → 100%) ───
        updateProgress(92, '최종 동기화 중...');        updateProgress(100, '✓ 완료!');
        
        // 짧은 지연 후 모달 닫기 (사용자가 완료 메시지 확인 가능)
        await new Promise(r => setTimeout(r, 400));
        
        closeModal();
        renderContent();
        toast('✓ 저장됨 — 메일 ' + saved.logs + '건' + 
              (saved.thread ? ' + 스레드 1' : '') +
              (saved.stakeholders ? ' + 연락처 ' + saved.stakeholders + '명' : ''));
      } catch (err) {
        // 실패 시 진행률 바 제거하고 버튼 복구

      }
    });
    
    previewWrap.appendChild(el('div', { 
      style: { display: 'flex', gap: '8px', marginTop: '14px' } 
    }, [

        class: 'btn btn-secondary', 
        onclick: () => { mailInput.value = ''; parsed = null; renderEmpty(); }
      }, '초기화'),
      saveBtn
    ]));
  }
  
  const body = el('div', { class: 'mp-grid' }, [
    el('div', {}, [
      el('div', { class: 'mp-row' }, [
        el('div', { class: 'mp-label' }, '메일 스레드 전체 텍스트'),

    wide: true,

}

function openMailParseModal(defaults) {
  const session = { saved: 0 };
  let parsedState = null;
  
  // 좌측: 입력
  const brandSel = el('select', { class: 'mp-input' });
  brandSel.appendChild(el('option', { value: '' }, '(선택)'));
  brandOptions().forEach(([id, label]) => {
    const opt = el('option', { value: id }, label);
    if (defaults && defaults.brand_id === id) opt.selected = true;
    brandSel.appendChild(opt);
  });
  
  const mailInput = el('textarea', { 
    class: 'mp-input',
    placeholder: '메일 전체를 그대로 붙여넣으세요...\n\n• 양식 A: "보낸 사람 / 받는 사람 / 참조" 키워드 형식\n• 양식 B: "----- Original Message -----" 인용 형식\n\n→ 자동 감지됩니다',
    rows: 16
  });
  
  const previewWrap = el('div', { class: 'mp-preview-wrap' });
  
  const renderEmpty = (msg, sub) => {
    previewWrap.innerHTML = '';
    previewWrap.appendChild(el('div', { class: 'mp-empty' }, [
      el('div', { class: 'mp-empty-title' }, msg || '파싱 결과가 여기 표시됩니다'),
      sub || '좌측에 메일을 붙여넣고 🪄 파싱 버튼을 누르세요'
    ]));
  };
  renderEmpty();
  
  const sessionInfo = el('div', { class: 'mp-session' }, '이번 세션 저장: 0건');
  function updateSession() {
    sessionInfo.textContent = '이번 세션 저장: ' + session.saved + '건';
  }
  
  function doParse() {
    const result = parseMailText(mailInput.value);
    if (!result) {
      toast('메일 텍스트가 비어있습니다', 'err');
      return;
    }
    parsedState = result;
    renderPreview();
  }
  
  function renderPreview() {
    const r = parsedState;
    previewWrap.innerHTML = '';
    
    const fromS = findStakeholderByEmail(r.from_email);
    const toMatched = r.to_emails.map(e => ({ email: e, s: findStakeholderByEmail(e) }));
    const ccMatched = r.cc_emails.map(e => ({ email: e, s: findStakeholderByEmail(e) }));
    const direction = inferMailDirection(r.from_email);
    
    // 폼 필드 (편집 가능)
    const f = {};
    
    f.subject = el('input', { type: 'text', class: 'mp-input', value: r.subject });
    f.date = el('input', { type: 'text', class: 'mp-input', value: r.date, placeholder: 'YYYY-MM-DD' });
    f.time = el('input', { type: 'text', class: 'mp-input', value: r.time, placeholder: 'HH:MM' });
    
    f.direction = el('select', { class: 'mp-input' });
    [['수신','수신'],['발신','발신'],['내부메모','내부메모']].forEach(([v,l]) => {
      const o = el('option', { value: v }, l);
      if (v === direction) o.selected = true;
      f.direction.appendChild(o);
    });
    
    f.from_id = el('select', { class: 'mp-input' });
    f.from_id.appendChild(el('option', { value: '' }, '(선택)'));
    stakeholderOptions().forEach(([id, lbl]) => {
      const o = el('option', { value: id }, lbl);
      if (fromS && fromS.stakeholder_id === id) o.selected = true;
      f.from_id.appendChild(o);
    });
    
    const fromBadge = fromS
      ? el('span', { class: 'mp-match mp-match-ok' }, '✓ ' + (fromS.name_ko || fromS.name_en) + ' (' + fromS.stakeholder_id + ')')
      : (r.from_email ? el('span', { class: 'mp-match mp-match-warn' }, '⚠ ' + r.from_email + ' — 미등록') : null);
    
    const toIdsStr = toMatched.filter(x => x.s).map(x => x.s.stakeholder_id).join(',');
    f.to_ids = el('input', { type: 'text', class: 'mp-input', value: toIdsStr, placeholder: '예: S0101,S0102' });
    
    const toBadges = el('div', { class: 'mp-badges' }, toMatched.map(x => 
      x.s 
        ? el('span', { class: 'mp-match mp-match-ok' }, '✓ ' + (x.s.name_ko || x.s.name_en) + ' (' + x.s.stakeholder_id + ')')
        : el('span', { class: 'mp-match mp-match-warn' }, '⚠ ' + x.email)
    ));
    
    const ccBadges = ccMatched.length > 0 ? el('div', { class: 'mp-badges' }, ccMatched.map(x => 
      x.s 
        ? el('span', { class: 'mp-match mp-match-ok' }, (x.s.name_ko || x.s.name_en))
        : el('span', { class: 'mp-match mp-match-warn' }, '⚠ ' + x.email)
    )) : null;
    
    f.category = el('select', { class: 'mp-input' });
    f.category.appendChild(el('option', { value: '' }, '(미지정)'));
    [['모델계약','모델계약'],['브랜드계약','브랜드계약'],['메뉴개발','메뉴개발'],
     ['촬영','촬영'],['입금','입금'],['키비주얼','키비주얼'],['판촉물','판촉물'],
     ['유튜브','유튜브'],['노출','노출'],['KPI','KPI'],['기타','기타']].forEach(([v,l]) => {
      f.category.appendChild(el('option', { value: v }, l));
    });
    
    f.summary = el('textarea', { class: 'mp-input', rows: 6 });
    f.summary.value = r.body;
    
    const formatChip = el('div', { class: 'mp-format' }, [
      el('span', { class: 'mp-chip mp-chip-' + r.format }, '양식 ' + r.format.toUpperCase() + ' 자동 감지됨'),
    ]);
    
    previewWrap.appendChild(formatChip);
    
    const row = (label, input) => el('div', { class: 'mp-row' }, [
      el('div', { class: 'mp-label' }, label), input
    ]);
    
    previewWrap.appendChild(row('제목', f.subject));
    previewWrap.appendChild(el('div', { class: 'mp-inline-fields' }, [
      row('날짜', f.date),
      row('시간', f.time),
      row('방향', f.direction),
    ]));
    previewWrap.appendChild(row('보낸 사람', f.from_id));
    if (fromBadge) previewWrap.appendChild(fromBadge);
    previewWrap.appendChild(row('받는 사람 (ID 콤마 구분)', f.to_ids));
    if (toBadges.children.length) previewWrap.appendChild(toBadges);
    if (ccBadges) {
      previewWrap.appendChild(el('div', { class: 'mp-row' }, [
        el('div', { class: 'mp-label' }, '참조 (저장 안 됨, 참고용)'),
        ccBadges
      ]));
    }
    previewWrap.appendChild(row('카테고리', f.category));
    previewWrap.appendChild(row('요약', f.summary));
    
    // 저장 버튼
    const saveBtn = el('button', { class: 'btn btn-primary', style: { flex: '1' } }, '💾 저장하고 다음');
    saveBtn.addEventListener('click', async () => {
      if (!brandSel.value) {
        toast('좌측에서 브랜드를 선택해주세요', 'err');
        return;
      }
      if (!f.date.value) {
        toast('날짜가 비어있습니다', 'err');
        return;
      }
      saveBtn.disabled = true;
      saveBtn.textContent = '저장 중...';
      try {
        const data = {
          date: f.date.value,
          time: f.time.value,
          type: '메일',
          direction: f.direction.value,
          brand_id: brandSel.value,
          category: f.category.value,
          from_id: f.from_id.value,
          to_ids: f.to_ids.value,
          subject: f.subject.value,
          summary: f.summary.value,
        };
        await apiCreate('logs', data);
        session.saved++;        mailInput.value = '';
        parsedState = null;
        renderEmpty('✓ 저장됨 — 다음 메일 붙여넣기', '브랜드는 그대로 유지됩니다. 다른 브랜드면 좌측에서 변경');
        updateSession();
        toast('저장되었습니다 (총 ' + session.saved + '건)');
      } catch (err) {
        saveBtn.disabled = false;
        saveBtn.textContent = '💾 저장하고 다음';
        toast(err.message || '저장 실패', 'err');
      }
    });
    
    previewWrap.appendChild(el('div', { 
      style: { marginTop: '14px', display: 'flex', gap: '8px' } 
    }, [
      el('button', { 
        class: 'btn btn-secondary', 
        onclick: () => { mailInput.value = ''; parsedState = null; renderEmpty(); }
      }, '초기화'),
      saveBtn
    ]));
  }
  
  const body = el('div', { class: 'mp-grid' }, [
    el('div', {}, [
      el('div', { class: 'mp-row' }, [
        el('div', { class: 'mp-label' }, '관련 브랜드 ★'),
        brandSel,
        el('div', { style: { fontSize: '10.5px', color: 'var(--text-faint)', marginTop: '3px' } }, 
          '미리 선택 — 파싱한 메일이 이 브랜드에 자동 연결됩니다')
      ]),
      el('div', { class: 'mp-row' }, [
        el('div', { class: 'mp-label' }, '메일 텍스트'),
        mailInput
      ]),
      el('button', { 
        class: 'btn btn-primary', 
        onclick: doParse, 
        style: { width: '100%', marginTop: '6px' } 
      }, '🪄 파싱'),
      sessionInfo
    ]),
    el('div', {}, [previewWrap])
  ]);
  
  openModal({
    title: '메일 일괄 등록',
    body,
    wide: true,
    footer: [
      el('button', { class: 'btn btn-secondary', onclick: closeModal }, '닫기')
    ]
  });
}

//  Stakeholder 폼
