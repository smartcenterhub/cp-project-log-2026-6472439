function openStakeholderForm(existing) {
  const e = existing || {};
  const isEdit = !!existing;
  
  // 참여 스레드 자동 추출 (logs를 통해 from_id/to_ids 매칭)
  let threadsSection = null;
  if (isEdit && e.stakeholder_id) {
    const involvedThreadIds = new Set();
    (STATE.data.logs || []).forEach(l => {
      const involved = l.from_id === e.stakeholder_id || 
                       (l.to_ids || '').split(/[,;]/).map(x => x.trim()).includes(e.stakeholder_id);
      if (involved && l.thread_id) involvedThreadIds.add(l.thread_id);
    });
    
    const involvedThreads = (STATE.data.mail_threads || [])
      .filter(t => involvedThreadIds.has(t.thread_id));
    
    if (involvedThreads.length > 0) {
      threadsSection = el('div', { 
        style: { 
          background: 'rgba(58, 134, 255, 0.05)', 
          border: '1px solid rgba(58, 134, 255, 0.15)',
          borderRadius: '6px', padding: '10px 12px', marginBottom: '14px'
        } 
      }, [
        el('div', { 
          style: { fontSize: '10.5px', fontWeight: '700', letterSpacing: '0.04em', 
                   color: '#1d4ed8', textTransform: 'uppercase', marginBottom: '8px' } 
        }, '📧 참여 메일스레드 ' + involvedThreads.length + '건'),
        ...involvedThreads.map(t => {
          const logsInThread = (STATE.data.logs || []).filter(l => 
            l.thread_id === t.thread_id && (
              l.from_id === e.stakeholder_id || 
              (l.to_ids || '').split(/[,;]/).map(x => x.trim()).includes(e.stakeholder_id)
            )
          );
          return el('div', { 
            style: { 
              fontSize: '12px', padding: '6px 8px', marginBottom: '4px',
              background: 'white', borderRadius: '4px', cursor: 'pointer',
              border: '1px solid var(--border-soft, rgba(0,0,0,0.05))'
            },
            onclick: () => { closeModal(); openMailThreadDetail(t); }
          }, [
            el('div', { style: { fontWeight: '600' } }, t.name || '(이름 없음)'),
            el('div', { style: { fontSize: '10.5px', color: 'var(--text-muted)', marginTop: '2px' } },
              [
                '이 스레드에서 ' + logsInThread.length + '회 등장',
                t.current_stage || null,
                t.client_org ? '· ' + t.client_org : null
              ].filter(Boolean).join(' · '))
          ]);
        })
      ]);
    }
  }
  
  const form = el('form', { class: 'form-grid' }, [
    field('이름 (한글)', 'name_ko', { value: e.name_ko }),
    field('이름 (영문)', 'name_en', { value: e.name_en }),
    field('소속', 'org', { type: 'select', value: e.org, options: [
      ['쿠팡이츠','쿠팡이츠'],['올리브파트너스','올리브파트너스'],['라꼰즈','라꼰즈'],
      ['셰프','셰프'],['셰프소속사','셰프소속사'],['브랜드사','브랜드사'],['기타','기타']
    ]}),
    field('메일 역할', 'contact_role', { 
      type: 'select', value: e.contact_role, 
      options: [['메인','⭐ 메인 (실제 발/수신자)'],['참조','참조 (CC)'],['그룹메일','그룹메일']],
      placeholder: '(미지정)',
      hint: '메일 보낼 때 To에 넣을지 CC에 넣을지 구분용'
    }),
    field('역할', 'role', { value: e.role, placeholder: '예: 팀장, 이사, KAM' }),
    field('팀', 'team', { value: e.team, placeholder: '예: Comms, B2B' }),
    field('관련 브랜드', 'related_brand_id', { type: 'select', value: e.related_brand_id, options: brandOptions(), placeholder: '(선택)' }),
    field('이메일', 'email', { type: 'email', value: e.email, full: true }),
    field('전화번호', 'phone', { value: e.phone, full: true }),
    field('메모', 'notes', { type: 'textarea', value: e.notes, full: true })
  ]);
  
  const body = threadsSection ? el('div', {}, [threadsSection, form]) : form;
  
  openModal({
    title: isEdit ? '연락처 수정' : '새 연락처',
    body,
    footer: [
      isEdit ? el('button', { class: 'btn btn-danger', onclick: () => { closeModal(); confirmDelete('stakeholders', existing.stakeholder_id); } }, '삭제') : null,
      el('button', { class: 'btn btn-secondary', onclick: closeModal }, '취소'),
      (() => {
          const btn = el('button', { class: 'btn btn-primary' }, isEdit ? '저장' : '추가');
          btn.onclick = async () => {
            const data = formData(form);
            await withButtonLoading(btn, async () => {
              if (isEdit) await apiUpdate('stakeholders', existing.stakeholder_id, data);
              else await apiCreate('stakeholders', data);            }, { loadingText: isEdit ? '저장 중...' : '추가 중...', successText: isEdit ? '✓ 수정됨' : '✓ 저장됨' });
            closeModal();
            renderContent();
          };
          return btn;
        })()
    ].filter(Boolean)
  });
}

function openTaskForm(existing) {

// ═══════════════════════════════════════════════════════════════
//  부팅
// ═══════════════════════════════════════════════════════════════
async function bootApp() {
  // 0% — 진입
  TopLoader.start();
  
  renderApp();
  renderTopbar();
  if (!CONFIG.APPS_SCRIPT_URL) {
    renderContent();
    TopLoader.done();
    return;
  }
  
  // 30% — 초기화 완료 (CONFIG / DOM 준비, fetch 시작 직전)
  TopLoader.set(0.3);
  
  showLoading();
  try {
    await apiFetchAll(true);
    
    // 70% — 6개 시트 데이터 모두 받음 (brands + stakeholders + logs + tasks + documents + milestones)
    TopLoader.set(0.7);
    
    renderContent();
    renderNav();
    renderSidebarFooter();
    
    // 100% — 렌더링 완료 → 0.2s 후 자동 페이드 아웃 (done() 내부에서 처리)
    TopLoader.set(1.0);
    TopLoader.done();
  } catch (err) {
    TopLoader.error();
    document.getElementById('content').innerHTML = '';
    document.getElementById('content').appendChild(el('div', { class: 'config-panel' }, [
      el('h2', { style: { fontFamily: 'var(--font-display)', marginBottom: '8px', color: 'var(--warn)' } }, '연결 실패'),
      el('p', { style: { color: 'var(--text-muted)', marginBottom: '14px' } }, err.message),
      el('button', { class: 'btn btn-secondary', onclick: () => navigate('settings') }, '설정 확인')
    ]));
  }
}

// 시작
bootApp();
</script>
